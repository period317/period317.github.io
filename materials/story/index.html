<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>이야기 구성 · 자료실 · Period.</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
  :root{
    --bg:#fff; --soft:#fafafa; --pink:#F1296C;
    --text:#191F28; --text-2:#4E5968; --text-3:#8B95A1;
    --border:#F2F4F6; --border-strong:#E5E8EB;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);
    font-family:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,sans-serif;
    line-height:1.65;font-size:15px;-webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  .wrap{max-width:760px;margin:0 auto;padding:2.5rem 1.5rem 5rem}

  /* header */
  .brand{
    font-size:.75rem;font-weight:700;letter-spacing:.5px;
    color:var(--pink);margin-bottom:.375rem;
  }
  .crumb{font-size:.8125rem;color:var(--text-3);margin-bottom:.5rem}
  .crumb a:hover{color:var(--text-2)}
  .crumb-sep{margin:0 .375rem;color:var(--border-strong)}
  h1{font-size:1.75rem;font-weight:800;margin:0 0 .375rem;letter-spacing:-.025em}
  .lead{font-size:.9375rem;color:var(--text-2);margin:0 0 2.5rem;line-height:1.7}

  /* list */
  .list{display:flex;flex-direction:column;gap:.5rem}
  .item{
    display:block;padding:1rem 1.125rem;
    border:1px solid var(--border);border-radius:14px;
    background:var(--bg);transition:all .15s ease;
  }
  .item:hover{border-color:var(--border-strong);background:var(--soft)}
  .item-top{display:flex;align-items:baseline;gap:.625rem;margin-bottom:.375rem}
  .item-num{
    font-size:.75rem;font-weight:700;color:var(--text-3);
    font-variant-numeric:tabular-nums;letter-spacing:.5px;
  }
  .item-title{font-size:1rem;font-weight:700;color:var(--text);letter-spacing:-.015em}
  .item-desc{font-size:.8125rem;color:var(--text-2);line-height:1.6;margin:0}

  .empty{
    border:1px dashed var(--border-strong);border-radius:14px;
    padding:1.5rem;text-align:center;
    font-size:.8125rem;color:var(--text-3);
  }

  .footer{
    margin-top:3rem;padding-top:1.5rem;border-top:1px solid var(--border);
    font-size:.75rem;color:var(--text-3);
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="brand">Period. · 자료실</div>
  <div class="crumb">
    자료실 <span class="crumb-sep">›</span> 이야기 구성
  </div>
  <h1>이야기 구성 과제</h1>
  <p class="lead">과제를 클릭하면 제시문·조건·예시 답안을 볼 수 있습니다.</p>

  <div class="list">

    <a class="item" href="./001/">
      <div class="item-top">
        <span class="item-num">001</span>
        <span class="item-title">포항 지진</span>
      </div>
      <p class="item-desc">3인칭 화자 '그(녀)'를 주인공으로, 지진 때문에 중요한 일을 취소할 수밖에 없는 이야기 구성 (800~1200자)</p>
    </a>

  </div>

  <div class="footer">
    © Period. · 영화입시 전문과외 · 수업 자료
  </div>

</div>
</body>
</html>
