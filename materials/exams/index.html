[{"type": "plain", "text": "2023 수시 영화 전공 [작문]"}, {"type": "instruction", "text": "1. 자신의 인생을 장르영화(멜로, 호러, 스릴러, 코미디 등)로 제작한다면 어느 장르가 적합하다고 생각하는지, 그리고 왜 그렇게 생각하는지 기술하시오."}, {"type": "instruction", "text": "2. 자신이 감독하여 영화를 만들고 나서 1년 뒤에 그 작품이 형편없다는 것을 알게 됐을 때 어떻게 할 것인지 기술하시오."}, {"type": "plain", "text": "3. 한밤중에 당신이 감독하는 영화의 마지막 장면을 촬영하고 있는데 주연배우가 갑자기 귀신에 씌웠을 때 어떤 일이 벌어질지, 그리고 당신은 어떻게 대처할지 기술해 보시오."}], "source_url": "https://blog.naver.com/365films/223377264766", "source_date": "2024. 3. 8."}], "2022": [{"sections": [{"type": "plain", "text": "2022 정시 영화전공[작문] [작문] : 작문시간 50분 문제은행식으로 출제되는 영화전공 작문 문제의 일부 (3문제 공개) 입니다. 1. 영사기 속에 사는 요정의 이야기를 사건을 넣어서 만들어보시오. 2. 필름 카메라와 디지털 카메라가 서로 싸우는 이야기를 만들어보시오. (의인화) 3. 휴대폰 없이 한 달을 살 때 당신에게 일어날 수 있는 사건과 그로 인한 극적인 변화를 기술해보시오."}], "source_url": "https://blog.naver.com/365films/223377264766", "source_date": "2024. 3. 8."}], "2021": [{"sections": [{"type": "plain", "text": "2021 수시 영화전공[작문] [작문 테스트] 문제은행식으로 출제되는 영화전공 작문 문제의 일부(3문제만 공개)입니다. - 이미지를 아래에 제시된 키워드와 연계하여 스토리 또는 에세이를 작문하시오. 1) 추상 2) 구상 3) 사랑 (작성시간 : 60분) - 이미지를 아래에 제시된 키워드와 연계하여 스토리 또는 에세이를 작문하시오. 1) 여성 2) 직장 3) 기획 (작성시간 : 60분) - 이미지를 아래에 제시된 키워드와 연계하여 스토리 또는 에세이를 작문하시오. 1) 참호 2) 전사 3) 구원 (작성시간 : 60분) 서울예대 영화과 합격증 온라인 수업 만으로 서울예대 영화과 합격한 후기 10년 차 베테랑 영화과 영화영상학과 입시 과외 교습소  입니다. 강남 영화과 영화영상학과 실기학원 과외"}], "source_url": "https://blog.naver.com/365films/223377264766", "source_date": "2024. 3. 8."}], "2019": [{"sections": [{"type": "plain", "text": "2019 정시 서울예술대학교 영화과 영화전공[작문] 기출문제 _ 영화과 면접 영화과작문 영화과 이미지분석 2019 정시 서울예술대학교 영화과 영화전공[작문] 기출문제 2019 정시 서울예술대학교 영화과 영화전공[작문] 기출문제 입니다. 전체 문제 중 일부 (3문제) 만 공개되었고, 이미지분석 문제는 미공개 입니다. 서울예대 영화과는 50분가량의 작문시험 후 이미지 분석과 개인구술면접을 치르게 됩니다. 영화과 실기에 총집합(?) 이라고 할 수 있습니다. 참고하시어 정시준비 잘 하시길 바랍니다! 2019 정시 서울예술대학교 영화과 영화전공[작문] 기출문제"}, {"type": "meta_info", "text": "- 자신이 전혀 기억하지 못하는 사람이 다가와 반갑게 인사하는데, 기억 못하는 사실을 들키지 않고 그 사람과 함께 한 시간을 보내는 방법을 기술하시오. (작성시간 : 50분)"}, {"type": "plain", "text": "- 거울 속의 내가 진짜 나에게 갑자기 말을 걸어오기 시작하는 장면을 만들어 보시오. (작성시간 : 50분) - 다음 생에 동물로 태어난다면 어떤 동물이었으면 좋겠으며, 그 이유는? (작성시간 : 50분) 수시모집에서 사용 했던 작문 답안지 예시도 함께 첨부합니다! 참고하세요!"}], "source_url": "https://blog.naver.com/365films/221721013657", "source_date": "2019. 11. 28."}, {"sections": [{"type": "year_meta", "year": "2019", "rest": "수시모집 서울예대 영화과 작문 기출문제 입니다."}, {"type": "plain", "text": "이미지는 비공개 이며, 작문문제만 공개되었습니다."}, {"type": "meta_info", "text": "서울예대 영화과는 수시모집에서 많은 인원을 선발하고, 실기비중이 80% 입니다."}, {"type": "plain", "text": "서울예대 영화과 실기준비를 원하는 친구들은 서둘러 주세요!"}, {"type": "year_meta", "year": "2019", "rest": "수시모집 서울예대 영화과 작문 기출문제"}, {"type": "plain", "text": "-본인이 가장 싫어하는 영화를 소개하고 그 이유를 설명해 주세요. -자신의 가족을 영화 캐릭터처럼 소개 해주세요. -서울예술대학교 영상학부 영화전공을 지원하는 동기를 설명해 주세요. <2021학년도 서울예술대학교 영상학부 영화과 수시/정시 기본계획안>"}], "source_url": "https://blog.naver.com/365films/221858003536", "source_date": "2020. 3. 17."}]}, "total_blocks": 9, "sparse": false, "sources": [{"url": "https://blog.naver.com/365films/224249542732", "title": "[ 영화과 학원 실기과외 ] 2026학년도 서울예대 영화과 수시 / 정시 작문 기출문제", "date": "2026. 4. 12."}, {"url": "https://blog.naver.com/365films/223441777114", "title": "[영화과 과외 학원 ] 2024학년도 서울예술대학교 영상학부 영화전공 작문 기출문제 _ 실기위주 영화과, 이미지분석, 구술면접, 전문대졸", "date": "2024. 5. 9."}, {"url": "https://blog.naver.com/365films/223377264766", "title": "[영화과 과외] 서울예대 영상 학부 영화전공  [작문] 기출문제 _ 실기 위주 영화과, 이미지 분석, 구술면접, 전문대 졸", "date": "2024. 3. 8."}, {"url": "https://blog.naver.com/365films/223371542643", "title": "[ 영화과 과외 학원 ] 서울예술대학교 영상 학부 수시 영화전공 영화과 이미지 분석 기출문제 _ 실기 위주, 전문대 졸, 이야기 구성, 구술면접 봐야 하는 영화", "date": "2024. 3. 3."}, {"url": "https://blog.naver.com/365films/221858003536", "title": "2019학년도 수시모집 서울예대 영화과 작문 기출문제", "date": "2020. 3. 17."}, {"url": "https://blog.naver.com/365films/221721013657", "title": "2019 정시 서울예술대학교 영화과 영화전공[작문] 기출문제 _ 영화과 면접 영화과작문 영화과 이미지분석", "date": "2019. 11. 28."}], "meta": {"category": "major", "admission": "2년제 / 수시·정시·전문대졸·해외이수자·농어촌·기초수급 모두 운영", "recruit": "수시 실기 26명 + 전문대졸 15명 / 정시 실기 10명 + 전문대졸 18명", "ratio": "실기 80% + 학생부 20% (국어·영어)", "stages": [{"name": "가. 작문", "detail": "제시어 3개 포함 12문장 이내 줄거리 (50분)"}, {"name": "나. 이미지 분석", "detail": "제시된 한 장 이미지를 미학적 차원에서 분석 (10분)"}, {"name": "다. 구두 문답", "detail": "이미지 분석 발표 + 영화 기초지식 질의응답 (3~4분)"}], "duration": "작문 50분 / 이미지 10분 / 구두 3~4분", "tip": "문장 앞 일련번호, 인물 첫 등장 시 \"이름(성별, 나이)\" 명시 필수"}}, "sejong": {"name": "세종대", "full_name": "세종대학교 영화예술학과(연출제작)", "exam_type": "스토리 구성 + 발표", "years": ["2025", "2022", "2019", "2016", "2015"], "blocks_by_year": {"2025": [{"sections": [{"type": "year_meta", "year": "2025", "rest": "실기 준비해서 인 서울 영화과 가는 법"}, {"type": "plain", "text": "[ 영화과 실기 과외 ] 세종대학교 영화예술학과(연출 제작)  기출문제 합격작 _ 스토리 구성, 실기 위주, 발표, 인 서울 영화과 A. 실기준비 시기에 정답은 존재하지 않습니다. 다만, 다수의 인서울, 수도권 영화과 영화영상학과에서 수시모집에서 많은 인원을 선발하는 만큼 수시를 희망하는 친구들은 최대한 빨리 시작하는 것이 좋습니다. 영화과 영화영상학과를 가고자 하는 열정이 있다면 세종대 영화예술학과 연출제작 전공 실기 학원 과외 세종대 영화예술학과 연출제작 실기 항목"}, {"type": "meta_info", "text": "1단계 스토리 구성 400 • 제한 시간 : 3시간 • 모집 인원의 6배수 선발"}, {"type": "plain", "text": "1단계 스토리구성 제시된 문제(상황, 단어, 사진, 그림 등이 제시될 수 있음)에 따라 스토리 구성하기 - 작품의도, 인물설정, 줄거리에 대해 구체적으로 작성 - 글씨를 크고 바르게 작성"}, {"type": "meta_info", "text": "2단계 발표 200 • 제한시간 : 5분 이내"}, {"type": "plain", "text": "2단계 발표 스토리 구성 관련 내용 및 전공 관련 사항에 대한 질의 응답 세종대 영화예술학과 연출제작 전공 실기 기출문제"}], "source_url": "https://blog.naver.com/365films/223377203431", "source_date": "2024. 3. 8."}], "2022": [{"sections": [{"type": "year_meta", "year": "2022", "rest": "세종대 영화예술 연출 제작 기출문제"}, {"type": "plain", "text": "제시문 고등학교. 아침. 학생들이 삼삼오오 등교를 하고 있다. 교문을 지나 발열 체크 기기를 지나는 학생들의 모습이 보이고, 학생들은 이 상황에 익숙해진 듯하다. 2학년 교실. 아침이라 학생들이 별로 오지 않아, 자리가 띄엄띄엄 채워져 있다. 한 학생이 들어오고, 교탁 앞에 선다. 학생이 교복 상의를 벗자 반짝이는 의상이 보인다. 그러고는 피리를 연주하는 학생. 순간, 반 학생들은 피리 소리에 맞추어 몸을 움직이기 시작한다. 피리 부는 학생은 반을 나가고, 학생들은 그 뒤를 따라가기 시작한다."}, {"type": "meta_info", "text": "제시어: 시간 여행"}, {"type": "plain", "text": "세종대 영화예술 연출 제작 실기 합격 수시 정시"}], "source_url": "https://blog.naver.com/365films/223377203431", "source_date": "2024. 3. 8."}], "2019": [{"sections": [{"type": "plain", "text": "2019년도 세종대 영화예술 연출 제작 기출문제 제시문 한 여자가 5층 건물 피트니스 센터에서 러닝머신(트레드밀) 위를 달리고 있다. 센터에는 여자뿐만 아니라 몇 명이 더 있다. 여자는 헤드폰 사이로 흘러나올 정도로 강한 헤비메탈 음악을 듣고 있다. 잠시 후, 음악이 멈춘 줄도 모르고 계속 달리는 여자, 얼마나 운동에 집중하고 있는지가 느껴진다. 센터 안에는 트레드밀 소리와 여자의 규칙적인 숨소리만 들린다. 여자는 갑자기 트레드밀을 멈추고 건물 아래 거리를 내려다본다. 거리에는 아무도 없고, 모든 불이 꺼져 있다. 건물이 잠시 흔들리는 것 같더니 아무소리도 들리지 않는다. 곧 피트니스 센터의 불도 꺼진다. 주제어 : 미래사회 (미래 세계) 제시어 : 가상현실"}], "source_url": "https://blog.naver.com/365films/223377203431", "source_date": "2024. 3. 8."}], "2016": [{"sections": [{"type": "plain", "text": "2016년  세종대 영화예술 연출 제작 기출문제 상황 -25세 남자 세종과 21세 여성 세희가 사귄 지 100일 만에 헤어졌다. 제시어 -  적반하장 / 노래방"}, {"type": "instruction", "text": "제시된 상황과 공간, 제시된 사자성어를 주제로 이야기를 구성하시오"}], "source_url": "https://blog.naver.com/365films/223377203431", "source_date": "2024. 3. 8."}], "2015": [{"sections": [{"type": "plain", "text": "2015년 세종대 영화예술 연출 제작 기출문제 상황 - 학급반장이 공원에서 내 어깨를 치고 가다. 제시어 - 물, 동아리활동"}, {"type": "instruction", "text": "제시된 단어 또는 문장(사진, 그림 등)을 사용하여 스토리를 구성하시오."}, {"type": "instruction", "text": "작품 의도, 인물 설정, 줄거리에 대해 구체적으로 작성하시오."}, {"type": "meta_info", "text": "시험시간 3시간"}], "source_url": "https://blog.naver.com/365films/223377203431", "source_date": "2024. 3. 8."}]}, "total_blocks": 5, "sparse": false, "sources": [{"url": "https://blog.naver.com/365films/223377203431", "title": "[ 영화과 실기 과외 ] 세종대학교 영화예술학과(연출 제작)  기출문제 합격작 _ 스토리 구성, 실기 위주, 발표, 인 서울 영화과", "date": "2024. 3. 8."}], "meta": {"category": "major", "admission": "수시 1차 실기 100%", "recruit": "소수 정예", "ratio": "1단계 스토리구성 400점 (6배수) / 2단계 발표 200점", "stages": [{"name": "1단계 스토리 구성", "detail": "제시된 문제(상황/단어/사진/그림)로 스토리 구성. 작품의도·인물·줄거리 구체적으로"}, {"name": "2단계 발표", "detail": "스토리 관련 + 전공 질의응답 (5분 이내)"}], "duration": "1단계 3시간", "tip": "시의성·사회문제 키워드 자주 출제. 글씨 크고 바르게 작성"}}, "soongsil": {"name": "숭실대", "full_name": "숭실대학교 영화예술학과 연출제작", "exam_type": "이미지카드 → 이야기 구성", "years": ["2022", "2021"], "blocks_by_year": {"2022": [{"sections": [{"type": "year_meta", "year": "2022", "rest": "숭실대학교 영화예술학과 실기고사 이미지카드를 준비했는데요"}, {"type": "plain", "text": "숭실대 영화예술학 연출 제작 전공은 코로나19로 인해 작년에 이어 올해 역시 비대면으로 실기고사가 이루어집니다. 공개 된 카드를 가지고 미리 준비해가는 형식으로 이야기 구성의 기본을 알고 소재를 찾는 것이 중요합니다. 비대면 실기고사 관련 자세한 내용은 2022.1.7.(금) 10:00에 입학처 홈페이지에 공지 예정인 수험생 유의사항을 참고하시기 바랍니다. 숭실대 영화예술 연출 전공 실기고사 준비 문의"}, {"type": "year_meta", "year": "2022", "rest": "정시 나군 영화예술전공 실기고사"}, {"type": "plain", "text": "(연출) - FAQ - -Q: 주어진 이미지란 어떤 것을 말하는 건가요? A: 수험생 본인이 사전에 입학처 홈페이지에 공지한 3개의 이미지카드 세트에서 각각 1개의 이미지 카드(총 3개)를 선택합니다. 선택한 이미지를 자세히 관찰하여 주인공을 설정합니다. 반드시 이미지에 대한 개인적인 해석을 바탕으로 주인공을 설정해야 합니다. 주인공이 겪는 사건을 자유롭게 구상하되 가급적 예측이 가능한 전개, 결론은 피해야 합니다. -Q: 준비시간과 평가시간은 어떻게 되나요? A: 사전에 공개한 이미지카드로 자유롭게 준비하고, 비대면 실기고사를 통해 4분간 평가합니다. - Q: 의상은 자유인가요? 지정 의상이 있나요? A: 자유입니다. 다만 본인의 신분이 드러나는 복장(교복, 본인의 이름이 새겨진 옷, 출신 학원명이 새겨진 옷 등) 착용을 금지합니다. - Q: 음악이나 소품 사용 가능할까요? A: 실기고사에서는 CD, Tape, MP3 등을 이용한 음악 사용 및 개인 소품 사용을 금지합니다."}, {"type": "meta_info", "text": "- Q: 시험 시간 변경이 가능한가요?"}, {"type": "plain", "text": "A: 개인별 지정일시는 변경할 수 없습니다."}, {"type": "meta_info", "text": "- Q: 실기고사 시간에 지각하면 어떻게 되나요?"}, {"type": "plain", "text": "A: 대기실 입실 완료 시각 이후에는 응시가 불가합니다. - Q: 실기고사 중에 4분이 넘어가면 어떻게 되나요? A: 4분이 초과되면 고사와 평가는 종료됩니다 이미지카드는 아래 파일을 확인하세요!!"}], "source_url": "https://blog.naver.com/365films/222604980783", "source_date": "2021. 12. 26."}], "2021": [{"sections": [{"type": "year_meta", "year": "2021", "rest": "#숭실대학교영화예술학과 #연출제작전공 실기고사 이미지 카드 공개되었습니다."}, {"type": "meta_info", "text": "숭실대 영화예술학과 연출제작전공은 기존 고사 당일  준비 시간을 주고 주어진 시간 내 이야기를 만들어 4분 내 발표였으나"}, {"type": "meta_info", "text": "코로나19로 인해 당일 8분 준비 시간을 없애고 사전에 이미지를 미리 공지하고 미리 준비해 가는 형식으로 바뀌었습니다."}, {"type": "plain", "text": "즉흥 #이야기구성 에 취약했던 친구들에게 기회가 아닐까 싶습니다. 1월 7일 (목)부터 원서접수가 시작되는데요, 본인의 장점을 파악하고, 학교 선택을 하여 좋은 결과 있길 바랍니다!"}, {"type": "year_meta", "year": "2021", "rest": "정시모집 숭실대학교 영화예술학과 연출 제작 전공  정시 나군"}, {"type": "plain", "text": "실기고사 변경사항 기존 당일 이미지 제시 준비 대면 고사 4분 발표 변경 후 이미지 온라인 공개 미리 이야기 구성 후 비대면 고사 4분 발표 #스토리구성 부터 #개인구술면접 까지 완벽하게 준비해 줍니다. #실기전형 및 #영화과학생부종합전형 을 준비 중인 친구들은 연락 주세요!"}, {"type": "year_meta", "year": "2021", "rest": "정시모집 숭실대학교 영화예술 연출 제작 전공 실기고사 이미지 카드 공개"}, {"type": "year_meta", "year": "2021", "rest": "정시 나군"}, {"type": "plain", "text": "숭실대학교 영화예술전공 실기고사(연출) - FAQ - -Q: 주어진 이미지란 어떤 것을 말하는 건가요? A: 수험생 본인이 사전에 입학처 홈페이지에 공지한 3개의 이미지 카드 세트에서 각각 1개의 이미지 카드(총 3개)를 선택합니다. 선택한 이미지를 자세히 관찰하여 주인공을 설정합니다. 반드시 이미지에 대한 개인적인 해석을 바탕으로 주인공을 설정해야 합니다. 주인공이 겪는 사건을 자유롭게 구상하되 가급적 예측이 가능한 전개, 결론은 피해야 합니다."}, {"type": "meta_info", "text": "-Q: 준비 시간과 평가 시간은 어떻게 되나요?"}, {"type": "plain", "text": "A: 사전에 공개한 이미지 카드로 자유롭게 준비하고, 비대면 실기고사를 통해 4분간 평가합니다. - Q: 의상은 자유인가요? 지정 의상이 있나요? A: 자유입니다. 다만 본인의 신분이 드러나는 복장(교복, 본인의 이름이 새겨진 옷, 출신 학원명이 새겨진 옷 등) 착용을 금지합니다. - Q: 음악이나 소품 사용 가능할까요? A: 실기 고사에서는 CD, Tape, MP3 등을 이용한 음악 사용 및 개인 소품 사용을 금지합니다."}, {"type": "meta_info", "text": "- Q: 시험 시간 변경이 가능한가요?"}, {"type": "plain", "text": "A: 개인별 지정 일시는 변경할 수 없습니다."}, {"type": "meta_info", "text": "- Q: 실기고사 시간에 지각하면 어떻게 되나요?"}, {"type": "plain", "text": "A: 대기실 입실 완료 시각 이후에는 응시가 불가합니다. - Q: 실기고사 중에 4분이 넘어가면 어떻게 되나요? A: 4분이 초과되면 고사와 평가는 종료됩니다."}], "source_url": "https://blog.naver.com/365films/222198630269", "source_date": "2021. 1. 6."}]}, "total_blocks": 2, "sparse": false, "sources": [{"url": "https://blog.naver.com/365films/222604980783", "title": "2022학년도 숭실대학교 영화예술학과 연출 실기고사 이미지카드 공개 기출문제", "date": "2021. 12. 26."}, {"url": "https://blog.naver.com/365films/222198630269", "title": "[ 영화과 실기 과외 ]  2021학년도 정시모집 숭실대학교 영화예술 연출 제작 전공 실기고사 이미지 카드 공개", "date": "2021. 1. 6."}], "meta": {"category": "major", "admission": "정시 나군 실기", "recruit": "소수", "ratio": "실기 + 수능", "stages": [{"name": "실기", "detail": "사전 공개된 이미지카드 3개 세트 중 각 1개 선택 → 주인공 설정 + 사건 구상 → 발표 (4분)"}], "duration": "발표 4분", "tip": "예측 가능한 전개·결론 회피. 신분 드러나는 복장·소품 금지"}}, "cheongju": {"name": "청주대", "full_name": "청주대학교 영화영상학과", "exam_type": "장면 구성 + 구술", "years": ["2026", "2025"], "blocks_by_year": {"2026": [{"sections": [{"type": "plain", "text": "청주대 영화영상학과는 4년제 영화과로 오랜 역사와 전통을 자랑하는 학교로 매해 높은 경쟁률을 차지하고 있습니다.  수시모집 실기 비중이 무려 80% 높은 비중을 차지하여 실기 준비를 열심히 한다면 내신이 부족해도 충분히 가능성 있는 학교입니다."}, {"type": "year_meta", "year": "2027", "rest": "청주대학교 영화영상학과 수시모집 요약"}, {"type": "meta_info", "text": "모집인원 실기 위주 54명"}, {"type": "plain", "text": "수시 교과 20% + 실기 80% 스태프: ① 장면구성 ② 질의응답"}, {"type": "year_meta", "year": "2027", "rest": "영화과 합격생 모집!!"}, {"type": "year_meta", "year": "2026", "rest": "수시모집 청주대학교 영화영상학과 기출문제 _ 실기위주"}, {"type": "plain", "text": "지금부터 해도 늦지 않을까요? A. 실기 준비 기간은 정답은 없습니다. 다만 다수의 영화과 영화영상학과에서 수시모집에서 많은 인원을 선발하는 만큼 또 내신이 낮은 친구들 일수록, 3,4,5 등급 그 이하.. 실기 준비는 선택이 아니라 필수입니다!"}, {"type": "year_meta", "year": "2026", "rest": "청주대학교 영화영상학과 실기전형 기출문제"}, {"type": "plain", "text": "제시문 : 노을 진 저녁, 남자와 여자가 그들이 자주 오던 강 위 낚싯배에서 결혼을 두고 싸우고 있다. 설상가상 배의 모터도 고장 났고 육지도 멀리 있다. 제시 질문 :"}, {"type": "instruction", "text": "1. 롱테이크 기법의 효과를 설명하시오."}, {"type": "instruction", "text": "2. 타블로 영화를 설명하시오."}, {"type": "plain", "text": "제시문 : 벤치에 앉아 담배를 피우는 노숙자. 때가 잔뜩 낀 꼬질꼬질한 손톱. 담배를 다 피우자 손으로 쳐서 날린다. 새로운 담배를 꺼내 후 옆의 남자에게 말을 건네지만 남자는 중요한 전화를 받는지 눈길도 주지 않는다. 노숙자는 라이터로 불을 피워 담배를 피우고 남자는 전화를 끊는다. 차가운 눈으로 노숙자를 쳐다보는 남자. 제시 질문:"}, {"type": "instruction", "text": "1. 누벨바그에 대해서 서술하시오"}, {"type": "instruction", "text": "2. 네오리얼리즘에 대해 서술하시오."}, {"type": "plain", "text": "제시문 : 타이타닉호에서의 오케스트라 단원들의 일화는 유명하다. 침몰하고 있는 배에의 오케스트라 단원들의 모습과 도망치는 사람들 소리와 감정을 묘사하여 장면을 구성하세요. 제시 질문:"}, {"type": "instruction", "text": "1. 촬영의 거리에 따른 효과를 설명하시오."}, {"type": "plain", "text": "2. 초현실주의 영화의 특징을 말해주세요."}], "source_url": "https://blog.naver.com/365films/224267891947", "source_date": "2026. 4. 28."}], "2025": [{"sections": [{"type": "year_meta", "year": "2025", "rest": "입시부턴 수시모집에서만 실기전형으로 인원을 선발하고, 정시 모집에선 수능으로 인원을 선발합니다."}, {"type": "plain", "text": "실기 위주 영화과 영화영상학과를 희망하는 친구들은 참고하시어 준비하시길 바랍니다. 청주대 영화영상학과 실기 준비 영화과 영상학과 실기 학원 [ 영화 영상 실기 과외학원] 청주대학교 영화영상학과 기출문제 _ 장면구성, 구술테스트, 실기 위주 A. 실기 준비를 언제부터 해야 한다는 정답은 없습니다. 학생이 여건이 될 때 시작하면 됩니다. 다수의 영화과 영화영상학과에서 정시모집보단, 수시모집에서 실기 위주 학생들 더 많이 선발하는 만큼 성적이 낮고, (3,4,5,6... 그 이하...) 실기전형을 노리는 친구들은 최대한 빨리 시작하는 것이 중요합니다! 청주대 영화영상학과 기출문제 청주대학교 영화영상학과 실기 항목 실기 70% + 교과성적 30% 1. 장면구성 2. 구술테스트 문제지 당일 제공 영화과 영상학과 실기 학원 추천 과외 청주대학교 영화영상학과 기출문제 기출문제 1.​ 밤새 눈이 쌓인 작은 동네. 개 짖는 소리와 함께 저 멀리서 우편배달부가 자전거를 타고 온다. 눈길에 비틀거리다 이내 중심을 잡고 한 집 대문 앞에 선다. 초인종을 앞에 두고 망설이는 우편배달부. 기출문제 2. 고2 정우가 점심시간이 끝난 후 농구장으로 걸어가는 중, 수연이가 학교 옥상에 올라가 밑에 있는 담임선생님과 대치중이다. 그 순간 수연이가 옥상에서 떨어지고 그 광경을 본 정우는 털썩 주저앉는다. 기출문제 3. 여자가 손에 든 첫 월급봉투를 들뜬 마음으로 바라본다. 버스를 타려던 여자는 만원 버스에 소매치기가 많다는 말이 생각나 택시를 잡아탄다. 택시에 탄 여자는 집에 간다고 엄마에게 전화한다. 문득 창밖을 보는데 택시는 낯선 곳으로 향하고 있다. 기출문제 4. #77 공원 / 낮 작은 분수대가 있는 공원 분수대 앞, ㅁㅁ가 앉아있다. 앞으로는 유모차를 끌고 부부가 지나간다. 전화를 받는다. 지원은 지향성 마이크를 ㅁㅁ에게 뻗고 헤드셋을 착용하자 ㅁㅁ의 목소리가 크게 들린다. 기출문제 5. ㅁㅁ:ㅇㅇ(딸)아 왜 전화했어? 아빠는 일중이지. 뭐해? 알버트가 피아노 알려줬어? 이제 새아빠 좋아? ㅇㅇ의 대답을 들은 남주 울컥한다 ㅁㅁ:(울컥) 아빠가 더 좋아? 듣고 있던 지원 아쉬워한다. ㅁㅁ 핸드폰을 들어 어디론가 문자하자 지원의 핸드폰으로 문자가 온다. 청주대학교 영화영상학과 합격 증 강남 영화과 영화영상학과 실기 학원 과외 영화과 영상학과 온라인 실기 과외 학원"}], "source_url": "https://blog.naver.com/365films/223385957963", "source_date": "2024. 3. 17."}]}, "total_blocks": 2, "sparse": true, "sources": [{"url": "https://blog.naver.com/365films/224267891947", "title": "[ 영화과 과외 실기 학원 ] 2026학년도 수시모집 청주대학교 영화영상학과 기출문제 _ 실기위주", "date": "2026. 4. 28."}, {"url": "https://blog.naver.com/365films/223385957963", "title": "[ 영화 영상 실기 과외학원] 청주대학교 영화영상학과 기출문제 _ 장면구성, 구술테스트, 실기 위주", "date": "2024. 3. 17."}], "meta": {"category": "minor", "admission": "수시 실기 위주", "recruit": "소수", "ratio": "실기 + 학생부", "stages": [{"name": "실기", "detail": "장면 구성 + 구술테스트"}], "duration": "비공개", "tip": ""}}, "sungkyul": {"name": "성결대", "full_name": "성결대학교 영화영상학과", "exam_type": "제시문답 + 면접실기", "years": ["2026"], "blocks_by_year": {"2026": [{"sections": [{"type": "year_meta", "year": "2026", "rest": "수시모집 성결대 영화영상학과 실기고사 기출문제"}, {"type": "plain", "text": "제시어- 당뇨병에 걸린 50대 직장인, 쓰레기통에 버려진 테이크아웃 커피잔 조건 - 따뜻한 정서가 느껴지도록 이야기 구성 제시어-베터리 5% 남은 스마트폰 공간- 컨테이너 조건- 두려움이 느껴지게 , 공간이동 x 제시어-스니커즈 한짝 공간-고궁연못 조건- 당황함, 공간 이동× 제시어- 대학병원 뇌신경과 의사 , 고속으로 달리는 구급차 조건 - 서늘한 정서가 느껴지도록 작성할 것"}], "source_url": "https://blog.naver.com/365films/224263813530", "source_date": "2026. 4. 24."}]}, "total_blocks": 1, "sparse": 만 . 심란하다. CUT TO 현관을 나서는 지연. 그러자 솔이가 안절부절 못하며 시끄럽게 짖는다. 지연이 간식 하나를 꺼내 솔이를 달래보지만. 진정이 되지 않자.. 포기하고 집을 나선다. 예술인 임대아파트, 복도 / 오전 솔이가 엉엉! 짖는 소리가 복도까지 우렁차게 흘러나온다. 도망치듯 복도를 걸어 나오는 지연. 그때 이웃집 대문이 벌컥 열리면서 마스크를 쓴 여자가 소리친다. 이웃 여자 저기요! 저기요!! 이웃 여자 (묘한 미소) 안녕 못 하겠는데요?! 이웃 여자 아니. 그 집 강아지요. 지연 저희 집 개가 너무 시끄럽죠? 죄송합..니.. 이웃 여자 (말 끊으며) 그거 동물 학대예요. 보니까 맨날 집에 혼자 두는 것 같은데, 책임지지 못할 거면 아예 키우 지를 마세요. 지연 죄송합니다.…!"}], "source_url": "https://blog.naver.com/365films/224278961790", "source_date": "2026. 5. 8."}], "2025": [{"sections": [{"type": "year_meta", "year": "2025", "rest": "용인대 영화영상학과 수시모집 기출문제"}, {"type": "plain", "text": "◉ 영화영상학과 ▪ 실기고사 : 스토리분석"}, {"type": "meta_info", "text": "▪ 문제선정 방법 : 고사 시간대별 수험생의 문제 추첨을 통하여 현장에서 시나리오 문제 선정"}, {"type": "plain", "text": "▪ 해당 전형 : 일반학생 전형, 국가보훈대상자 특별전형, 농어촌학생 특별전형 ▪ 기출문제 : 시나리오를 분석한 후, 어떻게 장면화를 할 것인지 구체적으로 구술하시오. (제한시간 4분 이내) 이태원, 맥도날드 / 새벽 밤새워 놀다 첫차를 기다리는 젊은 사람들이 듬성듬성 보인다. 여기저기 취한 사람들, 목소리를 높여 이야기하는 사람도 있다. 카메라는 몇몇 사람들이 서 있는 계산대 앞을 비춘다. 누군가 세트메뉴를 담은 트레이를 들고 걸어오는데... 예전에 학교 근처 지하철역 부근에서 만났던 대학동기 노민수다! 여전히 후출근한 트레이닝복 차림. 노민수 아, 졸라 오래 걸리네. 자리에 앉은 노민수는 햄버거 포장을 뜯어 허겁지겁 먹기 시작한다. 그런 민수를 쳐다보는 계나. 노민수 왜? 계나 ​너 진짜 맛있게 먹는다. 노민수 가끔 이렇게 기름기 가득한 걸 먹고 싶을 때가 있어. 막 몸 나빠지는 거·.... 계나는 그런 노민수를 잠시 흐뭇하게 쳐다보다가 본인도 먹기 시작한다. 노민수 (우적우적) 우리 밥 한번 먹자고 한 지가 언젠데.... 계나 그러게... 미안하다... 노민수 (불쑥) 어디 멀리 좀 가보고 싶어. 불안한 얼굴하고 있는 사람들 사이에서 이게 몇 년째냐. 답답해 미치겠다·· 계나  어디 가보고 싶은데는 있어? 노민수 탁 트인 곳에 조용하게 앉아 있으면 좋을 것 같아. (손짓하며) 오로라 같은 걸 보고 있으면 얼마나 좋을까! 계나  오~ 좋다! 눈 호강 좋지! 노민수 아... 갈 수 있을까....? 계나 왜 못가? 가면 되지. 노민수 그래? (감자튀김을 먹으며) 너 오늘 너무 우호적이다? 계나 너도 지나치게 비장한 것 같은데?  케첩 떨어졌는데 좀 갖다주시겠어요? 노민수 그래? (웃으며) 알겠어. 노민수는 일어서서 계산대로 쪽으로 걸어간다. 두세 명이 주문하기 위해서 있고 노민수가 그 뒤에 줄을 선다. 출처 용인대학교 입학처"}], "source_url": "https://blog.naver.com/365films/224240791878", "source_date": "2026. 4. 4."}], "2024": [{"sections": [{"type": "year_meta", "year": "2024", "rest": "용인대 영화영상학과 수시모집 기출문제"}, {"type": "plain", "text": "오후의 시골 파출소 안, 염색한 머리모양에 어울리지 않는 검은 양복을 걸친 진재와 민수 귀찮아 보이는 경찰과 이야기를 나누고 있다. 경찰  남편..이 누구시죠? 민수   (전재를 가리키며) 인 창작 시나리오분석 + 구술면접 + 창작필기고사 = 서경대 영화영상학과 최종 합격!!! 서경대 영화영상학과 시나리오분석 기출문제 시나리오 영화 서경대 영화영상학과 기출문제 시나리오 분석 영화 '써니' 中 60. 현재, 춘화의 병실 - 밤 침대 옆에 서서 고통에 잠든 춘화를 바라보는 나미. 복잡한 표정이다. 뒤돌아 가려는데 힘없이 나미를 부르는 춘화. 춘화 나미야. 나미 .....안 잤어? 춘화 왜 (빙글빙글 흉내) 그저~ 바라만 보고 있어? 나미 (피식) 춘화 일루 와. 좀 만 있다가 가. 잠시 바라보는 나미. 춘화, 옆에 누우라는 듯 자리 만들어주면 올라가 눕는다.  연인, 혹은 소녀 같이 편안하게 누워있는 두 사람. 나미 춘화야. 춘화 말씀하세요. 나미 고마워. 춘화 뭘? 나미 나 꽤 오랫동안 엄마, 집사람으로만 살았거든. 인간 임 나미. 아득한 기억의 저편이었는데.... 나도 역사가 있는, 적어도 내 인생은 주인공이더라고. 춘화 너는 얼굴이 주인공 얼굴이야. 바라보며 웃는 두 여인. 머리맡의 봉투 하나를 건네는 춘화. 나미 뭔데? 춘화 집에 가서 봐. 서경대영화영상학과 시나리오 분석 기출문제 영화 '광해' 中 63.궐내각사/ 낮 불안한 모습의 허균, 주변 두리번… 허균 (소리 죽여 나무라듯) 왕이 신하를 찾아오는 법도는 없습니다. 어서 돌아가십시오. 하선 도승지가 바쁘지 않소. (서책 펼치며) 내 밤새 공부했는데 말이요... 대동법 이란 게 참으로 좋은 법 이오. 허균 (주변을 살피며) 하선 어찌 이 좋은 법을 일 년도 시행치 않고 폐지했단 말이오? 하루라도 빨리 재시 행함이 옳지 않냐는 거요? 허균 (불안하다. 주변 두리 번…) 하선 어허~ 도승지! 허균 (어쩔 수 없는 듯) 이것은 옳고 그름의 문제가 아닙니다, 그냥정치일 뿐… 보는 눈이 많사옵니다. 얼른 돌아가십시오. 허리를 숙이고 안으로 들어가는 허균. 조금 떨어진 곳, 이들을 지켜보는 박충서가 있다. 박충서 허균 저자에게 사람을 붙이게. 일거수일투족, 하나도 놓쳐선 아니 되네. 이정랑 예. 박충서 (천천히 눈알을 굴린다) 기출문제 시나리오 분석 서경대 영화영상학과 영화 '바르게 살자' 中 11. 시내 다른 도로 한창 민방위 훈련이 진행 중이다. 노상에서 차량을 통제하는 도만. 어떤 검은 승용차를 멈춰 세운다. 도만 훈련 중이니까 잠시 협조해주시죠. 기사 이거 도지사님 공무차량입니다. 뒷좌석 도지사의 시선이 도만의 순경 명찰에 가 있다. 도만도 도지사를 바라본다. 도지사 ... 우리 참.. 연이 길구만.. 차량, 그냥 통과한다. 도만, 디카로 차량의 후미를 찰칵 찍어둔다."}], "source_url": "https://blog.naver.com/365films/223374092707", "source_date": "2024. 3. 5."}]}, "total_blocks": 1, "sparse": true, "sources": [{"url": "https://blog.naver.com/365films/223374092707", "title": "[ 영화과 실기학원 과외 ] 서경대학교 영화영상학과 시나리오분석 기출문제 _ 창작 필기고사, 실기 구술, 실기위주 인서울 영화과", "date": "2024. 3. 5."}], "meta": {"category": "minor", "admission": "수시 실기", "recruit": "소수", "ratio": "실기", "stages": [{"name": "실기", "detail": "시나리오 분석 + 창작 필기 + 구술"}], "duration": "비공개", "tip": ""}}, "joongbu": {"name": "중부대", "full_name": "중부대학교 연극영화학(영화 연출/제작)", "exam_type": "지정문제 + 질의응답", "years": ["2025"], "blocks_by_year": {"2025": [{"sections": [{"type": "year_meta", "year": "2025", "rest": "영화과 영화연출 영상학과 실기 준비하는 법"}, {"type": "plain", "text": "실기 위주 영화 연출 학교 중부대학교 연극영화학 전공 영화 연출/제작 실기 항목 영화 ·연출/ 제작 ■지정 문제 (3분 이내) : 시험 당일 배부된 문제에 관해 구술 발표 ■질의응답 (2분 이내) : 전공 관련 기초지식 중부대학교 연극 영화과 연출 제작 전공 실기 준비하는 법 합격자 후기 중부대학교 연극영화학전공 영화 연출/제작 기출문제 기출문제 1. 나는 병에 걸렸을 뿐이고 천국과 지옥의 소리를 들을 수 있는데 늙은이는 나를 이상하게 생각한다. 나는 늙은이를 미워하지 않는다.)'나' 와 '늙은이'를 보고 이야기를 만드시오. 기출문제 2. 인생에서 가장 기억에 남는 순간이 있다면 로그 라인과 5컷으로 스토리텔링 하세요. 기출문제 3."}, {"type": "instruction", "text": "지난 크리스마스 날에 있었던 (허구여도 좋음)  이야기를 로그라인과 함께 5컷으로 구성하시오."}, {"type": "plain", "text": "영화과 영상학과 합격 학교 명단 서울 경기 전 지역뿐 아니라 지방에 거주하는 친구들도 쉽게 찾아올 수 있는 위치에 위치해 있습니다."}], "source_url": "https://blog.naver.com/365films/223388655070", "source_date": "2024. 3. 19."}]}, "total_blocks": 1, "sparse": true, "sources": [{"url": "https://blog.naver.com/365films/223388655070", "title": "[영화과실기 학원 과외] 중부대학교 연극영화학전공 영화 연출/제작 기출문제 _ 지정 문제, 질의응답, 실기위주", "date": "2024. 3. 19."}], "meta": {"category": "minor", "admission": "수시 실기", "recruit": "소수", "ratio": "실기", "stages": [{"name": "지정문제", "detail": "당일 배부 문제에 대한 구술 발표 (3분 이내)"}, {"name": "질의응답", "detail": "전공 관련 기초지식 (2분 이내)"}], "duration": "5분 이내", "tip": ""}}, "suwon": {"name": "수원대", "full_name": "수원대학교 영화영상", "exam_type": "시나리오 분석 + 구술", "years": ["2025"], "blocks_by_year": {"2025": [{"sections": [{"type": "year_meta", "year": "2025", "rest": "영화과 영화영상학과 실기 위주 학교 준비하는 법"}, {"type": "plain", "text": "실기 위주 영화영상학과 입시 준비 수원대학교 영화영상학과 실기 항목 전공실기 (시나리오 분석)"}, {"type": "bullet", "text": "시험 당일 제시된 시나리오의 한 부분을 읽고 캐릭터, 촬영기법 및 사운드 활용법 등을 분석"}, {"type": "bullet", "text": "시나리오 분석을 중심으로 영화영상 분야에 대한 전반적인 이해도 평가 (5분 이내)"}, {"type": "plain", "text": "수원대 영화영상학과 시나리오분석 기출문제 수원대 영화영상학과 시나리오분석 기출문제 수원대 영화영상학과 시나리오분석 기출문제 영화 '우아한 거짓말' 中 7. 금강. 낮 햇빛에 반짝 빛나는 강물위로 하얀 골분이 흘러 내려간다. 활짝 웃고 있는 천지의 사진도... 하얀 소복을 입고 골분 통을 앞에 둔 채 쪼그려 앉아 있는 현숙. 서서 현숙을 보고 있는 만지. 넋이 나가 있는 두 사람이 한 동안 보이고. 현숙 천지야, 아빠가 금방 마중 나올 거야. 물 위를 떠내려가는 천지의 사진을 바라보는 현숙과 만지. 현숙 웬수야. 애들 이름이 크면 일찍 간다 그랬잖아! 바득바득 우겨서 짓더니. 이제 좋냐? 데려가려면 곱게나 데려가든가... 낚시꾼 (지나가다가) 거 다 끝났으면 얼렁 가요. 여 하도 골분 버리는 사람이 많아 단속이 심해. 벌금 물수도 있어. 현숙 내 새끼 뭐가 드럽다구 벌금을 물어! 낚시꾼 새끼를 보내는구먼..새끼를… (쯧쯔. 상류쪽으로 간다) 멀리서 공무원 차림의 남자가 서류철을 옆에 끼고 걸어오는 것이 보인다. 현숙 (서두른다) 만지야. 가자. 만지 (소복 끝에 발이 엉킨다. 넘어질 뻔) 천천히 좀 가자 현숙 벌금 문대잖어! 만지 딸 보내놓고 벌금 물까 도망 가냐… 좀 그렇다.. 현숙 산다는 게 . 그렇게 좀스럽고 치사한 거야. (허둥지둥 자리 뜨더니 돌아보며 그렁한 눈으로...) 천지아빠. 천지 만나면 왜 그랬느냐고 묻지 마. 그냥 꼭 안아줘. 아오, 나쁜 년. 잘 가라, 이 년아. 그런 현숙을 바라보는 만지. 눈물이 뚝뚝 떨어지는 현숙의 얼굴. 강 위로 천천히 떠내려가는 천지의 사진. 그 위로 들리는 만지의 소리 만지 (소리) 엄마는 남편을 보낸 지 9년 만에 어린 딸까지 보내고 말았다 수원대 영화영상학과 시나리오분석 기출문제 수원대 영화영상학과 시나리오분석 기출문제 9. 음식점(내부, 밤) 시간 경과 후의 같은 식당. 창 밖이 캄캄하게 어두워져 있고, 종업원이 식당을 치 우고 있는 걸로 봐서 밤이 꽤 늦은 시간인 것 같다. 종두가 혼자 의자 에 앉아 있고, 주인 남자를 비롯한 식당 사람들이 감시하듯 그를 보고 있다. 종두 (비굴한 미소를 띠고)전화만 되면 된다니까요, 조금만 기다려보세요. 예? 주인 (종두의 테이블을 치우려는 종업원에게) 그건 치우지 마! 그대로 놔둬. 종두 저 도망 안가요. 정말이예요. (갑자기 신발을 벗어 주인에게 내민다.) 이거 맡겨둘게요. 신발 없이 도망 가 겠어요? 주인, 한심하단 표정으로 종두를 보고 있다. 종두 (양손에 신발 두 짝을 들고 내밀며) 조금만 기다려보세요. 내 동생하고 전화 연락만 되면 금방 올 거 걸랑요. 주인 (대꾸하기 싫지만) 전화가 언제 돼? 당신 지금까지 전화만 열 통화 넘게 썼 어. 하여튼, 경찰에 가서 이야기해. 종두 (점점 다급해진다.) 아저씨, 저 정말 경찰서에는 가기 싫걸랑요. 그럴 사정이 있어요. 신발 맡겨둘 게요. 저 도망 안가요. 주인 앞으로 신발을 던진다. 주인남자의 마누라인 듯한 여자가 한 마디 한다. 여자 그렇게 겁나는데 무슨 배짱으로 돈 없이 음식을 있는 대로 시켜먹어? 종두 전화가 될 줄 알았다니까요. 파출소 순경 두 명이 들어선다. 종두, 하는 수 없다는 듯이 자리에서 일어난 다. 종두 (맨발로 순경들에게 다가가며) 밤늦게 수고하심다! 순경에게 인사하는 척하다가, 갑자기 순경을 밀치고 식당 밖으로 뛰어 나간다. 순경 이 따라 나간다. 식당 문으로 도망가는 종두의 모습을 볼 수 있다. 그러나 몇 걸음 가지 못하고 잡힌다. 수원대 영화영상학과 시나리오분석 기출문제 수원대 영화영상학과 시나리오분석 기출문제 #17. 지수의 집. 낮 <CUT> 화장실에서 변기를 뚫기 위해 애쓰는 광호. 피아노에 묻은 떡볶이자국을 정성스럽게 닦는 지수. 거실 테이블 위에 피자가 놓여있 고, 지수, 깨끗해진 피아노에 앉아 ‘슈만의 어린이 정경’을 연주하기 시작한다. 열린 화장실 문 너머에서 지수의 피아노 연주하는 소리가 들려온다. 피아노 연주하는 지수 를 넋이 나간 사람처럼 바라보는 광호. 화장실 변기 물이 시원하게 내려가고, 광호가 거실로 나온다. 지수 벌써 다 됐어요? 아저씨! 광호 (얼굴이 붉어지며) 피아노 되게 잘 치시네요. 지수 다 됐냐구요? 광호 아 네! 전 어려서부터 피아노 잘 치는 사람들 보면 그렇게 부럽더라구요.  아 그걸 어떻게 그렇게 치죠? 손가락 돌아가는 게 참 신기하더라구요. 지수 수고하셨어요. 지수 (퉁명스럽게) 그래요. 그럼 가보세요. 광호, 계속 지수에게서 눈을 떼지 못하고, 지수를 바라본다. 지수 불쾌한 듯 지수 뭐하세요? 무안해진 광호, 광호 근데 선생님.. 어른들도 피아노 가르쳐 줍니까? 지수 (사무적으로) 수고하셨어요. 안녕히 가세요. 내쫓기듯 학원을 나서는 광호. 문을 닫으며 불쾌하다는 표정을 짓는 지수 지수 별꼴이야 정말 영화과 영화영상학과 온라인 과외 실기학원"}], "source_url": "https://blog.naver.com/365films/223378721782", "source_date": "2024. 3. 10."}]}, "total_blocks": 1, "sparse": true, "sources": [{"url": "https://blog.naver.com/365films/223378721782", "title": "[영화영상학과 실기 과외 학원 ] 수원대학교 융합문화 예술대학 문화 예술학부 영화영상 기출문제 _ 실기 위주, 시나리오 분석, 구술면접", "date": "2024. 3. 10."}], "meta": {"category": "minor", "admission": "수시 실기", "recruit": "소수", "ratio": "실기", "stages": [{"name": "시나리오 분석", "detail": "당일 제시 시나리오 캐릭터·촬영기법·사운드 분석 (5분 이내)"}], "duration": "5분 이내", "tip": ""}}, "inha": {"name": "인하대", "full_name": "인하대학교 연극영화과 이론/연출", "exam_type": "글쓰기", "years": ["2018"], "blocks_by_year": {"2018": [{"sections": [{"type": "year_meta", "year": "2018", "rest": "인하대학교 연극영화과 이론/연출 기출문제 입니다."}, {"type": "plain", "text": "인하대 연극영화과 이론/연출 문제는 자신이 입학해서 영화를 제작한다는 가정하에 이미지 형식으로 시놉시스부터 시각화과정까지 총채적으로 이야기를 구성하는 방식 입니다. 인하대 연극영화과 이론/연출은 작문과 실기항목이며,"}, {"type": "year_meta", "year": "2018", "rest": "인하대학교 연극영화과 이론/연출 기출문제"}, {"type": "prompt", "text": "2022년 가을, 당신은 인하대학교 연극영화학과 졸업반입니다. 세상을 깜짝 놀라게 할 졸업영화를\n만들기 위해 몇 날 며칠 괴로워하고 있습니다. 바람도 쏘일 겸 학교도서관을 찾은 당신, 차근히\n정리된 책장 사이를 오가다가 무심히 책 한권을 집어듭니다. 책장을 넘기던 손이 멈춰섭니다.\n“악마의 존재방식”. 시선을 끄는 소제목의 글을 빠르게 읽어갑니다.\n(이하생략)"}, {"type": "condition", "num": "1", "text": "문제별 집필 분량 엄수(참고로 위 제시문 분량은 띄어쓰기, 문자기호 포함 633자)"}, {"type": "condition", "num": "2", "text": "제시문과 연관성이 부족한 답변은 감점"}, {"type": "question", "num": "1", "text": "당신이 “악마의 존재방식”을 읽으며 떠올린 졸업(단편)영화의 기획의도(50자 내외, 5점)와 주인공의 캐릭터를 자세하게 묘사하시오.(250자 내외, 20점)"}, {"type": "question", "num": "2", "text": "문제 1의 주인공을 둘러싼 극적 사건의 발생과 갈등 그리고 해결이 있는 졸업영화의 줄거리를"}, {"type": "instruction", "text": "작성하시오. 반드시 제시문에 있는 여러 가지 소재와 개념들을 바탕으로 할 것."}, {"type": "plain", "text": "(1,000자 내외, 50점)"}, {"type": "question", "num": "3", "text": "졸업영화 제목을 정하고(5점), 엔딩 장면을 시각적인 형태로 묘사하시오.(200자 내외, 20점)"}], "source_url": "https://blog.naver.com/365films/221456562393", "source_date": "2019. 2. 1."}]}, "total_blocks": 1, "sparse": true, "sources": [{"url": "https://blog.naver.com/365films/221456562393", "title": "&lt;영화과 기출문제&gt;  인하대학교 연극영화과 이론/연출 기출문제_ 영화과과외 영화실기과외 영화실기학원", "date": "2019. 2. 1."}, {"url": "https://blog.naver.com/365films/221245055386", "title": "인하대학교 연극영화(이론/연출) 기출문제_2016 ( 영화연출과 실기준비/ 영화과 글쓰기/ 영화과 실기학원 )", "date": "2018. 4. 4."}], "meta": {"category": "minor", "admission": "수시 실기", "recruit": "소수", "ratio": "실기 60% + 학생부 40% (2020 기준)", "stages": [{"name": "작문", "detail": "제시문 기반 졸업영화 시놉시스 (기획의도·캐릭터·줄거리·엔딩)"}], "duration": "비공개", "tip": "제시문과 연관성 부족 시 감점"}}, "sangmyung": {"name": "상명대", "full_name": "상명대학교 영화영상전공(연출·스태프)", "exam_type": "글쓰기 + 면접", "years": ["2019"], "blocks_by_year": {"2019": [{"sections": [{"type": "year_meta", "year": "2019", "rest": "상명대학교 영화영상전공 (연출·스태프) 정시모집 기출문제 입니다."}, {"type": "plain", "text": "상명대 영화영상학과는 영화상식 및 이론 문제를 기반으로 개인구술면접이 이루어 집니다. 평상시 사회전반적인 부분에 관심이 많아야 하고, 더불어 영화 이론과 상식 부분에 대해서도 관심이 많은 학생이라면 가능성이 높은 학교 입니다. 최근 2~3년이내의 기출문제를 다 풀어보고 정리해둔다면 시험 보는데 많은 도움이 될 것 이라 생각합니다."}, {"type": "year_meta", "year": "2019", "rest": "상명대학교 영화영상전공 (연출·스태프) 정시모집 기출문제"}, {"type": "instruction", "text": "1. 영화 ‘옥자’의 경우, 칸 영화제에서 영화제 출품자격 논란이 있었다. 이 문제에 대한 자신의 의견을 말해 보시오. 2. 자신이 좋아하는 영화 3편을 들고, 그 3편에서 주인공의 심리가 무엇이었는지, 그것을 어떻게 묘사했는지, 비교해서 설명하시오."}, {"type": "plain", "text": "3. 특정한 공간이 기억에 남는 영화 3편을 예로 들어, 그 공간이 각 영화에서 어떤 기능을 했는지, 어떻게 표현되었는지, 비교해서 말해 보시오."}, {"type": "instruction", "text": "4. 음악 영화 3편을 예로 들고, 각 영화에서 음악이 인물이나 이야기를 어떻게 끌고가는지 비교해서 말해 보시오. 5. 영화 촬영에서 노출(exposure)의 기능적 의미와 미학적 의미를 설명하시오."}, {"type": "instruction", "text": "1. 영화 , , 그리고 <1987>은 직, 간접적으로 우리나라의 정치적 사건을 소재로 한 영화들로 관객들의 많은 관심을 받았던 영화들이다. 이 영화들에서 배경으로 하고 있는 정치적 사건이 무엇이며 이 영화들이 지닌 교훈과 의미가 무엇인지 두 가지 이상을 들어 설명하시오."}, {"type": "instruction", "text": "2. 영화 한편을 완성하려면 많은 제작비가 필요한 산업적인 면과 무에서 유를 만들어내는 작품이므로 창의성 또한 많이 요구된다. 영화가 만들어지는 제작 과정, 프리프로덕션-프로덕션-포스트프로덕션, 세 단계에서 제작비와 창의성이 어떻게 요구되는지 단계별로 설명하시오."}, {"type": "instruction", "text": "3. 최근 만들어지는 한국 영화에는 , < 브 아이 피>에서처럼 남성들 간의 경쟁이나 , 에서처럼 남성들 간의 우정과 연대를 중심으로 한 영화들이 주를 이루고 있다. 이처럼 남성 중심적인 내용과 소재가 많은 한국 영화의 경향에 대해 그 장점과 단점을 설명하시오."}, {"type": "instruction", "text": "4. 이창동 감독이 연출한 영화들을 제시하면서 이 영화들에서 드러나는 사실주의 특성 3가지를 설명하시오."}, {"type": "instruction", "text": "5. 현재 우리나라에는 여러 개의 국제영화제가 개최되고 있다. 영화제에서 일하고 있는 집행위원장, 조직위원장, 프로그래머가 하는 역할이 무엇인지 설명하시오."}], "source_url": "https://blog.naver.com/365films/221723744223", "source_date": "2019. 12. 1."}]}, "total_blocks": 1, "sparse": true, "sources": [{"url": "https://blog.naver.com/365films/221723744223", "title": "2019학년도 상명대학교 영화영상전공 (연출·스태프) 정시모집 기출문제_ 영화과 면접준비 영화과 개인과외 영화영상학과과외", "date": "2019. 12. 1."}, {"url": "https://blog.naver.com/365films/221246026480", "title": "상명대학교 영화영상전공 (연출/스태프) 기출문제_ 2017 수시 (영화과 면접과외/ 영화연출과외 / 영화연출실기준비 )", "date": "2018. 4. 5."}, {"url": "https://blog.naver.com/365films/221246060284", "title": "상명대학교 영화영상전공 (연출/스태프) 기출문제_ 2017 정시 (영화영상과 연출실기 / 영화연출 실기준비 / 영화과연출실기준비)", "date": "2018. 4. 5."}], "meta": {"category": "minor", "admission": "정시 실기", "recruit": "소수", "ratio": "실기 + 수능", "stages": [{"name": "구술면접", "detail": "영화상식·이론 5문항 + 개인구술"}], "duration": "비공개", "tip": "최근 2~3년 기출 + 사회·이론 상식"}}};
const MAJOR = ["kookmin", "knua", "dankook", "sungkyun", "seoularts", "sejong", "soongsil"];
const MINOR = ["cheongju", "sungkyul", "yongin", "daejin", "seokyung", "joongbu", "suwon", "inha", "sangmyung"];
const ALL = [...MAJOR, ...MINOR];

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function renderSection(sec){
  switch(sec.type){
    case 'year_meta':
      return `<div class="sec-year-meta">${esc(sec.year)}학년도 ${esc(sec.rest||'')}</div>`;
    case 'poem':
      return `<div class="sec-poem">
        <div class="sec-poem-head">
          <span class="sec-poem-title">${esc(sec.title)}</span>
          ${sec.author?`<span class="sec-poem-author">— ${esc(sec.author)}</span>`:''}
        </div>
        <div class="sec-poem-body">${esc((sec.lines||[]).join('\n'))}</div>
      </div>`;
    case 'prompt_label':
      return `<div class="sec-prompt-label">${esc(sec.text||'제시문')}</div>`;
    case 'prompt':
      return `<div class="sec-prompt">${esc(sec.text)}</div>`;
    case 'prompt_lead':
      return `<div class="sec-prompt-lead">${esc(sec.text)}</div>`;
    case 'keywords':
      return `<div class="sec-keywords">
        <span class="sec-keywords-label">키워드</span>
        ${(sec.items||[]).map(k=>`<span class="kw-chip">${esc(k)}</span>`).join('')}
      </div>`;
    case 'keywords_label':
      return `<div class="sec-prompt-label">키워드</div>`;
    case 'question':
      return `<div class="sec-question">
        <span class="q-num">문제 ${esc(sec.num)}</span>
        <span class="q-text">${esc(sec.text)}</span>
      </div>`;
    case 'condition':
      return `<div class="sec-condition">
        <span class="c-num">조건 ${esc(sec.num)}</span>
        <span class="c-text">${esc(sec.text)}</span>
      </div>`;
    case 'instruction':
      return `<div class="sec-instruction">${esc(sec.text)}</div>`;
    case 'meta_info':
      return `<div class="sec-meta">${esc(sec.text)}</div>`;
    case 'bullet':
      return `<div class="sec-bullet">${esc(sec.text)}</div>`;
    case 'plain':
      return `<div class="sec-plain">${esc(sec.text)}</div>`;
    default:
      return '';
  }
}

function renderBlock(b, year, idx){
  const sections = (b.sections||[]).map(renderSection).join('');
  return `<div class="exam-block" id="block-${year}-${idx}">
    <div class="exam-block-head">
      <span class="exam-year">${esc(year)}학년도</span>
      <div class="exam-tools">
        <button class="btn-tool" onclick="copyBlock('block-${year}-${idx}')">📋 본문 복사</button>
        <button class="btn-tool" onclick="window.print()">🖨 인쇄</button>
      </div>
    </div>
    ${sections}
    <div class="source-link">출처: <a href="${esc(b.source_url)}" target="_blank" rel="noopener">365films 블로그 · ${esc(b.source_date)}</a></div>
  </div>`;
}

function renderHeader(sch){
  const yearRange = sch.years.length>1
    ? `${sch.years[sch.years.length-1]}~${sch.years[0]}학년도`
    : `${sch.years[0]}학년도`;
  const meta = sch.meta || {};
  const stages = (meta.stages||[]).map(s=>`<li><strong>${esc(s.name)}</strong> — ${esc(s.detail)}</li>`).join('');
  const tipHtml = meta.tip ? `<dt>출제 포인트</dt><dd>${esc(meta.tip)}</dd>` : '';
  return `<div class="school-header">
    <h2>${esc(sch.name)}${sch.sparse?' <span class="stat-chip warn" style="font-size:.625rem;vertical-align:middle">데이터 부족</span>':''}</h2>
    <p class="full">${esc(sch.full_name)}</p>
    <div class="stats">
      <span class="stat-chip">📅 ${yearRange}</span>
      <span class="stat-chip">📝 ${sch.total_blocks}건</span>
      <span class="stat-chip">🎯 ${esc(sch.exam_type)}</span>
    </div>
    ${meta.admission ? `<dl class="meta-table">
      <dt>전형</dt><dd>${esc(meta.admission)}</dd>
      ${meta.recruit?`<dt>모집인원</dt><dd>${esc(meta.recruit)}</dd>`:''}
      ${meta.ratio?`<dt>실기 비중</dt><dd>${esc(meta.ratio)}</dd>`:''}
      ${meta.duration?`<dt>시간·분량</dt><dd>${esc(meta.duration)}</dd>`:''}
      ${stages?`<dt>시험 구성</dt><dd><ul class="stages-list">${stages}</ul></dd>`:''}
      ${tipHtml}
    </dl>`:''}
  </div>`;
}

function renderSparseWarn(sch){
  const items = (sch.sources||[]).map(s=>
    `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title.replace(/\+/g,' '))}</a><span class="date">${esc(s.date)}</span></li>`
  ).join('');
  return `<div class="warn-box">
    <strong>⚠️ 정제 후 표시 가능한 분량이 적습니다.</strong><br>
    이 학교는 본문 대부분이 학원 안내 문구라서 자동 정제 후 남은 내용이 적습니다.
    아래 365films 블로그 원본 글에서 직접 확인하세요.
    <ul>${items}</ul>
  </div>`;
}

let timerSecs=0, timerInterval=null;
function updateTimerDisplay(){
  const m=String(Math.floor(timerSecs/60)).padStart(2,'0');
  const s=String(timerSecs%60).padStart(2,'0');
  const el=document.getElementById('timer-display');
  if(el) el.textContent=`${m}:${s}`;
}
function toggleTimer(){
  const btn=document.getElementById('btn-timer-toggle');
  const disp=document.getElementById('timer-display');
  if(timerInterval){
    clearInterval(timerInterval);timerInterval=null;
    btn.textContent='시작';btn.classList.add('primary');
    disp.classList.remove('running');
  } else {
    timerInterval=setInterval(()=>{timerSecs++;updateTimerDisplay();},1000);
    btn.textContent='정지';btn.classList.remove('primary');
    disp.classList.add('running');
  }
}
function resetTimer(){
  if(timerInterval){clearInterval(timerInterval);timerInterval=null;}
  timerSecs=0;updateTimerDisplay();
  const btn=document.getElementById('btn-timer-toggle');
  btn.textContent='시작';btn.classList.add('primary');
  document.getElementById('timer-display').classList.remove('running');
}

function copyBlock(id){
  const el=document.getElementById(id);
  if(!el) return;
  const range=document.createRange();range.selectNodeContents(el);
  const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);
  document.execCommand('copy');sel.removeAllRanges();
  // Toast
  const t=document.createElement('div');
  t.textContent='✓ 복사됨';
  t.style.cssText='position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:#191F28;color:#fff;padding:.625rem 1.125rem;border-radius:999px;font-size:.875rem;font-weight:600;z-index:1000;box-shadow:0 4px 12px rgba(0,0,0,.15)';
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),1500);
}

function selectSchool(slug, yearSel){
  const sch=DATA[slug];
  document.querySelectorAll('.tab-s').forEach(t=>t.classList.toggle('active', t.dataset.slug===slug));
  document.getElementById('school-header').innerHTML=renderHeader(sch);

  const yearsHtml=[
    `<button class="tab-y" data-year="__all__">전체</button>`,
    ...sch.years.map(y=>`<button class="tab-y" data-year="${y}">${y}</button>`)
  ].join('');
  document.getElementById('tabs-year').innerHTML=yearsHtml;
  document.querySelectorAll('#tabs-year .tab-y').forEach(t=>{
    t.addEventListener('click',()=>selectYear(slug,t.dataset.year));
  });
  // Show timer for non-sparse
  document.getElementById('timer-bar').style.display = sch.sparse ? 'none' : 'flex';
  resetTimer();
  selectYear(slug, yearSel || sch.years[0]);
}

function selectYear(slug, year){
  const sch=DATA[slug];
  document.querySelectorAll('#tabs-year .tab-y').forEach(t=>t.classList.toggle('active',t.dataset.year===year));
  let inner;
  if(year==='__all__'){
    inner=sch.years.flatMap(y=>(sch.blocks_by_year[y]||[]).map((b,i)=>renderBlock(b,y,i))).join('');
  } else {
    inner=(sch.blocks_by_year[year]||[]).map((b,i)=>renderBlock(b,year,i)).join('');
  }
  if(!inner) inner='<p style="color:var(--text-3);font-size:.875rem;text-align:center;padding:2rem 0">해당 연도의 기출이 없습니다.</p>';
  const warn=sch.sparse?renderSparseWarn(sch):'';
  document.getElementById('exam-content').innerHTML=warn+inner;
  location.hash=`${slug}/${year}`;
}

function init(){
  document.getElementById('school-tabs-major').innerHTML=`
    <div class="school-group">
      <div class="school-group-title">📌 주요 학교</div>
      <div class="tabs-school">${MAJOR.map(s=>`<button class="tab-s" data-slug="${s}">${esc(DATA[s].name)}</button>`).join('')}</div>
    </div>`;
  document.getElementById('school-tabs-minor').innerHTML=`
    <div class="school-group">
      <div class="school-group-title">기타 학교</div>
      <div class="tabs-school">${MINOR.map(s=>`<button class="tab-s minor" data-slug="${s}">${esc(DATA[s].name)}${DATA[s].sparse?' ⚠':''}</button>`).join('')}</div>
    </div>`;
  document.querySelectorAll('.tab-s').forEach(t=>{
    t.addEventListener('click',()=>selectSchool(t.dataset.slug));
  });

  document.getElementById('btn-timer-toggle').addEventListener('click',toggleTimer);
  document.getElementById('btn-timer-reset').addEventListener('click',resetTimer);
  updateTimerDisplay();

  const m=location.hash.match(/^#([^/]+)(?:\/(.+))?/);
  let slug=MAJOR[0],year=null;
  if(m && ALL.includes(m[1])){slug=m[1];if(m[2])year=m[2];}
  selectSchool(slug,year);
}
init();
</script>
</body></html>
