<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>실기 기출문제 · 자료실 · Period.</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#fff; --soft:#fafafa; --softer:#f5f7f9;
  --pink:#3182F6; --tint:#E8F2FE; --tint-soft:#F0F6FE;
  --text:#191F28; --text-2:#4E5968; --text-3:#8B95A1;
  --border:#F2F4F6; --border-strong:#E5E8EB;
  --warn-bg:#FFF8E6; --warn-text:#A36F00; --warn-border:#F3E0A5;
  --serif:'KoPubWorld Batang','Nanum Myeongjo','Noto Serif KR',serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  line-height:1.7;font-size:15.5px;-webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
.app{padding-left:240px;min-height:100vh}
@media (max-width:760px){.app{padding-left:0}}

/* Sidebar */
aside.sidebar{position:fixed;top:0;left:0;width:240px;height:100vh;overflow-y:auto;z-index:5;
  background:var(--soft);border-right:1px solid var(--border);padding:1.75rem 1.25rem}
@media (max-width:760px){aside.sidebar{position:sticky;top:0;left:auto;width:auto;height:auto;
  overflow:visible;border-right:0;border-bottom:1px solid var(--border);padding:1rem 1.125rem;background:var(--soft);z-index:10}}
.sb-brand{font-size:.75rem;font-weight:700;letter-spacing:.5px;color:var(--pink);margin-bottom:1.25rem}
.sb-section-title{font-size:.6875rem;font-weight:800;color:var(--text-3);letter-spacing:.6px;
  text-transform:uppercase;margin:0 0 .5rem;padding:0 .75rem}
.sb-list{display:flex;flex-direction:column;gap:.125rem}
.sb-item{display:flex;align-items:baseline;gap:.5rem;padding:.5rem .75rem;border-radius:10px;
  font-size:.875rem;color:var(--text-2);text-decoration:none;transition:all .15s ease}
.sb-item:hover{background:rgba(0,0,0,.03);color:var(--text)}
.sb-item.active{background:var(--tint);color:var(--pink);font-weight:700}
.sb-num{font-size:.6875rem;font-weight:700;color:var(--text-3);letter-spacing:.5px;flex-shrink:0;min-width:1.75rem}
.sb-item.active .sb-num{color:var(--pink)}

/* Main */
.wrap{max-width:880px;margin:0 auto;padding:2.5rem 1.5rem 5rem}
.brand{font-size:.75rem;font-weight:700;letter-spacing:.5px;color:var(--pink);margin-bottom:.375rem}
.crumb{font-size:.8125rem;color:var(--text-3);margin-bottom:.5rem}
.crumb-sep{margin:0 .375rem;color:var(--border-strong)}
h1{font-size:1.875rem;font-weight:800;margin:0 0 .375rem;letter-spacing:-.025em}
.lead{font-size:.9375rem;color:var(--text-2);margin:0 0 2rem;line-height:1.7}

/* School groups (sidebar 학교 그룹 chip) */
.school-group{margin-bottom:1.5rem}
.school-group-title{
  display:flex;align-items:center;gap:.5rem;
  font-size:.75rem;font-weight:700;color:var(--text-3);
  letter-spacing:.5px;text-transform:uppercase;
  margin:0 0 .625rem;
}
.school-group-title::after{
  content:'';flex:1;height:1px;background:var(--border);
}

/* School tabs (수평 chip) */
.tabs-school{display:flex;flex-wrap:wrap;gap:.375rem;margin-bottom:.75rem}
.tab-s{font-size:.875rem;font-weight:600;padding:.5rem .875rem;border-radius:10px;
  background:transparent;color:var(--text-2);border:1px solid transparent;cursor:pointer;
  transition:all .15s ease;font-family:inherit;white-space:nowrap}
.tab-s:hover{background:var(--soft);color:var(--text)}
.tab-s.active{background:var(--pink);color:#fff;font-weight:700}
.tab-s.minor{font-size:.8125rem;opacity:.85}

/* Divider */
.tabs-divider{margin:1rem 0 1.25rem;border-top:1px solid var(--border)}

/* School header card */
.school-header{margin-bottom:1.25rem;padding:1.25rem 1.375rem;background:linear-gradient(180deg,var(--tint-soft),#fff);
  border:1px solid var(--border);border-radius:16px}
.school-header h2{margin:0 0 .25rem;font-size:1.375rem;letter-spacing:-.02em;font-weight:800}
.school-header .full{font-size:.875rem;color:var(--text-2);margin:0 0 .75rem}
.school-header .stats{display:flex;flex-wrap:wrap;gap:.375rem;margin:.5rem 0 0}
.stat-chip{font-size:.6875rem;font-weight:600;color:var(--text-2);background:#fff;
  padding:.25rem .625rem;border-radius:999px;border:1px solid var(--border)}
.stat-chip.warn{color:var(--warn-text);background:var(--warn-bg);border-color:var(--warn-border)}

.meta-table{display:grid;grid-template-columns:max-content 1fr;gap:.5rem 1rem;
  margin-top:.875rem;padding:.875rem 1rem;background:#fff;border:1px solid var(--border);border-radius:12px}
.meta-table dt{font-size:.75rem;font-weight:700;color:var(--text-3);letter-spacing:.5px;text-transform:uppercase}
.meta-table dd{margin:0;font-size:.8125rem;color:var(--text);line-height:1.55}
.meta-table dd strong{color:var(--pink);font-weight:700}

.stages-list{margin:.5rem 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.375rem}
.stages-list li{font-size:.8125rem;color:var(--text);padding-left:.875rem;position:relative;line-height:1.55}
.stages-list li::before{content:'';position:absolute;left:0;top:.5rem;width:4px;height:4px;border-radius:50%;background:var(--pink)}
.stages-list li strong{color:var(--text);font-weight:700;margin-right:.375rem}

/* Year tabs */
.tabs-year{display:flex;flex-wrap:wrap;gap:.375rem;margin-bottom:1.75rem}
.tab-y{font-size:.8125rem;font-weight:600;padding:.375rem .8125rem;border-radius:999px;
  background:var(--soft);color:var(--text-2);border:1px solid var(--border);cursor:pointer;
  transition:all .15s ease;font-family:inherit}
.tab-y:hover{background:var(--tint);color:var(--pink)}
.tab-y.active{background:var(--pink);color:#fff;font-weight:800;border-color:var(--pink)}

/* Exam block */
.exam-block{margin:0 0 2rem;padding:1.5rem 1.625rem;background:#fff;
  border:1px solid var(--border);border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.02)}
.exam-block-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;
  padding-bottom:.875rem;border-bottom:1px solid var(--border)}
.exam-year{font-size:.875rem;font-weight:800;color:var(--pink)}
.exam-tools{display:flex;gap:.5rem}
.btn-tool{font-size:.75rem;font-weight:600;padding:.375rem .75rem;border-radius:8px;
  background:var(--soft);color:var(--text-2);border:1px solid var(--border);cursor:pointer;font-family:inherit;
  transition:all .15s ease}
.btn-tool:hover{background:var(--tint);color:var(--pink);border-color:var(--tint)}

/* Section types within block */
.sec{margin:0 0 1rem}
.sec:last-child{margin-bottom:0}

.sec-year-meta{font-size:.875rem;color:var(--text-3);font-weight:600;margin:.75rem 0 .25rem}

.sec-poem{
  margin:1rem 0;padding:1.5rem 1.75rem;
  background:linear-gradient(180deg,#FAFBFD,#fff);
  border:1px solid var(--border);border-left:3px solid var(--pink);border-radius:12px;
}
.sec-poem-head{display:flex;align-items:baseline;gap:.625rem;margin-bottom:1rem;padding-bottom:.625rem;border-bottom:1px dashed var(--border-strong)}
.sec-poem-title{font-size:1.125rem;font-weight:800;letter-spacing:-.01em}
.sec-poem-author{font-size:.8125rem;color:var(--text-2);font-weight:600}
.sec-poem-body{font-family:var(--serif);font-size:1.0625rem;line-height:2.0;color:var(--text);
  white-space:pre;letter-spacing:-.005em}

.sec-prompt-label{display:inline-block;font-size:.6875rem;font-weight:800;color:var(--pink);
  background:var(--tint);padding:.1875rem .625rem;border-radius:999px;letter-spacing:.5px;
  margin:1rem 0 .375rem;text-transform:uppercase}
.sec-prompt{
  margin:.375rem 0 1rem;padding:1.125rem 1.375rem;
  background:var(--softer);border-left:3px solid var(--text-3);border-radius:0 12px 12px 0;
  font-size:.9375rem;line-height:1.85;color:var(--text);white-space:pre-wrap;word-break:keep-all;
  font-family:var(--serif);
}
.sec-prompt-lead{font-size:.875rem;color:var(--text-2);font-weight:600;margin:.5rem 0;line-height:1.6}

.sec-keywords{display:flex;flex-wrap:wrap;gap:.375rem;align-items:center;margin:.75rem 0 1rem}
.sec-keywords-label{font-size:.6875rem;font-weight:800;color:var(--text-3);
  letter-spacing:.5px;text-transform:uppercase;margin-right:.25rem}
.kw-chip{display:inline-flex;font-size:.875rem;font-weight:700;color:#fff;background:var(--pink);
  padding:.25rem .75rem;border-radius:999px;letter-spacing:-.005em}

.sec-question{display:flex;gap:.75rem;margin:.625rem 0;padding:.875rem 1rem;
  background:#fff;border:1px solid var(--border);border-radius:10px}
.sec-question .q-num{flex-shrink:0;font-size:.8125rem;font-weight:800;color:var(--pink);min-width:2rem}
.sec-question .q-text{font-size:.9375rem;line-height:1.7;color:var(--text)}

.sec-condition{display:flex;gap:.75rem;margin:.375rem 0;padding-left:.625rem}
.sec-condition .c-num{flex-shrink:0;font-size:.75rem;font-weight:700;color:var(--text-3);min-width:2rem}
.sec-condition .c-text{font-size:.875rem;line-height:1.65;color:var(--text-2)}

.sec-instruction{font-size:.9375rem;font-weight:700;color:var(--text);
  padding:.625rem .875rem;background:var(--tint-soft);border-radius:8px;margin:.625rem 0;line-height:1.65}

.sec-meta{font-size:.8125rem;color:var(--text-2);margin:.375rem 0;
  padding:.375rem .75rem;background:var(--soft);border-radius:8px;display:inline-block}
.sec-bullet{font-size:.875rem;color:var(--text);margin:.25rem 0;padding-left:1rem;position:relative;line-height:1.65}
.sec-bullet::before{content:'•';position:absolute;left:0;color:var(--pink);font-weight:700}

.sec-plain{font-size:.9375rem;color:var(--text-2);line-height:1.7;margin:.5rem 0;word-break:keep-all}

/* Source link */
.source-link{font-size:.75rem;color:var(--text-3);margin-top:1rem;padding-top:.75rem;border-top:1px dashed var(--border)}
.source-link a{color:var(--text-3);text-decoration:underline}
.source-link a:hover{color:var(--pink)}

/* Sparse warning */
.warn-box{background:var(--warn-bg);color:var(--warn-text);border:1px solid var(--warn-border);
  border-radius:12px;padding:1rem 1.125rem;margin-bottom:1.25rem;font-size:.8125rem;line-height:1.65}
.warn-box strong{color:#7a5200}
.warn-box ul{list-style:none;padding:0;margin:.625rem 0 0}
.warn-box li{padding:.25rem 0;border-bottom:1px dashed rgba(0,0,0,.08)}
.warn-box li:last-child{border-bottom:none}
.warn-box a{color:#7a5200;text-decoration:underline;font-weight:600}
.warn-box .date{color:#a89070;font-size:.6875rem;margin-left:.5rem}

/* Timer */
.timer-bar{display:flex;align-items:center;gap:.625rem;padding:.625rem 1rem;
  background:var(--softer);border:1px solid var(--border);border-radius:12px;margin-bottom:1.25rem;
  position:sticky;top:0;z-index:3}
.timer-display{font-family:'JetBrains Mono','Courier New',monospace;font-size:1rem;font-weight:800;color:var(--text);min-width:5.5rem}
.timer-display.running{color:var(--pink)}
.btn-timer{font-size:.75rem;font-weight:600;padding:.375rem .75rem;border-radius:8px;
  background:#fff;color:var(--text-2);border:1px solid var(--border);cursor:pointer;font-family:inherit}
.btn-timer:hover{background:var(--soft)}
.btn-timer.primary{background:var(--pink);color:#fff;border-color:var(--pink)}
.btn-timer.primary:hover{background:#1e6fe0}
.timer-hint{font-size:.6875rem;color:var(--text-3);margin-left:auto}

/* Footer */
.footer{margin-top:3rem;padding-top:1.5rem;border-top:1px solid var(--border);font-size:.75rem;color:var(--text-3)}

/* Mobile */
@media (max-width:760px){
  .wrap{padding:1.5rem 1rem 4rem}
  h1{font-size:1.5rem}
  .tabs-school{overflow-x:auto;flex-wrap:nowrap;padding-bottom:.25rem;margin:0 -1rem .75rem;padding:0 1rem .25rem}
  .tabs-year{overflow-x:auto;flex-wrap:nowrap;padding-bottom:.25rem}
  .sec-poem{padding:1.125rem 1.25rem}
  .sec-poem-body{font-size:1rem}
  .sec-prompt{padding:.875rem 1rem;font-size:.875rem}
}

/* Print */
@media print{
  body{font-size:11pt;background:#fff;color:#000}
  .app{padding-left:0}
  aside.sidebar,.tabs-school,.tabs-year,.timer-bar,.exam-tools,.warn-box,.crumb,.brand,.lead,.footer,.school-group-title,.tabs-divider{display:none !important}
  .wrap{max-width:none;padding:0 1cm}
  h1{font-size:18pt;margin-top:0;page-break-after:avoid}
  .school-header{background:#fff;border:1pt solid #888;border-radius:0;padding:.5cm}
  .school-header h2{font-size:14pt}
  .meta-table{background:#fff;border:1pt solid #999}
  .exam-block{break-inside:avoid;page-break-inside:avoid;border:1pt solid #888;
    border-radius:0;box-shadow:none;margin:.5cm 0;padding:.5cm}
  .sec-poem{border:1pt solid #999;border-left:3pt solid #000;background:#fafafa;page-break-inside:avoid}
  .sec-poem-body{font-size:11pt;line-height:1.8}
  .sec-prompt{background:#f5f5f5;border-left:3pt solid #555;page-break-inside:avoid}
  .kw-chip{background:#000 !important;color:#fff !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .source-link{color:#666;font-size:8pt}
  .exam-block-head{border-bottom:1pt solid #888}
}
</style>
</head>

": "2026. 4. 21."}], "2023": [{"sections": [{"type": "year_meta", "year": "2023", "rest": "국민대 영화과 수시 기출문제"}, {"type": "poem", "title": "첫눈이 가장 먼저 내리는 곳", "author": "정호승", "lines": ["첫눈이 가장 먼저 내리는 곳은", "너와 처음 만났던 도서관 숲길이다", "네가 처음으로 무거운 내 가방을 들어주었던", "버스 종점이다", "버스 종점 부근에 서 있던", "플라타너스 가지 위의 까치집이다", "네가 사는 다세대주택 뒷산", "민들레가 무더기로 피어나던 강아지 무덤 위다", "지리산 노고단에 피었다 진 원추리의 이파리다", "외로운 선인장의 가시 위다", "봉천동 달동네에 사는 소년의 똥무더기 위다", "초파일 날", "네가 술을 먹고 토하던 조계사 뒷골목이다", "전경들이 진압봉을 들고 서 있던 명동성당 입구다", "나를 첫사랑이라고 말하던 너의 입술 위다", "누굴 사랑해본 것은 네가 처음이라고 말하던", "나의 입술 위다"]}], "source_url": "https://blog.naver.com/365films/224259861949", "source_date": "2026. 4. 21."}], "2020": [{"sections": [{"type": "year_meta", "year": "2020", "rest": "국민대학교 영화실기자우수자전형"}, {"type": "plain", "text": "국민대 영화과 실기는 1차 글쓰기, 2차 면접으로 구성되어 있습니다."}, {"type": "meta_info", "text": "실기비중이 높은 학교로, 성적이 낮은 친구들도 노려 볼 수 있는 인서울 영화과이며,"}, {"type": "plain", "text": "수시모집에서만 인원을 선발하니 관심있는 친구들은 실기준비에 서둘러 주세요! 국민대 영화과 전형방법 1차 실기 70% + 학생부 30 2차 1단계 성적 70% + 면접 30% 영화과 글쓰기 실기 및 개인구술 면접 준비를 원하는 친구들은 연락주세요!"}, {"type": "year_meta", "year": "2020", "rest": "국민대 영화전공 수시모집 1차 기출문제  스토리구성 문제"}, {"type": "plain", "text": "국민대 영화과 1차 기출문제 장 지오노, 『나무를 심은 사람』 중에서"}, {"type": "bullet", "text": "아래의 작품을 읽고 장면 분석하여 '기승전결' 구조의 스토리로 재구성하시오."}, {"type": "plain", "text": "한 사람이 참으로 보기 드문 인격을 갖고 있는가를 알기 위해서는 여러 해 동안 그의 행동을 관찰 할 수 있는 행운을 가져야만 한다. 그 사람의 행동이 온갖 이기주의에서 벗어나 있고, 그 행동을 이글어 나가는 생각이 더없이 고결하며, 어떠한 보상도 바라지 않고, 그런데도 이 세상에 뚜렷한 흔적을 남겼다면 우리는 틀림없이 잊을 수없는 한 인격을 만났다고 할 수 있다.. 햇빛이 눈부시게 쏟아지는 6월의 아름다운 날이었다. 그러나 하늘 높이 솟아있는 나무라고는 없는 땅 위로 견디기 어려운 세찬 바람이 불고 있었다. 뼈대만 남은 집들 속으로 불어 닥치는 바람소리는 마치 식사를 방해받은 들짐승처럼 으르렁거렸다. 나는 텐트를 겆지 않을 수 없었다. 그곳에서부터 다섯 시간이나 더 걸어 보았어도 여전히 물을 찾을 수 없었고, 또 그럴 희망마저 보이지 않았다. 모든 곳이 똑같이 메말라 있었고 거친 풀들만 자라고 있었다. 그런데 저 멀리에서 작고 검은 그림자가 어른거리는 것 같았다. 나는 그림자 같은 그 모습을 홀로 서있는 나무의 둥지로 착각했다. 그것을 향해 걸어가 보니 한 양치기 목자가 있었다. 그의 곁 뜨거운 땅위에는 30여 마리의 양들이 누워 쉬고 있었다. (이하생략) *나머지 문제는 첨부화일을 확인하세요!"}, {"type": "year_meta", "year": "2020", "rest": "국민대 공연예술학부 영화전공 수시모집 2차 기출문제  면접문제"}, {"type": "plain", "text": "기본소양 1 거대한 자본과 스케일, 현란한 컴퓨터 그래픽으로 무장한 할리우드 영화의 전 세계를 한 물량고세가 해가 갈수록 거세지고 있다. 이에 대비하기 위해 우리나라 영화산업과 영화인들은 무엇을 준비해야 하는가? 기본소양 2 언제, 어디서, 누구라도 자신만의 영상콘텐츠를 제작하고 소비할 수 있는 '1인 미디어 시대'가 열렸다. 이를 가속화시킨 가장 핵심적인 요인은 무엇인가? 기본소양 1 2018년에 개봉된 독립,예술영화과 496편 중 한국영화는 113편이고, 관객 수는 11만명 수준으로 전체관객 수 대비 0.5%에 불과한 수치이다. 지난 3년간 1% 정도 수준을 유지해오던 관객 수가 절반으로 떨어진 것이다. 독립,예술영화과 '제7의 예술'로서 상업영화와 동반성장할 수 있는 방안에 대해 자신의 견해를 피력해보시오. 기본소양 2 지난 2019년 4월에 개봉한 영화 <어벤져스 : 엔드게임>이 스크린 2760개를 점유하면서 첫날 상영점유율 80.8%로 전국 극장을 싹쓸이하다시피 했다. 이런 현실에서 영화 한 편이 상영관을 독식하는 스크린 독과점 현상을 막기 위해 한 극장에서 특정 영화에 배정하는 스크린 수를 법으로 제한하는 '스크린 상한제'의 필요성이 제기되고 있다. 이런 법적 조치가 시행된다면 영화제작과 상영에 어떤 영향을 미칠 수 있을까?에 대한 자신의 견해를 피력해 보시오. 면접문제 출체의도 및 체점기준은 첨부화일을 확인하세요!"}, {"type": "year_meta", "year": "2020", "rest": "수시모집 실기우수자전형 면접문제 <공연예술학부 영화전공> 첨부화일 확인!"}, {"type": "year_meta", "year": "2021", "rest": "국민대학교 예술대학교 공연예술학부 영화전공 수시/정시 모집 기본계획안"}], "source_url": "https://blog.naver.com/365films/221915654459", "source_date": "2020. 4. 18."}], "2019": [{"sections": [{"type": "year_meta", "year": "2019", "rest": "국민대학교 수시모집 실기우수자 전형 실기 문제(영화전공 2단계) 기출문제입니다."}, {"type": "plain", "text": "국민대영화과 2차에선 영화 뿐 아니라, 사회와 영화의 관계, 그 외 시사상식에 대해서 준비를 해두어야 볼 수 있는 시험입니다. 기출문제를 중심으로 그 해 이슈가 되었던 문제들을 잘 분석해서 준비하시길 바랍니다."}, {"type": "year_meta", "year": "2019", "rest": "국민대학교 수시모집 실기우수자 전형 실기 문제(영화전공 2단계) 기출문제"}, {"type": "plain", "text": "수시문제로는 최근까지 화두되고 있는 넷플릭스 및 플랫폼에 관한 이야기와 한국영화의 침체기등이 문제로 출제되었습니다. 국민대 영화과 2차는 채점기준과 답이 출제의도가 나와 있습니다. 자신의 답지를 준비 한 후 자신이 채첨기준에 얼마나 부합한지 대조해보고, 그 후 부족한 부분을 채워가는 형식으로 연습하는 것이 중요합니다."}], "source_url": "https://blog.naver.com/365films/221719093668", "source_date": "2019. 11. 26."}, {"sections": [{"type": "year_meta", "year": "2019", "rest": "부턴 기존에 진행했던 스토리보드 실기를 없애고 글쓰기 전형으로만 진행되었던 해입니다."}, {"type": "plain", "text": "제시되는 지문을 가지고 이야기를 각색하는 형태에 실기를 치렀습니다. 수업 문의 및 진학상담은 언제나 환영~"}, {"type": "year_meta", "year": "2021", "rest": "국민대학교 예술대학 공연예술학부 영화전공 수시/정시 기본 계획안"}, {"type": "year_meta", "year": "2019", "rest": "국민대학교 수시모집 #실기우수자전형 실기 문제(영화전공 1단계) 기출문제"}, {"type": "plain", "text": "애드거 앨런 포, 「도둑맞은 편지 」 소설이 출제되었습니다. 소설의 일부를 읽고, 장면분석하여 '기승전결' 구조의  스토리를 재구성하는 시험입니다. 자세한 내용은 첨부파일로 확인하세요~!"}], "source_url": "https://blog.naver.com/365films/221713582201", "source_date": "2019. 11. 20."}]}, "total_blocks": 7, "sparse": false, "sources": [{"url": "https://blog.naver.com/365films/224259861949", "title": "[ 영화과과외 실기학원] 국민대학교 공연예술학부 영화전공 수시모집 역대 기출문제 _ 스토리구성, 시 분석, 실기위주", "date": "2026. 4. 21."}, {"url": "https://blog.naver.com/365films/223374042846", "title": "[ 영화과 과외 학원 ] 국민대학교 영화전공 기출문제 및 합격작 _ 실기위주 영화과, 스토리 구성, 포트폴리오, 인서울 영화과", "date": "2024. 3. 5."}, {"url": "https://blog.naver.com/365films/221915654459", "title": "2020학년도 국민대학교 영화실기자우수자전형 공연예술학부 영화전공 기출문제 1차/2차", "date": "2020. 4. 18."}, {"url": "https://blog.naver.com/365films/221719093668", "title": "2019학년도 국민대학교 수시모집 실기우수자 전형 실기 문제(영화전공 2단계) 기출문제 _영화과입시학원 영화연출실기 영화과과외", "date": "2019. 11. 26."}, {"url": "https://blog.naver.com/365films/221713582201", "title": "2019학년도 국민대학교 수시모집 실기우수자 전형 실기 문제(영화전공 1단계) 기출문제 _국민대 영화과 실기 준비 영화과 과외 실기", "date": "2019. 11. 20."}, {"url": "https://blog.naver.com/365films/221236354397", "title": "국민대학교 공연예술학부 영화전공 영화실기자 우수자전형 실기고사 기출문제 2018 수시전형 _ (국민대 영화과 기출문제 / 국민대 스토리보드 구성 / 영화과 실기고사 문제)", "date": "2018. 3. 24."}], "meta": {"category": "major", "admission": "수시 실기우수자", "recruit": "10~12명", "ratio": "1차 실기 70% + 학생부 30% / 2차 1단계 70% + 면접 30%", "stages": [{"name": "1차 실기", "detail": "시 제시문을 읽고 스토리 구성 (글쓰기)"}, {"name": "2차 면접", "detail": "포트폴리오 + 영화·사회 시사상식"}], "duration": "시험시간 비공개 (통상 3시간)", "tip": "시 화자의 의도를 영상·서사로 재구성하는 능력 평가"}}, "knua": {"name": "한예종", "full_name": "한국예술종합학교 영상원 영화과", "exam_type": "글쓰기 / 이야기구성", "years": ["2026", "2025", "2024", "2023", "2022", "2021", "2020", "2019", "2017"], "blocks_by_year": {"2026": [{"sections": [{"type": "plain", "text": "한예종 영화과는 8월 특기자 전형, 11월 일반 전형으로 인원을 선발하고 있습니다."}, {"type": "meta_info", "text": "실기 비중이 80% 높은 비중을 차지하고 있고, 일반 전형에 30명 넘는 인원을 선발하는 만큼 실기 준비를 열심히 한다면 충분히 승산 있는 학교입니다."}, {"type": "plain", "text": "또 수시 6개 카드에 포함되지 않는 학교이니 보너스 개념으로 무조건 지원해 보는 걸 추천합니다."}, {"type": "year_meta", "year": "2027", "rest": "한예종 영화과 모집 요강 요약"}, {"type": "meta_info", "text": "모집인원 30명"}, {"type": "plain", "text": "1차 글쓰기 테스트 실기 80% [영화과 학원 실기 과외 ]"}, {"type": "year_meta", "year": "2026", "rest": "한국예술종합학교 영상원 영화과 기출문제 일반전형 / 특기자전형 글쓰기, 이야기 구성"}, {"type": "year_meta", "year": "2027", "rest": "한예종 영화과 실기준비 합격생 모집"}, {"type": "plain", "text": "[영화과 학원 실기 과외 ]"}, {"type": "year_meta", "year": "2026", "rest": "예술사과정 신입생 모집 영상원 영화과 1차 글쓰기》"}, {"type": "instruction", "text": "다음 글을 읽고 주어진 질문에 답하시오. (60점)"}, {"type": "plain", "text": "우리는 과거에 \"게임에 있는 건 다 가짜다. 게임 세상은 가짜다\"라고 생각하기 쉬운데 실제로 그렇지 않고요. 젊은 세대들이나 유저들이 받아들일 때는 게임 속에서 겪는 일도 다 진짜라고 생각합니다. 그래서 이게 가치가 없는 것이 아니고 게임에서 겪는 일, 게임에서 배우는 것, 게임에서 다른 사람과 관계를 가지는 것, 이런 것들도 다 \"현실과 마찬가지의 어떤 중요한 경험이자 체험이다\". 저는 이렇게 생각합니다."}, {"type": "question", "num": "1", "text": "위 제시문은 게임개발자의 방송 인터뷰에서 발췌한 것이다"}, {"type": "instruction", "text": "게임개발자의 의견에 대한 본인의 생각을 자유롭게 서술하시오. (600자 이내로 쓸 것)"}, {"type": "plain", "text": "출처: 한예종 입학처 《2026학년도 예술사과정 신입생 모집 영상원 영화과 1차 》"}, {"type": "instruction", "text": "다음 글을 읽고 주어진 질문에 답하시오. (40점)"}, {"type": "plain", "text": "From the earliest decades of cinema, monsters and villains functioned as clear embodiments of evil. In classical Hollywood, film narratives relied on strict moral binaries: the hero represented order, while the villain embodied chaos, criminality, or an external threat. Monsters such as Nosferatu (1922) or the creatures of Universal's horror cycle were visualizations of collective anxieties-disease, invasion, or the \"unknown\"-but they were still narratively simple: they threatened society, and the hero restored balance by destroying them. By the mid-20th century, however, villains began to acquire psychological depth. Film noir introduced morally ambiguous antagonists and antiheroes, reflecting postwar disillusionment and anxiety. Here, villains were no longer monstrous others but corrupted insiders-ordinary people shaped by trauma, desire, or social pressure. This shift coincided with weakening censorship, changing gender norms, Cold War paranoia, and the rise of more complex character studies. From the 1960s through the 1980s, the transformation accelerated. Horror icons like Hitchcock's Norman Bates, Spielberg's Jaws, or Ridley Scott's Alien reflected fears tied to the home, technology, and institutions. Meanwhile, films began portraying villains as products of systemic violence or social neglect-think Travis Bickle in Taxi Driver or the criminals in Bonnie and Clyde. The villain became a lens to critique society itself. In the 21st century, the distinction between hero and villain has become increasingly porous. Contemporary cinema grants villains emotional motivation, traumatic backstories, even moral logic. Characters such as Joker, Killmonger, or Thanos invite viewers to experience sympathy or ambivalence. The villain becomes a mirror: a figure embodying what society represses, fears, or fails to fix. Even classic antagonists are now reimagined as misunderstood beings shaped by exclusion or exploitation. Today, villains function less as simple antagonists and more as agents who disrupt narrative stability. They force characters-and audiences-to confront unresolved ethical, political, or psychological issues. This evolution reflects broader cultural shifts: audiences no longer accept a binary moral universe, and contemporary storytelling often prioritizes complexity over certainty. This trajectory demonstrates not only a shift in character design but a profound transformation in how audiences interpret evil, responsibility, and the boundaries of empathy. As society grows more fragmented and ethically uncertain, villains will likely continue to serve as dynamic and unsettling reflections of our cultural and emotional landscape."}, {"type": "question", "num": "2", "text": "위의 제시문을 읽고 요약하시오. (400자 이내로 쓸 것)"}, {"type": "question", "num": "3", "text": "위의 제시문을 읽고 이에 대한 본인의 생각을 서술하시오. (600자 이내로 쓸 것) 출처: 한예종 입학처 《2026학년도 예술사과정 신입생 모집 영상원 영화과 2차시험 》"}, {"type": "instruction", "text": "[ 문제 1] 아래 조건에 맞게 완결된 이야기를 구성하시오. (띄어쓰기 포함 원고지 1800자 이내)"}, {"type": "plain", "text": "< 조건 > 고등학교 졸업식 날이다. A는 고등학교 담임 선생이다. B는 수업마다 잠만 자는 학생이다. C는 전교 1등이다. A.B.C 세 사람 모두 졸업식에 불참한다. 졸업식 후 5일 뒤, A.B.C 중 한 사람은 실종된다. 실종 사건 후 5년이 지났다. A.B.C 세 사람은"}], "source_url": "https://blog.naver.com/365films/224255700696", "source_date": "2026. 4. 17."}], "2025": [{"sections": [{"type": "year_meta", "year": "2025", "rest": "예술사과정 신입생 모집 영상원 영화과 1차  글쓰기"}, {"type": "plain", "text": "한예종 영화과는 수시 6장 카드 외 추가 로 쓸 수 있는 학교 입니다. 또 실기80% 차지 하고 있는 만큼 실기준비가 무엇보다 중요합니다."}, {"type": "year_meta", "year": "2025", "rest": "한국예술 종합학교 영상원 영화과 기출문제 / 일반전형 외국어성적우수자/ 영상예술특기자"}, {"type": "plain", "text": "언어특기자, 영상특기자"}, {"type": "year_meta", "year": "2025", "rest": "한국예술 종합학교 영상원 영화과 기출문제 / 일반전형 외국어성적우수자/ 영상예술특기자"}, {"type": "year_meta", "year": "2025", "rest": "예술사과정 신입생 모집 영상원 영화과 1차"}, {"type": "plain", "text": "1. (60점) 예술 작품의 ‘상업성’과 ‘순수성’이라는 개념은 종종 함께 언급된다."}, {"type": "instruction", "text": "1-1. 본인이 생각하는 예술 작품의 ‘상업성’과 ‘순수성’의 개념을 각각 서술하시오. (400자 이내)"}, {"type": "instruction", "text": "1-2. ‘상업성’과 ‘순수성’이라는 서로 다른 두 개념의 관계에 대해 본인의 생각을 서술하시오. (600자 이내)"}, {"type": "bullet", "text": "위 문제에서 기술한 예술 작품은 모든 예술 장르를 통칭한다"}, {"type": "plain", "text": "출처: 한예종 입학처"}, {"type": "instruction", "text": "2. 다음 글을 읽고 주어진 질문에 답하시오. (40점)"}, {"type": "plain", "text": "Cubism, one of the most influential art movements of the 20th century, fundamentally altered how artists and audiences perceive and represent reality. Initiated by Pablo Picasso and Georges Braque in the early 1900s, Cubism challenged the conventions of linear perspective and realistic portrayal that had dominated Western art for centuries. Unlike earlier movements, which focused on accurate and singular depictions of objects and scenes, Cubism fragmented and reconstructed forms to portray multiple perspectives at once, aiming to present objects as if viewed from different angles simultaneously. At the heart of Cubism was the desire to capture the essence of objects rather than their superficial appearance. This led to the development of two primary phases within Cubism: Analytic and Synthetic. Analytic Cubism, which dominated the early years of the movement, involved a meticulous deconstruction of objects into basic geometric shapes. Artists would break down objects like guitars, bottles, and human faces into facets, presenting them from several angles in the same work. This phase of Cubism maintained a muted color palette, focusing more on form than on color, which allowed viewers to concentrate on the complexities of perspective and structure. The later phase, known as Synthetic Cubism, emerged around 1912 and introduced a new approach. Rather than simply deconstructing objects, artists began to reconstruct or \"synthesize\" them. In Synthetic Cubism, artists often used bright colors and incorporated found objects such as newspaper clippings, fabric, and other materials into their compositions. This technique, known as collage, allowed Cubists to challenge traditional boundaries of painting by integrating elements from the real world. This not only expanded the possibilities for expression but also made a statement about the evolving role of art as a reflection of contemporary society. Cubism’s impact went beyond the realm of painting. Its influence permeated other forms of art, including sculpture, literature, and even architecture. The movement's emphasis on abstraction and multiplicity of perspectives inspired writers, architects, and designers to break from linearity and embrace more fragmented, innovative approaches. In literature, for example, authors like Gertrude Stein experimented with fragmented and disjointed language, mirroring the Cubist style. In architecture, the movement contributed to the development of modernist structures characterized by geometric forms and abstract designs. Ultimately, Cubism paved the way for other modern art movements, including Futurism, Constructivism, and Surrealism. By questioning the norms of representation and exploring new ways to depict reality, Cubism laid the groundwork for abstraction as a dominant mode in modern art. It opened up endless possibilities for artists to move beyond imitation and into the realms of imagination and conceptual exploration. Through its radical approach, Cubism remains a testament to the power of art to reshape perceptions and redefine the boundaries of creative expression."}, {"type": "instruction", "text": "2-1. How were objects represented in Cubism? (100자 이내로 한글로 답하시오.)"}, {"type": "instruction", "text": "2-2. How did Synthetic Cubism differ from Analytic Cubism? (100자 이내로 한글로 답하시오.)"}, {"type": "instruction", "text": "2-3. What are the impacts of Cubism? (200자 이내로 한글로 답하시오.)"}, {"type": "year_meta", "year": "2026", "rest": "한예종 영화과 일반전형 입시요강"}, {"type": "year_meta", "year": "2025", "rest": "예술사과정 신입생 모집 영상원 영화과 2차시험 이야기구성"}, {"type": "question", "num": "1", "text": "아래 조건을 바탕으로 완결된 이야기를 구성하시오.（80점) (띄어쓰기 포함 원고지 1,500자 이내로 작성할 것) 영화의 주요 공간은 바다를 끼고 있는 소도시이다. 영화는 한 마을에서 발생한 미스터리를 해결하는 과정이 반드시 포함되어야 한다. 주요 인물 A는 위의 사건과 관련된 인물로, 진실을 알고 있지만 감추고 있다. 주요 인물 B는 숨겨진 진실을 밝혀내는 인물이다. 이야기는 일주일 이내에 종결된다."}, {"type": "bullet", "text": "제목을 맨 위에 적을 것"}, {"type": "bullet", "text": "인물의 이름은 반드시 A, B와 같이 알파벳으로 표기할 것"}, {"type": "question", "num": "2", "text": "문제1에서 작성한 이야기를 시각화할 때 가장 중요한 쇼트(shot) 2개를 정하고, 그 이유를 설명하시오. (20점) (띄어쓰기 포함 원고지 200자 이내로 작성할 것) 출처: 한예종 입학처"}, {"type": "year_meta", "year": "2025", "rest": "예술사과정 신입생 모집 영상원 영화과 특별전형"}, {"type": "plain", "text": "(외국어성적우수자, 영상예술특기자) 이야기 구성 <이미지를 해석하여 이야기 구성하기> 출처: 한예종 입학처"}, {"type": "instruction", "text": "<문제1> 주어진 각각의 이미지를 해석하고, 그것이 무엇인지 명확히 서술하시오."}, {"type": "plain", "text": "(400자 이내로 작성할 것. 띄어쓰기 및 마침표 포함)"}, {"type": "instruction", "text": "<문제2> 1번에서 답한 각각의 해석을 바탕으로 하나의 이야기를 구성하시오."}, {"type": "plain", "text": "(1,200자 이내로 작성할 것. 띄어쓰기 및 마침표 포함)"}, {"type": "condition", "num": "1", "text": "세 가지 해석이 모두 들어가도록 할 것. 단 사진의 순서는 상관 없음."}, {"type": "condition", "num": "2", "text": "등장인물의 이름은 반드시 A,B,C... 등 알파벳으로 표기할 것."}, {"type": "condition", "num": "3", "text": "현재 시점의 이야기로 작성할 것. *아래 파일을 꼭 다시 한번 확인하세요*"}, {"type": "year_meta", "year": "2026", "rest": "한예종 영화과 일반전형 입시요강"}], "source_url": "https://blog.naver.com/365films/223839630503", "source_date": "2025. 4. 19."}], "2024": [{"sections": [{"type": "year_meta", "year": "2024", "rest": "한국예술종합학교 영상원 영화과 기출문제 _ 일반전형, 특별전형(외국어성적우수자) <영상예술특기자>_ 한예종 영화과 실기 과외 학원 이야기 구성, 논술"}, {"type": "year_meta", "year": "2024", "rest": "한국예술종합학교 영상원 영화과 기출문제 _ 일반전형, 특별전형(외국어성적우수자) <영상예술특기자>_ 한예종 영화과 실기 과외학원 이야기구성, 논술"}, {"type": "year_meta", "year": "2024", "rest": "한국예술종합학교 영상원 영화과 기출문제  일반전형, 특별전형(외국어 성적 우수자)(영상예술특기자)를 준비했습니다."}, {"type": "plain", "text": "한예종 영화과는 8월 특기자 전형 ( 외국어, 영상특기자), 11월 일반 전형으로 전형이 나누어져 있으며, 수시모집에서 쓰는 6개 원서 외 추가로 쓸 수 있는 학교입니다. 높은 지원율을 자랑하는 만큼 많은 인원을 선발하는 만큼 잘 준비한다면 오히려 다수의 영화과 영화영상학과 보다 승산이 있다고 생각합니다~"}, {"type": "year_meta", "year": "2025", "rest": "한예종 영화과 일반전형 최소 30명 이상 인원 선발!!!"}, {"type": "meta_info", "text": "또 실기 비중이 높고, 나이 제한도 없는 만큼 다양한 연령대 친구들이 지원해 볼 수 있으니 참고하시길 바랍니다!"}, {"type": "year_meta", "year": "2024", "rest": "한국예술종합학교 영상원 영화과 기출문제 _ 일반전형, 특별전형(외국어성적우수자) <영상예술특기자>"}, {"type": "year_meta", "year": "2025", "rest": "한예종 영화과 입시요강 요약"}, {"type": "plain", "text": "8월 입시 특 기자 전형 외국어성적우수자 : 9명, 영상예술특기자 : 6명 이야기구성/ 구술시험/ 논술하기 11월 입시 일반전형"}, {"type": "meta_info", "text": "모집인원 30명"}, {"type": "plain", "text": "1차 글쓰기 테스트 / 내신 20%"}, {"type": "year_meta", "year": "2025", "rest": "한예종 영화과 입시 요강"}, {"type": "plain", "text": "한예종 영화과 입시 준비 학원 과외"}, {"type": "year_meta", "year": "2024", "rest": "예술사과정 신입생 모집 1차 영상원 영화과"}, {"type": "plain", "text": "예술은 사회·정치·문화의 변화에 영향을 미친다"}, {"type": "question", "num": "1", "text": "(70점) A. 예술이 세상을 변화시킬 수 있다고 생각하는 이유는 무엇인가? (띄어쓰기 및 마침표 포함 원고지 600자 이내로 작성할 것)"}, {"type": "instruction", "text": "B. 예술이 세상을 변화시킨 구체적인 예를 두 가지 이상 제시하고, 이를 설명하시오."}, {"type": "plain", "text": "(띄어쓰기 및 마침표 포함 원고지 400자 이내로 작성할 것)"}, {"type": "question", "num": "2", "text": "(30점) Freedom of speech is fundamental to political dissent, diverse cultural expression, creativity, and innovation, as well as the development of one’s personality through self-expression. Freedom of speech and expression enables dialogue, builds understanding, and increases public knowledge. When we can freely exchange ideas and information, our knowledge improves, which benefits our communities and societies. Freedom of expression is the lifeblood of democracy. While the right to freedom of expression is fundamental, it is not absolute. This means it can be limited in exceptional circumstances. A. Summarize the main theme of this article. (띄어쓰기 및 마침표 포함 원고지 100자 이내 한글로 작성할 것) B. Discuss some of the exceptional circumstances for civil discourse. (띄어쓰기 및 마침표 포함 원고지 300자 이내 한글로 작성할 것) 한예종 영화과 영어지문 기출문제"}, {"type": "year_meta", "year": "2024", "rest": "예술사과정 신입생 모집 2차 영상원 영화과"}, {"type": "plain", "text": "다음 주어진 3개의 이미지들을 각각 해석하여 이야기 구성하기"}, {"type": "year_meta", "year": "2024", "rest": "한예종 영화과 기출문제"}, {"type": "instruction", "text": "[ 문제 1 ] 주어진 3개의 이미지들을 본인은 어떻게 읽어내었는지 각각 서술하시오 (400자 이내로 작성할 것. 띄어쓰기 및 마침표 포함)"}, {"type": "instruction", "text": "[ 문제 2 ] 1번에서 답한 각각의 해석을 모두 주요 설정으로 삼아 완결된 이야기로 구성하시오. (1200자 이내로 작성할 것. 띄어쓰기 및 마침표 포함)"}, {"type": "plain", "text": "조건 1 : 등장인물의 이름은 반드시 A, B, C 등 알파벳으로 표기할 것. 조건 2 : 시제는 현재진행형으로 할 것. 한예종 영화과 실기 학원 과외"}, {"type": "year_meta", "year": "2024", "rest": "예술사과정 신입생 모집 영상원 영화과 특별전형(외국어성적우수자)"}, {"type": "plain", "text": "다음 주어진 3개의 이미지들을 각각 해석하여 이야기 구성하기 한예종 영화과 기출문제 특기자 전형"}, {"type": "instruction", "text": "<문제 1> 주어진 3개의 이미지들을 본인은 어떻게 읽어내었는지 각각 서술하시오."}, {"type": "plain", "text": "(400자 이내로 작성할 것. 띄어쓰기 및 마침표 포함)"}, {"type": "instruction", "text": "<문제 2> 1번에서 답한 각각의 해석을 모두 주요 설정으로 삼아 이야기를 구성하시오."}, {"type": "plain", "text": "(1200자 이내로 작성할 것. 띄어쓰기 및 마침표 포함)"}, {"type": "condition", "num": "1", "text": "등장인물의 이름은 반드시 A,B,C.....등 알파벳으로 표기할 것."}, {"type": "condition", "num": "2", "text": "시제는 현재진행형으로 할 것."}, {"type": "year_meta", "year": "2024", "rest": "예술사과정 신입생모집 영상원 영화과 특별전형 <영상예술특기자> 1차 시험"}, {"type": "plain", "text": "심층면접 1 주 제 > 주어진 영상 텍스트를 보고 질문에 답하기 과 제 > ‘주어진 영상물1과 영상물2를 전체 스토리에 처음과 끝에 배치하여 중간 스토리를 채워 로그라인으로 정리하여 발표하기’"}, {"type": "condition", "num": "1", "text": "영상물 1과 영상물 2중에 어느 것이든 처음과 끝이 될 수 있음."}, {"type": "condition", "num": "2", "text": "오전에 주어진 영상물 관람 후 오후 개별 심층면접 시 답하여야 함."}, {"type": "condition", "num": "3", "text": "위 과제 외에도 해당 영상의 다양한 구성요소에 대한 면접관들의 질문에 답하여야 함. (심층면접 시, 영상 관람 전후 본인이 작성한 메모를 참고할 수 있음) * 로그라인이란? (영화) 이야기의 방향을 설명하는 한 문장. 한 문장으로 요약된 줄거리. 출처 네이버 국어사전 * 아래 파일을 꼭 다시 한번 확인하세요 *"}], "source_url": "https://blog.naver.com/365films/223432153426", "source_date": "2024. 4. 30."}, {"sections": [{"type": "year_meta", "year": "2024", "rest": "입시에서 역시 영어 지문이 제시될 수 있다고 하니 참고하시길 바랍니다."}, {"type": "plain", "text": "글쓰기, 이야기 구성, 프로필 작성, 면접 준비 = 합격! 서울역, 용산역, 수서역, 동서울 터미널, 강남고속버스터미널, 남부터미널에서 대중교통으로 30~40분 이내 거리에 위치하여 지방에서 오는 친구들도 쉽게 찾아올 수 있습니다. [ 한예종 영화과 실기 과외 ]"}, {"type": "year_meta", "year": "2023", "rest": "한국예술종합학교 영상원 영화과"}, {"type": "plain", "text": "언어특기자, 영상특기자, 일반전형 기출문제"}, {"type": "year_meta", "year": "2024", "rest": "한국예술종합학교 영상원 영화과 모집요강"}, {"type": "plain", "text": "8월 입시 특기자 전형 ( 공인영어, 영상예술특기자 ) 15명 11월 입시 일반전형 실기 위주 30명 글쓰기 테스트 ( 논술, 이야기 구성 등) + 구술면접"}, {"type": "year_meta", "year": "2024", "rest": ""}, {"type": "plain", "text": "< 2024학년도 한예종 영상원 영화과 입시요강> < 한예종 영상원 영화과"}], "source_url": "https://blog.naver.com/365films/223106249371", "source_date": "2023. 5. 19."}], "2023": [{"sections": [{"type": "year_meta", "year": "2023", "rest": "기출문제 >"}, {"type": "year_meta", "year": "2023", "rest": "예술사 과정 신입생 모집 영상원 영화과"}, {"type": "plain", "text": "특별전형 (외국어 성적 우수자) <전제> '주인공'이 '누군가를 찾아가게 된다. ( 주인공은 A로 누군가는 B로 명기한다) <조건>"}, {"type": "condition", "num": "1", "text": "B를 찾아가는 이유가 드러나게 할 것. ( 단, A와 B는 가족관계가 아님)"}, {"type": "condition", "num": "2", "text": "시대 배경은 현재, 30년 전, 30년 후 가운데 하나를 택할 것."}, {"type": "condition", "num": "3", "text": "만남 이전이나 만남 이후에 핵심적인 사건이 포함되도록 구성할 것."}, {"type": "condition", "num": "4", "text": "주인공의 심정적 변화가 드러날 것. <문제>"}, {"type": "instruction", "text": "위 전제와 조건들에 충족되는 한 편의 이야기를 완성하시오."}, {"type": "plain", "text": "(1,600자 이상 2000자 이내)"}, {"type": "year_meta", "year": "2023", "rest": "신입생 모집 영상원 영화과 특별전형"}, {"type": "plain", "text": "' 영상예술특기자' 심층 면접 1 주제 및 진행 방법 안내 - '주어진 영상 텍스트를 보고 질문에 답하기' □진행 방법 - 오전 영상 텍스트를 본 후 오후 개별 심층 면접 시 해당 영상 텍스트에 대한 다양한 구성요소에 관한 면접관들의 질문에 답하여야 함"}, {"type": "year_meta", "year": "2023", "rest": "예술사 과정 신입생 모집 영상원 영화과 일반전형 1차"}, {"type": "plain", "text": "최근 우리 사회에서 촉법소년 범죄가 증가하고 있는 추세이다. 이에 소년 범죄의 증가를 막기 위한 대책의 필요성이 대두되고 있다. 그 방안으로, (A) 형사 처벌 기준 연령을 하향 조정한다. (B) 형사 처벌 기준 연령은 현행대로 유지하되 다른 대안을 강구한다."}, {"type": "instruction", "text": "위 (A) 와 (B) 중 소년범죄 증가를 막기 위해 좀 더 효과적인 방안이 어떤 것인지 선택하고,  그 이유를 서술하시오."}, {"type": "plain", "text": "(띄어쓰기 및 마침표 포함 원고지 400자 이내로 작성할 것) '촉법소년'은 형벌을 받을 범법행위를 한 만 10세 이상~14세 미만의  형사미성년자로, 형법 제9조는 '14세가 되지 아니한 자의 행위는 벌하지 아니한다'라고 규정하고 있다. 이들은 형사 책임능력이 없기 때문에 형법에 저촉되는 행위를 하더라도 형사처벌을 하지 않고, 가정법원이 소년원으로 보내거나 보호관찰을 받게 하는 등  '보호 처분'을 할 수 있다. [네이버 지식백과] 촉법소년 2. 대사 (Dialogue)는 극(劇, Drama)의 주요 구성 요소 중 하나이다."}, {"type": "instruction", "text": "대사의 중요성과 기능에 대하여 서술하시오."}, {"type": "plain", "text": "(띄어쓰기 및 마침표 포함 원고지 400자 이내로 작성할 것 ) 3. 아래 글은 <story>의 작가 로버트 맥키 (Robert Mckee) 가 쓴 책 <Dialogue>의 일부분이다."}, {"type": "instruction", "text": "저자가 아래 글에서 주장하는 바를 서술하시오. (한극작성)"}, {"type": "plain", "text": "(띄어쓰기 및 마침표 포함 원고지 200자 이내로 작성할 것)"}, {"type": "year_meta", "year": "2023", "rest": "한예종 영상원 영화과 기출문제 영어 지문"}, {"type": "year_meta", "year": "2023", "rest": "예술사 과정 신입생 모집 영상원 영화과 2차 시험"}, {"type": "instruction", "text": "[문제 1] 아래 조건에 맞게 연결된 이야기를 구성하시오. (띄어쓰기 포함 원고지 1000자 이내)"}, {"type": "plain", "text": "<조건> 이야기기의 주제어는 '평등'과 '믿음'이다. 이 중 하나를 선택한다. 이야기의 주요 공간은 '엘리베이터'와 '야구장'이다. 이 중 하나를 선택한다. 이야기의 주요 등장인물은 A와 B 두 명이다. A는 B를 알고, B는 A를 모른다."}, {"type": "instruction", "text": "[문제 2 ] 아래 문항들에 답하시오. (띄어쓰기 포함 원고지 400자 이내)"}, {"type": "plain", "text": "2-1. <문제 1>에서 선택한 주제어는 무엇인가? 2-2. 선택한 주제어를 어떻게 해석하였는가? 2-3. 2-2의 해석을 <문제 1>에 어떻게 적용하였는가? [문제 3] <문제 1>에서 A와 B의 핵심 대사 (dialogue)를 각각 한 문장씩 쓰시오. ( 띄어쓰기 포함 원고지 200자 이내) * 아래 파일을 다시 한번 꼭 확인하세요* < 한예종 영화과 공식 홈페이지> 경상남도 창원, 거제, 통영, 창원, 진해, 김해, 남해, 진주, 경상북도 안동, 영주, 포항, 경주, 의성, 상주, 구미, ​ 충청남도 대천, 천안, 아산, 태안, 공주, 충청북도 제천, 충주, 청주, 음성, 전라북도 전주, 군산, 익산, 무주, 부안, 정읍 고창, 김제, 전라남도 목포, 순천, 여수, 광주, 강원도 춘천, 원주, 강릉, 동해, 속초, 평창, 울산, 부산, 대구, 대전, 제주도 등등"}], "source_url": "https://blog.naver.com/365films/223106249371", "source_date": "2023. 5. 19."}], "2022": [{"sections": [{"type": "year_meta", "year": "2022", "rest": "1차 글쓰기, 2차 이야기구성 기출문제 입니다."}, {"type": "plain", "text": "한예종 영상원 영화과는 영화적 기본 글쓰기 외 시사상식도 중요합니다. 평상시 사회에 관심을 갖고 책, 신문, 뉴스 등등을 찾아보며 훈련을 해야 합니다. 한예종 영상원 영화과 11월 일반전형 입시는 실기가 80% 차지 하고 있어 실기가 무엇보다 중요합니다. 언제 준비하느냐가 아닌, 어떻게 준비하느냐가 중요하니 고민하고 있는 친구들은 움직이길 바랍니다. 한예종 영화과 입시준비 및 상담 한국예술종합학교 영상원 영화과"}, {"type": "year_meta", "year": "2022", "rest": "기출문제 1차 글쓰기, 2차 이야기구성"}, {"type": "year_meta", "year": "2022", "rest": "예술사과정 신입생 모집 영상원 영화과 일반전형 1차"}, {"type": "plain", "text": "글쓰기 <문제1> NFT (Non Fungible Token: 대체 불가능한 토큰)은 원본과 완벽하게 동일한 복제가 가능한 디지털 데이터에 대해 고유의 인식값을 부여하여 원본과 복제본의 구별을 가능하게 한다. 이에 에서는 NFT를 예술품과 인터넷 게시물 등에 대하여 진품임을 보증하는 일종의 디지털 증명서라고 설명하였다. NFT를 적용할 수 있는 품목은 영상, 이미지, 소리, 텍스트 등의 디지털 콘텐츠부터 예술품, 수집품, 게임 아이템, 음원, 각종 상품, 가상 부동산 등에 이르기까지 매우 다양하다. 이러한 이유로 컨텐츠 자체에 대해서는 완벽하게 동일한 복제가 가능함에도 원본의 가치를 부여하여 고가에 거래되는 상황이 벌어지고 있다. 예를 들어, 트위터 창업자 잭 도시의 첫 트위터 게시글은 290만달러에 판매 되었으며, 디지털 아티스트 비플이 만든 10초짜리 비디오클립은 온라인에서 누구든지 무료로 시청할 수 있지만 NFT거래소에서 660만 달러에 판매되었다."}, {"type": "instruction", "text": "작품의 감상적 측면에서는 동일한 복제가 얼마든지 가능한 디지털 데이터임에도 불구하고 원본이라는 인증을 통해 이러한 특별한 가치를 인정하는 것이 맞는 것인가에 대한 다양한 시각이 존재하는 상황이다. 이에 대한 본인의 생각을 서술하시오."}, {"type": "plain", "text": "(띄어쓰기 및 마침표 포함 원고지 600자 이내로 작성할 것) <문제 2> 할리우드를 대표하는 슈퍼 히어로(Superhero)의 시작은 1930년대 대공황을 배경으로 한다. 경제적 고통과 만연한 부패, 그리고 공권력이 부재했던 시대적 탈출구로 영웅은 만들어졌다. 세계대전에 참전한 미국의 승자 이미지를 기반으로 팍스 아메리카나의 상징이 되었고, 매카시즘의 광풍을 거쳐 고뇌에 찬 다양한 슈퍼 히어로들로 재탄생한다. 최근 그래픽 노블이라는 장르로 재구성되면서 보다 정교한 스토리텔링으로 확대되었고, 할리우드 대표 브랜드가 되었다. [ 네이버 지식백과 ] 슈퍼 히어로 - 들어가는 말 (슈퍼 히어로. 2013. 2. 25. 한창완) 슈퍼 히어로는 Hero, Villain, Neutral, Anti-hero의 유형으로 나눌 수 있다. 최근작 중 대표적인 Villain형 슈퍼 히어로는 조커(Joker, 2019), Neutral한 슈퍼 히어로의 대표적인 캐릭터는 데드풀(Deadpool, 2016)을 들 수 있다. Villain형 슈퍼 히어로인 조커는 가해자인 동시에 피해자이다. Neutral한 슈퍼 히어로인 데드폴은 때때로 악인이 아닌 선한 캐릭터들과 적으로 싸우기도 한다. 조커와 데드폴은 선과 악의 성격이 혼재되어 있는 슈퍼 히어로 볼 수 있다. 대표적인 Anti-hero 슈퍼 히어로 중 하나인 베놈(Venom, 2005)의 욕망, 도덕성과 행동은 관객을 혼란스럽게 한다. 이러한 슈퍼 히어로들은 전통적인 슈퍼 히어로와 달리 선과 악의 경계를 넘나드는 슈퍼 히어로들이다. 이러한 성격의 슈퍼 히어로들이 등장한 이유에 대하여 자신의 의견을 서술하시오. (띄어쓰기 및 마침표 포함 원고지 600자 이내로 작성 할 것) 한예종 영화과 일반전형 1차 기출문제"}, {"type": "year_meta", "year": "2022", "rest": "예술사과정 신입생 모집 영상원 영화과 2차시험"}, {"type": "question", "num": "1", "text": "아래 조건에 맞게 완결된 이야기를 구성하시오.(띄어쓰기 포함 원고지 1000자 이내)(70점) 1.이야기의 주제어는 ‘거짓말’과 ‘건강’이다. 이중 하나를 선택한다. 2.이야기의 배경은 주말 오후의 대형 쇼핑센터이다. 3.이야기의 주요 등장인물은 3명이다. 그들은 서로 모르는 사이였다."}, {"type": "question", "num": "2", "text": "문제1에서 본인이 선택한 주제어를 밝히고, 이야기에 적용한 의도를 서술하시오. (띄어쓰기 포함 원고지 600자 이내)(30점) 한예종 영화과 2차 기출문제"}, {"type": "year_meta", "year": "2022", "rest": "예술사과정 신입생모집 영상원 영화과 특별전형"}, {"type": "instruction", "text": "다음 주어진 조건들에 맞게 문제에 답하시오."}, {"type": "plain", "text": "<조건1> A, B, C는 2021년 현재 대한민국에 거주하고 있으며 예전부터 서로 아는 사이이다. <조건2> A, B, C는 이미 서로 아는 사이였던 과거의 어느 시점에 어떤 사건을 함께 겪었다. 이 과정에서 A는 B의 행동에 깊은 감동을 받았다. A와 달리, C는 B의 행동에 전혀 감동받지 않았다. <조건3> 답안에 등장하는 인물의 이름은 반드시 A, B, C... 등 알파벳으로 표기할 것. * 참고 사항 - 행동: 분명한 목적이나 동기를 가지고 생각과 선택, 결심을 거쳐 의식적으로 행하는 인간의 의지적인 언행. 윤리적인 판단의 대상이 된다. (표준국어대사전) - 감동: 크게 느끼어 마음이 움직임. (표준국어대사전) <문제1> 3명의 인물 A, B, C를 각각 소개하시오. 인물 사이의 관계가 명확히 드러나야 함. (띄어쓰기 및 마침표 포함 한 인물 당 원고지 80-120자, 총 240-360자) (배점 30점)"}, {"type": "instruction", "text": "<문제2> <조건2> 에 언급된 사건의 내용을 구체적으로 기술하시오. 내용 속에는 사건이 벌어진 시간, 공간, A가 감동을 받게 된 B의 행위에 대한 기술이 반드시 포함되어야 함. (띄어쓰기 및 마침표 포함 원고지 1,000-1,200자) (배점 40점)"}, {"type": "plain", "text": "<문제3> <조건2> 에 언급된 사건에서 C가 B의 행동에 감동을 받지 않은 이유는 무엇인가? 3인칭 시점으로 서술하되 C의 관점이 잘 드러나도록 답안을 작성해야 함. (띄어쓰기 및 마침표 포함 원고지 600-800자) (배점 30점) 한예종 영화과 특별전형 기출문제 < 자세한 내용은 아래 파일을 꼭 다시 한번 확인하세요!>"}], "source_url": "https://blog.naver.com/365films/222743527189", "source_date": "2022. 5. 23."}, {"sections": [{"type": "year_meta", "year": "2022", "rest": "한예종 영상원 영화과 입시는 1차 실기 80% 높은 비중을 차지하고 있어"}, {"type": "plain", "text": "실기 준비가 중요하니 아직 고민하고 있는 친구가 있다면 고민만 하지 말고 상담받아보고 움직이세요! 한예종 영화과 실기 준비 문의 한국예술 종합학교 영화과 Q.A Q. 한예종 영화과는 수시, 정시 모집 중 언제 지원할 수 있나요? ​-한예종 입시는 수시와 정시를 구분하지 않습니다. 특수대학으로서 독자적으로 입시를 진행합니다. Q. 한예종은 일반 대학인가요? -일반대학이 아니라 특수대학으로 분리됩니다. 보통의 종합대학이 교육과학기술부 소속인 반면, 한국예술 종합학교는 문화체육관광부 산하의 대학이라 운영에 상당 부분 자율성이 보장되는 학교입니다. Q. 한국예술종합학교 영상원 영화과 학비는 어떻게 되나요? -한예종은 국립대로 타 종합대학 등록금 절반 수준에 이릅니다. 2020학년도 기준 수업료 입학금, 수업료, 기성회비 등을 합하여 3백만 원 이내입니다. 출처 한국예술 종합학교 공식 홈페이지 [ 한예종 영화과 과외 ]"}], "source_url": "https://blog.naver.com/365films/222320536688", "source_date": "2021. 4. 23."}], "2021": [{"sections": [{"type": "year_meta", "year": "2021", "rest": "한예종 영화과는 코로나19로 자체 국어 영어 시험이 없어지고 실기로만 인원을 선발하여 경쟁률이 어느 때보다 치열했던 한 해였죠."}, {"type": "plain", "text": "올해 역시 국어, 영어 시험이 없어지고 1차 실기가 무려 80%!!! 아직도 실기 준비를 망설이는 친구가 있다면 망설이지 말고 준비하세요."}, {"type": "meta_info", "text": "실기 비중이 높은 올해가 기회입니다."}, {"type": "plain", "text": "영화과 실기 과외 한국예술종합학교 영상원 영화과 기출문제 2021학년도 / 특 기자 전형, 일반전형"}, {"type": "year_meta", "year": "2021", "rest": "예술사 과정 신입생 모집 영상원 영화과 특별전형"}, {"type": "instruction", "text": "문제> 다음 주어진 조건들에 맞게 문제에 답하시오."}, {"type": "condition", "num": "1", "text": "1인칭 화자 ‘나’는 할아버지, 할머니 (또는 외할아버지, 외할머니) 그리고 동생과 함께 4인 직계가족을 이루어 살고 있었다."}, {"type": "condition", "num": "2", "text": "1인칭 화자 ‘나’와 나의 동생은 어떤 사건이 일어나 할아버지, 할머니 (또는 외할아버지, 외할머니)와 헤어져 살게 되었다."}, {"type": "condition", "num": "3", "text": "이후 또 다른 사건이 일어남으로써 ‘나’와 나의 동생은 할아버지, 할머니 (또는 외할아버지, 외할머니)와 재결합하여 현재까지 함께 살고 있다, 조건 4) 등장인물의 이름은 반드시 A, B, C... 등 알파벳으로 표기할 것."}, {"type": "year_meta", "year": "2021", "rest": "예술사 과정 신입생 모집 영상원 영화과 특별전형  이야기 구성"}, {"type": "year_meta", "year": "2021", "rest": "예술사 과정 신입생 모집 영상원 영화과 일반전형 1차"}, {"type": "instruction", "text": "다음 제시문을 읽고, 주어진 조건들에 맞게 문제에 답하시오."}, {"type": "plain", "text": "『항공업계에 따르면 국내 항공사들은 오는 2020년 12월 12일부터 무착륙 국제관광비행을 실시할 계획이다. 무착륙 국제관광비행은 코로나19 직격탄을 받은 국내외 항공업계가 조금이라도 수익성을 개선하기 위해 내놓은 이색 상품이다. 정부는 한시적으로 이 상품 이용객에게 면세 혜택을 주기로 했다. 아시아나항공은 바다를 건너 일본 규슈지방을 하늘에서 관람하는 ‘A380 당일치기 해외여행’ 무착륙 국제관광비행 상품을 출시했다고 8일 밝혔다. A380 항공기는 12일 오후 1시 인천국제공항을 출발해 대한해협을 건너 일본 상공과 제주 상공을 비행한 뒤 오후 4시20분 인천공항에 돌아올 계획이다. 국제관광비행 이용객은 기내, 입출국장, 시내 면세점을 이용할 수 있다. 다만 인천공항 입국장 내 면세점의 경우 현재 휴업 중이어서 이용하기 어렵다. 기내 면세품은 온라인에서 사전 예약해야 한다. 해외여행에 대한 소비자 니즈가 높아진 만큼 항공사들이 무착륙 국제관광비행을 선보였듯 식품 업계에서는 이런 수요를 반영해 해외에서 먹었던 음식을 재현하는데 노력을 기울이고 있다. 업계 관계자는 \"현지의 맛을 그대로 재현한 제품에 대한 소비자들의 니즈가 높아지고 있다“며 \"당분간 해외여행을 떠나는 것은 어렵겠지만 해외에서 느꼈던 맛은 국내에서도 충분히 경험할 수 있다\"고 말했다.』"}, {"type": "question", "num": "1", "text": "위 제시문은 2020년 12월 11일 국내 언론에 보도된 한국 최초의 무착륙 국제관광비행에 대한 기사를 윤색한 것이다. 아래 문장 1), 2) 중 본인이 공감하는 내용을 골라 그 번호를 쓰고 공감하는 이유 세 가지를 기술하시오. (띄어쓰기 및 마침표 포함 한 가지 이유당 원고지 100자 내외, 총 300자 이내로 쓸 것) (배점 30점) 문장 1) 나는 여행의 즐거움을 맛보기 위하여 무착륙 국제관광비행 항공권을 구입할 용의가 있다. 문장 2) 나는 무착륙 국제관광비행은 진정한 여행이 아니라고 생각하므로 무착륙 국제관광비행 항공권을 구입할 용의가 없다."}, {"type": "question", "num": "2", "text": "위 제시문의 내용에 대하여는 다양한 반응이 있을 수 있다. 그것은 여행의 정의와 여행에 대한 기대치가 개인, 문화, 시대에 따라 달라지기 때문이다. 이러한 다양성을 염두에 두고, “인간에게 여행이 필요한 세 가지 이유”라는 제목의 에세이를 기술하시오. (띄어쓰기 및 마침표 포함 원고지 600자 이상 700자 이내로 작성할 것) (배점 70점) 한국예술종합학교 입시홈페이지"}, {"type": "year_meta", "year": "2021", "rest": "예술사 과정 신입생 모집 영상원 영화과 일반전형 1차"}, {"type": "year_meta", "year": "2021", "rest": "예술사 과정 신입생 모집 영상원 영화과 2차시험"}, {"type": "instruction", "text": "다음 제시문은 영화 (1984년, 밀로스 포만 감독, 피터 셰퍼 원작, 각본)의 줄거리를 요약한 것이다. 제시문을 읽고, 주어진 조건들에 맞게 문제에 답하시오"}, {"type": "plain", "text": "『1823년 눈보라치는 밤, 한 노인이 자살을 시도하다 실패하여 수용소에 수감되어 찾아온 신부에게 자신의 죄를 고해한다. 그는 요제프 2세의 궁정 음악장인 살리에리. 가난한 시골 마을 출신이지만 아름다운 음악의 세계에 매료되어 각고의 노력으로 궁정 악사 자리까지 올랐던 그는 볼프강 아마데우스 모차르트를 알게 되면서 그의 천재성에 감탄한다. 살리에리가 형식을 준수하고 주제도 전통적인 교회 중심의 대세에 따르는 음악가였다면, 모차르트는 신들린 연주력과 타의 추종을 불허하는 편곡 능력, 시대의 감성을 뛰어넘는 작곡 실력까지 갖춘 천재적 음악가였다. 하루하루 신에게 감사를 드리고 불굴의 의지로 자신을 채찍질 하는 수도자 같은 삶을 살고 있는 살리에리에게, 모차르트란 존재는 경이롭고도 부러운 존재로 다가온다. 그런데 모차르트는 음악적 천재성에도 불구하고 일상생활은 방탕한 삶의 연속이었다. 버는 족족 결혼한 아내에게 선물 사주랴, 최신 유행에 맞추어 옷 사랴, 밤마다 화려한 파티를 벌이랴 모두 탕진해버렸다. 모차르트가 만들어내는 작품들은 세간의 관심을 끌고, 모차르트는 유명 오페라 배우들의 개인교사 및 사교계의 유명인사로 승승장구하며, 결국엔 살리에리가 궁정음악가로 있는 오스트리아 황제에게까지 소문이 들어간다. 음악을 너무도 사랑하지만 재능에 한계를 느낀 살리에리는 그러한 모차르트를 지켜보며, 그의 작품이 나올 때마다 경탄하면서도, 그러한 위대한 작품들이 모차르트란 인간에게서 나온 것을 저주한다. 마침내 살리에리는 모차르트에게 재능을 부여한 신마저 저주하기에 이른다. 한편 모차르트는 갑작스러운 아버지의 사망 소식에 생기를 잃고, 거기에 폐렴과 각종 합병증으로 병자의 신세가 된다. 이 사실을 알게 된 살리에리는 예전 가면파티에 아버지가 했던 것과 같은 분장으로 모차르트 앞에 나타나 장례식에 쓰일 레퀴엠(진혼곡)을 지어달라고 의뢰한다. 이 일로 모차르트는 자신을 조련하고 학대했지만, 동시에 그 누구보다도 자신을 사랑했던 아버지의 망령이 주변을 떠돌아다닌다는 심리적인 압박을 받는다. 결국 모차르트는 그로 인해 죽게 되고, 살리에리 역시 그에 따른 대가를 나름대로 받게 된다.』"}, {"type": "instruction", "text": "* 본인이 위 작품 를 번안, 각색하여 영상물 (영화, TV 드라마 등)을 만들려는 작가라고 가정하고, 다음 조건에 맞추어 답안을 기술하시오."}, {"type": "condition", "num": "1", "text": "시간은 현재, 공간은 대한민국에 실제로 존재하는 고등학교이다."}, {"type": "condition", "num": "2", "text": "원작의 살리에리에 해당하는 등장인물은 A, 모차르트에 해당하는 등장인물은 B로 표기한다."}, {"type": "condition", "num": "3", "text": "A와 B는 이 고등학교에서 처음 만난 사이이며, 서로 경쟁하는 관계이다. 한국예술종합학교 입시홈페이지"}, {"type": "year_meta", "year": "2021", "rest": "예술사 과정 신입생 모집 영상원 영화과 2차시험 이야기 구성"}], "source_url": "https://blog.naver.com/365films/222381286002", "source_date": "2021. 6. 2."}], "2020": [{"sections": [{"type": "year_meta", "year": "2020", "rest": "한국예술종합학교 예술사(대학)과정 영상원 영화과 기출문제"}, {"type": "plain", "text": "[ 영화과 실기 과외 ]"}, {"type": "year_meta", "year": "2020", "rest": "한국예술종합학교 예술사(대학)과정"}, {"type": "plain", "text": "영상원 영화과 기출문제 한예종 영상원 영화과는 일반전형, 특별 전형으로 나눠져 있으며 특별전형 8월 입시, 일반전형은 11월에 입시를 치르게 됩니다. 수시모집에서 쓸 수 있는 4년제 종합대학 6개와는 별도로 지원할 수 있으니 참고하시길 바랍니다. 올해는 자제 국어, 영어 시험이 없어져 1차 실기 80% 차지하고 있습니다. 한예종 영화과를 희망하는 친구들은 실기 준비 시작하셔야 합니다! 한국예술 종합학교 영화과 Q.A Q. 한예종 영화과는 수시, 정시 모집 중 언제 지원할 수 있나요? 한예종 입시는 수시와 정시를 구분하지 않습니다. 특수대학으로서 독자적으로 입시를 진행합니다. Q. 한예종은 일반 대학인가요? 일반대학이 아니라 특수대학으로 분리됩니다. 보통의 종합대학이 교육과학기술부 소속인 반면, 한국예술 종합학교는 문화체육관광부 산하의 대학이라 운영에 상당 부분 자율성이 보장되는 학교입니다. Q. 한국예술종합학교 영상원 영화과 학비는 어떻게 되나요? 한예종은 국립대로 타 종합대학 등록금 절반 수준에 이릅니다."}, {"type": "year_meta", "year": "2020", "rest": "기준 수업료 입학금, 수업료, 기성회비 등을 합하여 3백만 원 이내입니다."}, {"type": "plain", "text": "출처 한국예술 종합학교 공식 홈페이지 강원, 부산, 제주, 광주, 세종, 대전, 청주, 전주, 울산 등 전국에서 영화과 입시를 준비하기 위해 찾아오는 곳입니다. [ 영화과 실기 과외 ]"}, {"type": "year_meta", "year": "2020", "rest": "한국예술종합학교 예술사(대학)과정 영상원 영화과 특별전형 이야기 구성"}, {"type": "instruction", "text": "문제> 다음 주어진 조건들에 맞게 본인이 만들 장편극영화의 이야기를 구성하시오."}, {"type": "condition", "num": "1", "text": "이 영화의 주요 등장인물은 3명의 고등학생이며 이들은 친한 친구사이이다."}, {"type": "condition", "num": "2", "text": "이 영화는 3명의 주요 등장인물들이 함께 여행을 떠나는 장면으로 시작하여, 여행을 마치고 돌아오는 결말로 마무리 된다."}, {"type": "condition", "num": "3", "text": "이 영화 속에서 3명의 주요 등장인물들은 그들의 이후의 삶에 결정적인 영향을 미칠 커다란 사건을 겪에 된다. 한국예술 종합학교 입학처 한예종 영화과 특별전형 기출문제"}, {"type": "year_meta", "year": "2020", "rest": "한국예술종합학교 예술사(대학)과정 영상원 영화과 일반전형 1차 글쓰기"}, {"type": "question", "num": "1", "text": "주어진 조건들에 맞게 문제에 답하시오."}, {"type": "condition", "num": "1", "text": "1인칭 화자 '나'는 과거에 취미였던 일이 현재 직업이 된 인물입니다."}, {"type": "instruction", "text": "'나'의 시점에서 자서전적인 방식으로 답안을 기술하시오."}, {"type": "plain", "text": "('나'는 수험생 본인이 아니라 이야기에 등장하는 가공의 인물임) (인물의 이름은 반드시 A,B,C...로 표기할 것)"}, {"type": "condition", "num": "2", "text": "답안에는 다음 내용들이 반드시 들어 있어야 함. 가. '나'의 과거의 취미와 현재의 직업 (단, 영화 및 영상, 게임, 스포츠와 관련된 직업은 제외) 나. '내'가 취미를 직업으로 삼기로 결심하게 된 구체적인 계기 (사건, 인물 등)"}, {"type": "meta_info", "text": "다. 이후 해당 직업을 갖기까지 '나'의 편력 (핵심 경험 중심으로 시간 순으로 기술)"}, {"type": "plain", "text": "(원고지 800자 이상 1000자 이내로 작성 할 것. 띄어쓰기 및 마침표 포함.)"}, {"type": "question", "num": "2", "text": "'문제1'에서 '내'가 택한 현재의 직업은 다가올 미해 사회에서 인공지능 (A.I="}, {"type": "instruction", "text": "artificial intellience), 로봇, 무인화 등 테크놀로지의 발전에 따라 사라질 위험에 처할 수 도 있습니다. 그러한 위험에 대비하고 위기를 극복할 수 있는 방법이 무엇일지 수험생본인의 생각을 기술하시오."}, {"type": "plain", "text": "(원고지 400자 이상 600자 이내로 작성할 것. 띄어쓰기 및 마침표 포함) 한국예술 종합학교 입학처 한예종 영화과 일반전형 기출문제"}, {"type": "year_meta", "year": "2020", "rest": "한국예술종합학교 예술사(대학)과정 영상원 영화과 일반전형 2차 글쓰기 시험"}, {"type": "instruction", "text": "다음 제시문을 읽고 문제에 답하시오."}, {"type": "prompt", "text": "인(仁)은 자기 한 몸을 넘어 자신의 세계를 확장시키는데 작용하는 덕이다. 즉 타인에게로 퍼져가는 나의 관심과 사랑이다. 맹자는 측은지심(惻隱之心) 혹은 불인지심(不忍之心)이 인의 단서라고 말한다(공손추상6). 측은지심이라고 하거나 불인지심이라고 하거나 의미는 타인의 불행을 남의 일 같지 않게 느끼는 마음이다. 즉 동정심이다. 맹자는 인간과 인간 사이를 잇는 마음, 현대어로 표현하면 사랑이라고 할 그 마음이 바로 동정심이라고 생각했다. 동정심을 가지고 있으므로 나는 내 안에만 갇히지 않고 타인의 느낌을 공감하며, 그럼으로써 나를 보살피고 내 가족을 보살피듯이 타인을 보살핀다.\n맹자는 한편에서 어버이를 사랑하는 것이 인이라고 말한다. 또 맹자는 \"군자는 사물에 대해서는 아끼기는 하지만 인(仁)으로 대하지는 않고, 백성에 대해서는 인으로 대하지만 친애하지는 않는다.\"(진심상45)는 말도 한다. 이 구절은 부모에 대한 애정과 백성에 대한 애정, 그리고 그 밖의 동물이나 무생물에 대한 애정의 강도가 다르다는 뜻으로 해석된다. 부모에 대한 사랑을 능가할 것은 없다. 맹자는 어버이, 또는 혈육에 대한 사랑을 의미하는\n'친애[親]'를 사랑의 근본이자 출발점으로 삼은 것 같다.\n측은지심이 남의 불행을 느낄 수 있는 감정이므로, 그 함께 느낌의 능력은 공간적으로 가까운 곳에서 시작될 것이다. 즉 자신의 부모를 가장 사랑할 것이며 집안의 친척어른은 그보다는 덜 절실한 마음으로 사랑할 것이며 동네 어른은 그보다 더 엷은 마음으로 사랑할 것이다. 그런 식으로 그 사랑의 영역을 확대해 나가면 점점 사랑이 엷어지기는 하지만 이 세상에 사랑하지 않는 존재는 하나도 없게 된다. 그 관심과 사랑을 통해 나의 존재가 확대되는 것이라면 나의 존재는 이 세상 전체로 확대된다. 절실함의 차이는 있지만 이 세상 모든 존재의 아픔과 기쁨을 함께 느낀다. 그 과정을 맹자는 \"동정심을 느끼는 마음을 느끼지 않는 부분까지 이르도록 하는\" 과정이라고 표현했다.\n출전: [네이버 지식백과] 측은지심과 인 (맹자 『맹자』 (해제), 2004., 이혜경) (일부편집)"}, {"type": "instruction", "text": "문제> 아래 주어진 조건에 맞춰 <내가 측은지심을 느꼈던 순간>이라는 제목의 이야기를 구성하시오."}, {"type": "plain", "text": "<조건> 1. '나'를 주인공으로 한 일인칭 시점의 이야기를 담은 글로서, 논리와 사변에 치우친 글이 되지 않도록 할 것. 2. 본인의 직접 또는 간접 경험에 픽션을 적절히 배합하되, 누군가의 체험담이라는 느낌이 들도록 실남나게 쓸 것. 3. '내'가ㅏ 측은지심을 느낀 대상의 이름을 'A' 라 하고, '나'의 행동에 대하여 'A'가 어떤 감정적 또는 정서적 반응을 보였는지를 반드시 내용에 포함시킬 것. (원고지 1,200자 이상 1,500자 이내로 작성 할 것. 띄어쓰기 및 마침표 포함.) 한국예술종합학교 입학처 한예종 영화과 기출문제 글쓰기 * 자세한 내용은 아래 첨부화일을 꼭 확인하세요*"}], "source_url": "https://blog.naver.com/365films/222306040208", "source_date": "2021. 4. 11."}], "2019": [{"sections": [{"type": "plain", "text": "특별전형, 일반전형 모두 준비하였는데, 내가 지원할 전형 문제만 풀어보는 것이 아닌 모든 전형에 문제를 풀어보고 시험 준비를 할 것을 추천합니다!"}, {"type": "year_meta", "year": "2019", "rest": "한국예술종합학교 영상원 영화과 기출문제"}, {"type": "plain", "text": "*자세한 기출문제는 한예종 입학처 홈페이지에서 꼭 다시 한번 확인하시길 바랍니다.* 한예종 영화과 기출문제"}, {"type": "year_meta", "year": "2019", "rest": "예술사 과정 신입생 모집"}, {"type": "plain", "text": "영상원 영화과 특별전형 (외국어 성적 우수자 ) 1차 시험 이야기 구성"}, {"type": "instruction", "text": "다음 주어진 조건들에 맞게 문제에 답하시오."}, {"type": "condition", "num": "1", "text": "1인칭 화자 ‘나’는 현재 이 교실에서 영상원 영화과 입학시험을 보고 있는 수험생이다. (‘나’는 수험생 본인이 아니라 이야기에 등장하는 가공의 인물임.)"}, {"type": "condition", "num": "2", "text": "인물의 이름은 반드시 A, B로 표기할 것."}, {"type": "question", "num": "1", "text": "지금 이 교실 안에는 ‘내’가 마지막으로 만난 뒤 오랜 시간이 흘렀고, 영상원 영화과 입학시험을 보리라고는 전혀 예상하지 못했던 의외의 인물이 수험생으로 와 있다. 그 인물에 대한 ‘나’의 감정을 아래 가) 또는 나) 중 하나 선택하고 그 인물과 ‘나’의 관계를 기술하라. 단, ‘내’가 그 인물을 반가와 하거나 피하고 싶은 이유가 답안 내용에 구체적으로 드러나야 한다. (400자 이상 600자 이내로 작성할 것. 띄어쓰기 및 마침표 포함.) (40점) 가) 오랜만에 만나 반가운 사람 (가족, 친인척은 제외). 나) 다시 만나는 것을 피하고 싶었던 사람 (가족, 친인척은 제외)."}, {"type": "question", "num": "2", "text": "이 시험이 끝난 직후 ‘나’는 문제 1의 답안에서 언급한 인물과 짧은 대화를 나누게 된다. 대화가 이루어지는 공간을 간단히 서술하고, 대화의 시작부터 끝까지 내용 전체를 아래 예시의 형식에 맞추어 대사체로 기술하라. 대사는 실제의 대화처럼 실감나게 쓰되, 지문은 쓰지 말 것. (1200자 이상 1600자 이내로 작성할 것. 띄어쓰기, 마침표, 줄바꾸기 포함.) (60점) 예시 형식) ☞ 공간:영상원 2층복도 A : 너 혹시 B 아니니? B : 네, 저 B인데요. 누구시죠? 한국예술종합학교 영상원 영화과 입학처"}, {"type": "year_meta", "year": "2019", "rest": "예술사 과정 신입생 모집"}, {"type": "plain", "text": "영상원 영화과 특별전형 (외국어 성적 우수자 ) 1차 시험 한예종 영화과 특기자 전형 심층면접"}, {"type": "year_meta", "year": "2019", "rest": "예술사 과정 신입생 모집 영상원 영화과 1차"}, {"type": "instruction", "text": "다음 제시문을 읽고, 주어진 조건들에 맞게 문제에 답하시오."}, {"type": "prompt", "text": "인구통계학자들은 2050년 미국의 65세 이상 고령자 인구는 현재의 배인 약 7천5백만 명이 될 것이라고 말한다. 그렇게 노령화된 사회는 어떤 모습을 지니게 될까?\n활동적인 노인들은 비행기에서 낙하산을 메고 뛰어내리거나 외국어를 배우고 새로운 일을 시작하며 성형 수술한 얼굴과 몸으로 다시 데이트를 즐기게 될 것이다.\n노인 인구가 가족생활로부터 정치에 이르기까지 나라를 크게 바꾸어 놓을 것이라는 점에는 이론의 여지가 없다. 사람들이 더 오래 살더라도 매년 점점 더 많은 노인들이 스스로를 돌볼 수 있다는 것을 여러 연구 결과가 보여주고 있음은 좋은 뉴스다. 고혈압, 관절염과 같은 만성질환에 시달리는 사람의 비율은 꾸준히 감소해 왔다. 수명이 30년이나 늘어난 노인들은 무엇을 하면서 살 것인가가 큰 문제가 됐다.\n1) 예를 들어 은퇴의 개념이 바뀔지도 모른다. 많은 사람들이 60세쯤에 다시 학교에 나가고 직업을 바꾸며 새로운 인생을 시작하기를 원할 것이다. 그렇게 되면 기업들은 경험 많고 능력 있는 노인들을 끌어 들이기 위해 근무 형태를 더 융통성 있게 만들 수도 있을 것이다.\n2) 그렇다고 모든 사람이 일하기를 원하지는 않을 것이다. 따라서 레저 산업은 노인층에 더 초점을 맞추게 될 것이다. 부유층은 광범위한 여행 기회를 가질 것이다.\n3) 저술가 켄 디치트왈트는 은퇴자들이 골프 대신 즐길 수 있는 새로운 스포츠가 나타날 것이라고 확신한다. 예술과 문화는 나이 많은 관객들의 취향에 영합할 것이다.\n4) 가족형태와 생활 방식도 바뀔 것이다. 높은 이혼율과 늘어난 수명 때문에 더 많은 여성들이 독신으로 지낼 것이다. 65세 여성 수는 동년배의 남성 수보다 5 대 4의 비율로 늘 것이며 85세가 되면 5 대 2로 될 것이다.\n5) 결과적으로 더 많은 노인들이 독립해 살기를 원하는 상황에서는 빈곤, 우울증, 소외감이 한층 만연할 것이다. 전문가들은 더 많은 성인 자녀들이 외로움을 달래주기 위해 부모를 모시고 살게 될 것이라고 예상한다.\n6) 로맨스는 어떤가. 60년을 같은 배필과 함께 하기를 진정 원하는 사람이 있을까. 이혼은 이미 짝이 바뀌는 일부일처주의를 가져왔다. 수명 연장으로 나이든 과부와 홀아비가 동거 같은 형태를 취할 지도 모른다. 그렇다고 그들이 반드시 재혼하는 것도 아닐 것이다.\n7) 상품들도 인구구성 변화에 따라 달라질 것이다. 모니터 화면의 글자 크기는 커질 것이며 통신기기와 연결된 원격 조종 장치로 대문과 창문을 여는 가옥이 확산될 것이다."}, {"type": "question", "num": "1", "text": "위 제시문은 1997년 7월 2일자 뉴스위크 한국판에 실린 2050년의 미래 사회에 대한 기사를 윤색한 것이다. 위 단락 1)-7) 중 본인이 가장 공감하는 내용을 하나 골라 그 번호를 쓰고 공감하는 이유를 논리적으로 기술하시오. (띄어쓰기 포함 원고지 800자 이상 1,000자 이내로 쓸 것) (배점 70점)"}, {"type": "question", "num": "2", "text": "본인이 65세가 되었을 때 자신의 삶은 어떤 모습을 지니게 될까? 위 제시문의 내용에 상상력을 더하여 간략하게 기술하시오. (띄어쓰기 포함 원고지 400자 이상 600자 이내로 쓸 것) (배점 30점) 한국예술종합학교 영상원 영화과 입학처"}, {"type": "year_meta", "year": "2019", "rest": "예술사 과정 신입생 모집 영상원 영화과 1차"}, {"type": "year_meta", "year": "2019", "rest": "예술사 과정 신입생 모집 영상원 영화과 2차"}, {"type": "instruction", "text": "주어진 조건들에 맞게 문제에 답하시오."}, {"type": "question", "num": "1", "text": "‘질투’라는 단어가 들어가는 제목의 글을 주어진 조건에 맞춰 쓰시오. (띄어쓰기 포함 원고지 800자 이상 1,000자 이내로 작성해야 함.) (75점)"}, {"type": "condition", "num": "1", "text": "답안의 서두에 반드시 본인이 정한 제목을 쓰되, 제목의 글자 수는 단어 ‘질투’를 포함하여 20자 이하여야 함."}, {"type": "condition", "num": "2", "text": "‘나’를 주인공으로 한 일인칭 시점의 이야기를 담은 산문 형식의 글로서, 확실한 결말을 가진 완결된 이야기여야 함. (‘나’는 수험생 본인이 아니라 이야기에 등장하는 가공의 인물임.)"}, {"type": "condition", "num": "3", "text": "답안에 쓴 이야기의 주제는 다음 두 단어 중 하나이어야 함. 주제어: 용기, 절제"}, {"type": "condition", "num": "4", "text": "인물의 이름은 반드시 A, B, C... 등 알파벳으로 표기할 것."}, {"type": "question", "num": "2", "text": "문제 1>의 조건 3)에서 어떠한 단어를 선택했는지 쓰고, 왜 그 단어가 문제 1>의 답안에 쓴 이야기의 주제인지 본인의 생각을 서술하시오. (띄어쓰기 포함 원고지 400자 이상 600자 이내로 작성해야 함.) ( 25점) 한국예술종합학교 영상원 영화과 입학처"}, {"type": "year_meta", "year": "2019", "rest": "예술사 과정 신입생 모집 영상원 영화과 2차"}], "source_url": "https://blog.naver.com/365films/222320536688", "source_date": "2021. 4. 23."}], "2017": [{"sections": [{"type": "year_meta", "year": "2017", "rest": "한국예술종합학교 예술사 과정 신입생 모집 영상원 영화과 기출문제를 준비했습니다."}, {"type": "year_meta", "year": "2022", "rest": "한예종 영화과는 자체 국어 영어 시험이 사라지고"}, {"type": "plain", "text": "1차 실기 80%를 차지하고 있습니다. 그만큼 실기가 중요한 만큼 기출문제를 중심으로 철저한 실기 준비를 한다면 충분히 승산이 있습니다. 지금부터 해도 늦지 않았습니다! 한예종 영화과 실기 준비 문의"}, {"type": "year_meta", "year": "2021", "rest": "한예종 영상원 영화과 합격증"}, {"type": "plain", "text": "한국예술 종합학교 영상원 영화과 Q.A Q. 한예종 영화과는 수시, 정시 모집 중 언제 지원할 수 있나요? ​-한예종 입시는 수시와 정시를 구분하지 않습니다. 특수대학으로서 독자적으로 입시를 진행합니다. Q. 한예종은 일반 대학인가요? -일반대학이 아니라 특수대학으로 분리됩니다. 보통의 종합대학이 교육과학기술부 소속인 반면, 한국예술 종합학교는 문화체육관광부 산하의 대학이라 운영에 상당 부분 자율성이 보장되는 학교입니다. Q. 한국예술종합학교 영상원 영화과 학비는 어떻게 되나요? -한예종은 국립대로 타 종합대학 등록금 절반 수준에 이릅니다. 2020학년도 기준 수업료 입학금, 수업료, 기성회비 등을 합하여 3백만 원 이내입니다. 출처 한국예술 종합학교 공식 홈페이지 오로지 영화과 영화영상학과 입시만 진행합니다. [ 한예종 영화과 과외 ] 한국예술종합학교 2017 한예종 영상원 영화과 1차 글쓰기"}, {"type": "year_meta", "year": "2017", "rest": "예술사 과정 신입생 모집 영상원 영화과 일반전형/정원 외 전형 1차 시험"}, {"type": "bullet", "text": "주어진 사진에 대한 제시문을 읽고 문제에 답하시오."}, {"type": "plain", "text": "한예종 영화과 1차 글쓰기 기출문제"}, {"type": "prompt", "text": "역사의 전환점을 정확하게 지정하는 것은 쉬운 일이 아니다. 그러나 인간이 우리가 살고 있는 세계의 아름다움, 연약함, 그리고 ( )을/를 진정 처음으로 포착한 바로 그 순간을 우리는 알 고 있다. 1968년 12월 24일, 아폴로 8호가 달 궤도를 선회할 최초의 유인 우주선으로서 케이프 캐너베럴에서 발사된지 75시간 48분 39초 후가 바로 그 순간이다.\n10회 달 궤도 선회 중 네 번째를 막 시작했을 때, 우주선이 어두운 달그림자로부터 벗어나자 우주선 창 너머로 푸르고 흰 행성이 모습을 드러냈다.\n“세상에! 저것 좀 봐! 지구가 떠오르고 있어!” 빌 앤더스 우주비행사가 외쳤다.\n그는 재빨리 사진을 찍었다. 카메라에는 흑백 필름이 들어 있었다. 동료 우주비행사 짐 러벨이 컬러 필름을 가져왔다.\n“이런, 놓쳐버렸어.” 앤더스가 말했다. 러벨이 다른 창문 너머를 살피다가 외쳤다. “저기 있네!” 앤더스가 무중력 상태에서 러벨이 떠 있는 곳으로 다가가 카메라의 셔터를 눌렀다.\n“찍었나?” 러벨이 물었고 앤더스가 대답했다. “그럼!”\n이 사진은 인류가 지구 바깥에서 지구를 찍은 최초의 컬러 이미지가 되었다.\n- <타임>지, 2016년 11월 28일-12월 5일 이슈 중 발췌, 일부 윤색 -"}, {"type": "question", "num": "1", "text": "위 사진은 최근 미국의 시사주간지 타임(Time)이 출간한 <역사상 가장 큰 영향력을 가진 100장의 사진 (100 Photographs: The Most Influential Images of All Time)>에 수록되었다. 위 사진이 어떤 분야에 어떠한 영향을 끼쳤을지 본인의 생각을 기술하시오. (띄어쓰기 및 마침표 포함 800자 이상 1,000자 이내로 작성할 것.) <50점>"}, {"type": "question", "num": "2", "text": "위 제시문의 밑줄 친 부분의 괄호에 들어갈 수 있는 단어를 정하고, 그 단어를 고른 이유 를 본인의 직접 또는 간접 경험을 예로 들어 기술하시오. (띄어쓰기 및 마침표 포함 800자 이상 1,000자 이내로 작성할 것.) <50점>"}, {"type": "year_meta", "year": "2017", "rest": "예술사 과정 신입생 모집 영상원 영화과 일반전형/정원 외 전형 1차 시험"}, {"type": "plain", "text": "한예종 영화과 2017 한예종 영상원 영화과 2차 글쓰기"}, {"type": "year_meta", "year": "2017", "rest": "예술사 과정 신입생 모집 영상원 영화과 일반전형 2차"}, {"type": "instruction", "text": "다음 주어진 조건들에 맞게 문제에 답하시오."}, {"type": "plain", "text": "<조건 1> 2015년 어느 날, 대한민국 국민 A, B, C, 세 사람은 국내 어디론가 함께 여행을 떠났다. 그리고 다음날 그들 중 A, B, 두 사람만이 출발지로 돌아왔다. <조건 2> 2016년, 여행을 떠났던 날로부터 약 1년이 지난 어느 날, A는 지난해 함께 돌아오지 않았던 C로 부터 편지 한 통을 받는다. <문제 1> 3 명의 인물 A, B, C를 각각 소개하시오. 인물 사이의 관계가 구체적으로 명확히 드러 나야 함. (인물의 이름은 반드시 A, B, C로 표기할 것) (각인물당 200자이상250자이내, 전체600자이상750자이내로작성할것. 띄어쓰기 및 마침표 포함) [배점 40점]"}, {"type": "instruction", "text": "<문제2> C가 A에게 보낸 편지의 내용을 작성하시오. 내용 속에는 1년 전 여행의 출발지, 도착 지, 여행지에서 있었던 일, C가 돌아오지 않았던 이유, 1년 동안 C에게 어떤 일이 있었는지에 대한 기술이 반드시 포함되어야 함. (편지는 우편 또는 인편으로 A에게 전해진 것으로 설정함. 이메일, SNS는 편지로 인정하지 않음.)"}, {"type": "plain", "text": "(1000자 이상 1500자 이내로 작성할 것. 띄어쓰기 및 마침표 포함.) [배점 60점]"}], "source_url": "https://blog.naver.com/365films/222332825587", "source_date": "2021. 5. 2."}]}, "total_blocks": 11, "sparse": false, "sources": [{"url": "https://blog.naver.com/365films/224255700696", "title": "[영화과 학원 실기 과외 ] 2026학년도 한국예술종합학교 영상원 영화과 기출문제 일반전형 / 특기자전형 글쓰기, 이야기구성", "date": "2026. 4. 17."}, {"url": "https://blog.naver.com/365films/223839630503", "title": "2025학년도 한국예술 종합학교 영상원 영화과 기출문제 / 일반전형 외국어성적우수자/ 영상예술특기자", "date": "2025. 4. 19."}, {"url": "https://blog.naver.com/365films/223432153426", "title": "2024학년도 한국예술종합학교 영상원 영화과 기출문제 _ 일반전형, 특별전형(외국어성적우수자) &lt;영상예술특기자&gt;_ 한예종 영화과 실기 과외 학원 이야기 구성, 논술", "date": "2024. 4. 30."}, {"url": "https://blog.naver.com/365films/223106249371", "title": "[ 한예종 영화과 실기 과외 ] 2023학년도 한국예술종합학교 영상원 영화과 언어특기자, 영상특기자, 일반전형 기출문제", "date": "2023. 5. 19."}, {"url": "https://blog.naver.com/365films/222743527189", "title": "한국예술종합학교 영상원 영화과 2022학년도 기출문제 1차 글쓰기, 2차 이야기구성", "date": "2022. 5. 23."}, {"url": "https://blog.naver.com/365films/222381286002", "title": "[ 영화과 과외 ] 한국예술종합학교 영상원 영화과 기출문제 2021학년도 / 특기자 전형, 일반전형", "date": "2021. 6. 2."}], "meta": {"category": "major", "admission": "예술사 신입생 (수시·정시 구분 없음, 수시 6장에 포함되지 않음)", "recruit": "일반전형 30명 / 특기자 외국어 9명·영상 6명", "ratio": "1차 글쓰기 80% + 학생부 20% / 2차 이야기구성·면접", "stages": [{"name": "8월 특기자 전형", "detail": "프로필 + 이야기구성 + 면접 (외국어성적우수자 / 영상예술특기자)"}, {"name": "11월 일반 전형", "detail": "1차 글쓰기 → 2차 이야기구성 + 구술면접"}], "duration": "1차 글쓰기 일반 약 100~120분", "tip": "국문 + 영문 지문 출제 가능 (2023~). 사회·예술 비평적 사고 필요"}}, "dankook": {"name": "단국대", "full_name": "단국대학교 공연영화학부 영화전공", "exam_type": "이야기구성 + 구술면접", "years": ["2025", "2024", "2023", "2022", "2021", "2020", "2019", "2018"], "blocks_by_year": {"2025": [{"sections": [{"type": "year_meta", "year": "2025", "rest": "영화과 영화영상학과 실기 준비해서 가는 법"}, {"type": "plain", "text": "영화 연출 실기 학원 과외 추천 이야기 구성 면접 [실기 과외 학원 영화과]  단국대학교 <영화전공(이론‧연출‧스텝)> 실기고사 기출문제 _ 이야기 구성, 구술면접 실기 위주 A. 네, 그럼요. 처음부터 잘 하는 친구는 없습니다. 선생님의 이론 수업과 기출문제를 통한 실전 훈련을 겸비한다면 누구나 다 이야기 구성을 할 수 있습니다. 자신이 부족하다는 것을 인지하고 있다면 그에 상응하는 노력과 집념이 필요하다는 걸 잊지 마세요! 단국대학교 <영화전공(이론‧연출‧스탭)> 실기고사 항목 1차 이야기 구성 (80%%)"}, {"type": "bullet", "text": "지문에 제시된 시간과 공간의 범주 안에서 주어진 키워드를 이야기의 핵심소재로 활용하여 이후의 상황을 완성(분량 : 원고지 1,600자 내외) / 3시간"}, {"type": "plain", "text": "2차 구술면접 영화과 실기 준비하는 법 이야기 구성 실기 과외 학원 단국대학교 <영화전공(이론‧연출‧스탭)> 실기고사 기출문제 기출문제1."}, {"type": "bullet", "text": "이야기 구성"}, {"type": "instruction", "text": "[문 제] 아래 제시된 상황(시간, 공간, 인물 등)과 세 개의 키워드를 활용하여 이후의 상황을 이야기로 완성하시오. • 원고지 1,600자 내외로 작성하고, 사용된 키워드에 밑줄을 그세요. (예 :‘안경’이 키워드일 경우, 안경) ※ 표절 등 기타 부정행위가 적발될 경우 합격 또는 입학하였더라도 추후 합격 및 입학취소 처리함"}, {"type": "plain", "text": "<제시문> 우체국은 문이 굳게 닫혀 있었다. 개천을 따라 한 20분쯤 걸어 나가면 시내로 들어가는 버스 정류장이 있었고, 거기에 우체통이 있었다. 우체통은 외로워 보였다. 우체통은 견고해 보였다. 견고한 외로움, 그것이 형태를 지닌다면 아마도 우체통일 것이다. 나는, 편지가 우체통의 밑바닥에 떨어지며 울릴 무심한 소리에 미리 긴장하며, 조심스럽게, 아주 천천히, 그것을 통 속으로 밀어 넣었다. 그리고 재빨리 돌아섰다."}, {"type": "keywords", "items": ["사진", "우체부", "두근거림"]}, {"type": "bullet", "text": "이야기 구성"}, {"type": "instruction", "text": "아래 제시된 상황(시간, 공간, 인물 등)과 세 개의 키워드를 활용하여 이후의 상황을 이야기로 완성하시오."}, {"type": "bullet", "text": "원고지 1,800자 내외로 작성하고, 사용된 키워드에 밑줄을 그세요."}, {"type": "plain", "text": "(예 :‘안경’이 키워드일 경우, 안경)"}, {"type": "bullet", "text": "표절 등 기타 부정행위가 적발될 경우 합격 또는 입학하였더라도 추후 합격 및 입학취소 처리함"}, {"type": "prompt", "text": "그는 학교를 나왔다. 찻길을 건너, 그는 이유 없이 두리번거리다가, 몸을 피하는 도망자 처럼 교문 맞은편 골목 속으로 접어들었다. 골목 안 왼쪽 이층 건물에 붙어 있는 <Cafe 地下室>이라는 조그만 아크릴 간판이 눈에 띄었다. 그는 지하실로 내려갔다.\n“어서오세요.” 젊은 주인이었다. “나요, 형!”\n“어, 너니?” “조용하네, 시험 때라 그런가?”\n그러나 젊은 주인은 다른 대답을 했다.\n“마침 잘 왔다. 누가 널 찾아왔어.”\n“날 찾아와?”\n“저쪽 테이블로 가 봐.”"}, {"type": "keywords", "items": ["운동화", "어머니", "소나기"]}, {"type": "plain", "text": "영화 연출 실기 이야기구성 면접 과외 학원"}], "source_url": "https://blog.naver.com/365films/223389115575", "source_date": "2024. 3. 20."}, {"sections": [{"type": "year_meta", "year": "2025", "rest": "단국대학교 영화전공 이론 연출 스텝 수시모집 요강 요약"}, {"type": "plain", "text": "수시 1차 실기 80% 12명 모집 실기고사 이야기 구성, 면접고사 단국대 영화전공 기출문제 실기고사문제 <영화전공(이론‧연출‧스탭)>"}, {"type": "bullet", "text": "이야기구성"}, {"type": "instruction", "text": "[문 제] 아래 제시된 상황(시간, 공간, 인물 등)과 세 개의 키워드를 활용하여 이후의 상황을 이야기로 완성하시오."}, {"type": "bullet", "text": "원고지 1,600자 내외로 작성하고, 사용된 키워드에 밑줄을 그세요. (예 :‘안경’이 키워드일 경우, 안경)"}, {"type": "bullet", "text": "표절 등 기타 부정행위가 적발될 경우 합격 또는 입학하였더라도 추후 합격 및 입학취소 처리함"}, {"type": "prompt", "text": "그는 다시 한번 바닥을 샅샅이 훑어보았지만 총은 보이지 않았다. 혹시 여자의 몸 아래 깔려 있을지도 모른다! 아니면 카펫 아래! 여자를 움직여야 한다! 그 생각만으로 몸이 떨렸다. 갑자기 여자가 크게 신음 소리를 내더니 오른팔을 움찔거렸다. 그는 깜짝 놀라 허둥대다가 넘어졌다. 그는 얼른 기어서 여자로부터 멀어졌다. 여자는 죽지 않는 것이 분명했고, 조금 있 으면 다시 깨어날 것 같았다. 그는 이곳에서 당장 나가야 했다! 지금 총 같은 것에 신경 쓸 때가 아니었다. 어차피 이곳에서는 총을 쏠 일도 없을 것이다. 무엇보다 그가 휴대폰을 차지 했다는 것이 중요했다. 그 순간 무슨 소리가 들렸다. 현관문이 열렸다가 닫히는 소리였다. 누 군가 긴 복도를 따라 걸어오고 있었다."}, {"type": "keywords", "items": ["총", "여자", "휴대폰"]}], "source_url": "https://blog.naver.com/365films/223432208708", "source_date": "2024. 4. 30."}], "2024": [{"sections": [{"type": "year_meta", "year": "2024", "rest": "단국대학교 편입학 모집 실기고사 문제 <영화전공(이론·연출·스탭)> _ 이야기구성, 기출문제"}, {"type": "plain", "text": "[ 영화과 편입 실기 준비 학원 과외 ]"}, {"type": "year_meta", "year": "2024", "rest": "단국대학교 <영화전공(이론·연출·스탭)> 편입학 모집 실기고사 기출문제를 준비했습니다."}, {"type": "plain", "text": "영화과 영화영상학과 편입 같은 경우는 어떤 학교가 어떻게 뽑을지 모르기에 모집했던 학교들을 중심으로 전체적으로 다 준비한 후 요강이 발표되면 지원하는 형식으로 지원해야 합니다. 요강이 발표 나고 실기 준비를 하면 늦습니다. 영화과 영상학과 편입 실기 학원 과외 [ 영화과 편입실기 준비 학원 과외 ]"}, {"type": "year_meta", "year": "2024", "rest": "단국대학교 편입학 모집 실기고사 문제 <영화전공(이론·연출·스탭)> _ 이야기 구성"}, {"type": "plain", "text": "A. 네, 상관없습니다. 실기 전형은 100% 실기만으로 인원을 선발하기에 실기 준비를 철저하게 한다면 비전공자여도 영화과 영화영상학과에 합격할 수 있습니다. 영화과 영화영상학과 편입 가능합니다. 영화과 영화영상학과 편입 준비 학원 과외 추천"}, {"type": "year_meta", "year": "2024", "rest": "편입학 모집 공연영화학부 실기고사 문제"}, {"type": "plain", "text": "<영화전공(이론·연출·스태프)>"}, {"type": "bullet", "text": "이야기구성"}, {"type": "plain", "text": "출 제 문 제 [문제 출처] 아래 제시된 상황(시간, 공간, 인물 등)과 세 개의 키워드를 활용하여 이후의 상황을 이야기로"}, {"type": "instruction", "text": "완성하시오."}, {"type": "bullet", "text": "원고지 1,600자 내외로 작성하고, 사용된 키워드에 밑줄을 그세요."}, {"type": "plain", "text": "(예 :‘안경’이 키워드일 경우, 안경)"}, {"type": "bullet", "text": "표절 등 기타 부정행위가 적발될 경우 합격 또는 입학하였더라도 추후 합격 및 입학취소 처리함"}, {"type": "prompt", "text": "평범한 백반집. 몇몇 사람들이 홀로 밥을 먹고 있다. 그 사이에서 밥을 다 먹은\n연수는 자리에서 일어나 계산대로 걸어가며 주머니를 뒤적거린다. 이내 당황한\n기색으로 가방을 이리저리 뒤져보더니 아예 계산대 옆에 쪼그려 앉아 바닥에 내\n용물들을 흩뜨려 놓는다. 가방 안에 소지품은 몇 없다. 그중 눈에 띄는 신분증.\n한숨을 푹 쉬며 떨어져 있는 신분증을 주워들고 일어선다."}, {"type": "keywords", "items": ["학교 동창", "신용카드", "빨래방"]}, {"type": "plain", "text": "단국대 영화전공 편입 실기 기출문제 * 아래 파일을 꼭 다시 한번 확인하세요*"}], "source_url": "https://blog.naver.com/365films/223436202632", "source_date": "2024. 5. 4."}, {"sections": [{"type": "year_meta", "year": "2024", "rest": "수시 신입생 모집 단국대학교 실기고사 문제 공연영화학부 <영화전공(이론‧연출‧스탭)> _ 실기 위주 영화과, 이야기 구성"}, {"type": "plain", "text": "[영화과 실기 학원 과외 ]"}, {"type": "year_meta", "year": "2024", "rest": "수시모집 단국대학교 영화전공 (이론, 연출, 스태프) 기출문제를 준비했습니다."}, {"type": "plain", "text": "단국대학교 영화과는 수시모집에서 실기 위주 인원을 선발하며, 정시모집에선 수능 위주로 선발합니다. 수시모집 실기 80% 높은 비중을 차지하고 있으며, 오랜 전통과 역사를 가진 학교로 매해 높은 경쟁률을 자랑하고 있습니다."}], "source_url": "https://blog.naver.com/365films/223432208708", "source_date": "2024. 4. 30."}, {"sections": [{"type": "year_meta", "year": "2024", "rest": "입시에서 수시모집에서 실기80% 높은 비율을 차지하고 있고, 정시 모집에선 수능위주로 인원을 선발합니다."}, {"type": "plain", "text": "단국대 영화과를 희망하는 친구들은 기출문제를 참고하시어 실기준비를 잘 하시길 바랍니다~!!"}], "source_url": "https://blog.naver.com/365films/223069419587", "source_date": "2023. 4. 9."}], "2023": [{"sections": [{"type": "plain", "text": "2023학년 수시모집에서 실기 위주 학생으로 10명을 선발합니다. 단국대 영화전공을 희망하는 친구들을 아래 기출문제를 참고하여 실기 준비에 박차를 가하시길! 영화과 실기 준비 및 진학상담 영화과 기출문제 - 단국대학교"}, {"type": "year_meta", "year": "2023", "rest": "단국대학교 공연영화학부 영화(이론‧연출‧스탭) 기본계획안"}, {"type": "plain", "text": "단국대학교 2022학년도 수시 신입생 모집 공연영화학부 실기고사 문제 <영화(이론‧연출‧스탭)>  이야기구성 [문 제]"}, {"type": "instruction", "text": "아래 제시된 상황(시간, 공간, 인물 등)과 세 개의 키워드를 활용하여 이후의 상황을 이야기로 완성하시오."}, {"type": "bullet", "text": "원고지 1,800자 내외로 작성하고, 사용된 키워드에 밑줄을 그세요."}, {"type": "plain", "text": "(예 :‘안경’이 키워드일 경우, 안경)"}, {"type": "bullet", "text": "표절 등 기타 부정행위가 적발될 경우 합격 또는 입학하였더라도 추후 합격 및 입학취소 처리함"}, {"type": "prompt", "text": "그는 학교를 나왔다. 찻길을 건너, 그는 이유 없이 두리번거리다가, 몸을 피하는 도망자 처럼 교문 맞은편 골목 속으로 접어들었다. 골목 안 왼쪽 이층 건물에 붙어 있는 <Cafe 地下室>이라는 조그만 아크릴 간판이 눈에 띄었다. 그는 지하실로 내려갔다.\n“어서오세요.” 젊은 주인이었다. “나요, 형!”\n“어, 너니?” “조용하네, 시험 때라 그런가?”\n그러나 젊은 주인은 다른 대답을 했다.\n“마침 잘 왔다. 누가 널 찾아왔어.”\n“날 찾아와?”\n“저쪽 테이블로 가 봐.”"}, {"type": "keywords", "items": ["운동화", "어머니", "소나기"]}, {"type": "plain", "text": "*아래 파일을 꼭 다시 한번 확인하세요"}], "source_url": "https://blog.naver.com/365films/222675300423", "source_date": "2022. 3. 17."}, {"sections": [{"type": "year_meta", "year": "2023", "rest": "단국대학교 <영화전공(이론‧연출‧스탭)> 실기고사 기출문제 이야기구성"}, {"type": "year_meta", "year": "2023", "rest": "단국대학교"}, {"type": "plain", "text": "<영화전공(이론‧연출‧스탭)> 실기고사 기출문제​"}, {"type": "bullet", "text": "이야기구성"}, {"type": "instruction", "text": "[문 제] 아래 제시된 상황(시간, 공간, 인물 등)과 세 개의 키워드를 활용하여 이후의 상황을 이야기로 완성하시오. • 원고지 1,600자 내외로 작성하고, 사용된 키워드에 밑줄을 그세요. (예 :‘안경’이 키워드일 경우, 안경) ※ 표절 등 기타 부정행위가 적발될 경우 합격 또는 입학하였더라도 추후 합격 및 입학취소 처리함"}, {"type": "plain", "text": "<제시문> 우체국은 문이 굳게 닫혀 있었다. 개천을 따라 한 20분쯤 걸어 나가면 시내로 들어가는 버스 정류장이 있었고, 거기에 우체통이 있었다. 우체통은 외로워 보였다. 우체통은 견고해 보였다. 견고한 외로움, 그것이 형태를 지닌다면 아마도 우체통일 것이다. 나는, 편지가 우체통의 밑바닥에 떨어지며 울릴 무심한 소리에 미리 긴장하며, 조심스럽게, 아주 천천히, 그것을 통 속으로 밀어 넣었다. 그리고 재빨리 돌아섰다."}, {"type": "keywords", "items": ["사진", "우체부", "두근거림"]}], "source_url": "https://blog.naver.com/365films/223069419587", "source_date": "2023. 4. 9."}], "2022": [{"sections": [{"type": "year_meta", "year": "2022", "rest": "단국대학교 공연영화학부 영화(이론∙연출∙스텝) 수시모집 요강"}, {"type": "plain", "text": "1차 (3배수) 학생부 30% + 실기 70% 2차 1단계 성적 70 + 면접 30 영화 (이론ㆍ연출ㆍ스텝) 이야기 구성 100%"}, {"type": "bullet", "text": "지문에 제시된 시간과 공간의 범주 안에서 주어진 키워드를 이야기의 핵심소재로 활용하여 이후의 상황을 완성(분량 : 원고지 1,800자 내외) 3시간"}, {"type": "plain", "text": "단국대학교 입학처 <2022학년도 단국대학교 공연영화학부 영화전공 기본 계획안> 수업 문의 및 진학상담 단국대 영화과 실기 과외 [ 영화과 과외 ]"}], "source_url": "https://blog.naver.com/365films/222306005731", "source_date": "2021. 4. 11."}], "2021": [{"sections": [{"type": "year_meta", "year": "2021", "rest": "단국대학교 영화 (이론 연출 스태프) 전공 실기고사 기출문제를 준비했습니다."}, {"type": "plain", "text": "단국대학교 영화전공은 수시모집에서만 실기전형으로 인원을 선발하고 정시모집에선 100% 성적으로 인원을 선발합니다."}, {"type": "meta_info", "text": "단국대 영화과는 수시모집 1차 실기 비중 70% 높은 비중을 차지하고 있습니다."}, {"type": "plain", "text": "주 실기 내용은 아래 기출문제와 같이 당일 제시문과 단어를 사용하여 이야기 구성하기입니다. 단국대학교 영화전공 진로"}, {"type": "year_meta", "year": "2021", "rest": "단국대학교 영화 (이론 연출 스태프) 전공 실기고사 기출문제"}, {"type": "plain", "text": "단국대학교 2021학년도 수시 신입생 모집 공연영화학부 <영화(이론, 연출, 스텝)> 실기고사 문제"}, {"type": "bullet", "text": "이야기 구성"}, {"type": "instruction", "text": "[문 제] 아래 제시된 상황(시간, 공간, 인물 등)과 세 개의 키워드를 활용하여 이후의 상황을 이야기로 완성하시오. • 원고지 2,000자 내외로 작성하고, 사용된 키워드에 밑줄을 그러세요. (예 :‘안경’이 키워드일 경우, 안경) ※ 표절 등 기타 부정행위가 적발될 경우 합격 또는 입학하였더라도 추후 합격 및 입학 취소 처리함"}, {"type": "prompt", "text": "오후 3시다. 이 시간은 무엇을 하려고 해도 항상 너무 늦거나 너무 이른 시간이다. 문 옆 식탁에 앉아 밥을 먹고 있는 남자를 이제야 알아보았다. 출장을 다니는지 매번 커다란 캐리 어 가방을 탁자 옆에 조심스레 놓아두고 있다. 그는 가끔 나에게 미소를 띤 시선을 돌린다. 하지만 나를 바라보는 것이 아니다. 윤곽이 고상하고 흰머리를 한 부인이 그에게 다가가, “걱정거리는 잘 해결됐나요?” 라 고 물었다. “무슨 걱정 말씀입니까?” 당황한 듯이 그가 물었다. “여러분, 실례합니다”라고, 윤곽이 고상하고 흰머리를 한 부인이 호텔 식당의 손님들을 돌아다보며 점잖게 말했다."}, {"type": "keywords", "items": ["캐리어", "유리잔", "안경"]}], "source_url": "https://blog.naver.com/365films/222306005731", "source_date": "2021. 4. 11."}], "2020": [{"sections": [{"type": "year_meta", "year": "2020", "rest": "단국대학교 영화과 수시모집 기출문제를 준비했습니다."}, {"type": "plain", "text": "단국대 영화과는 수시모집에서만 실기를 치르며, 정시모집에선 수능100% 인원을 선발합니다. 단국대 영화과 수시모집 실기준비를 원하는 친구들은 서둘러 준비하시길 바랍니다. 단국대 영화과 전형방법 1단계 실기 100% 3배수 2단계 1단계 70% +면접 30%"}, {"type": "year_meta", "year": "2020", "rest": "단국대학교 영화과 수시모집 실기고사 문제_영화(이론·연출·스탭) 기출문제"}, {"type": "plain", "text": "[문 제] 아래 제시문을 통해 제공된 상황(시간과 공간) 내에서 세 개의 키워드를 활용하여"}, {"type": "instruction", "text": "이후의 상황을 이야기로 완성하시오"}, {"type": "bullet", "text": "원고지 2,000자 내외로 작성하고, 사용된 키워드에 밑줄을 그세요."}, {"type": "plain", "text": "(예 : ‘안경’이 키워드일 경우, 안경)"}, {"type": "bullet", "text": "표절 등 기타 부정행위가 적발될 경우 합격 또는 입학하였더라도 추후 합격 및 입학을 취소함"}, {"type": "plain", "text": "2020 단국대 영화과 수시모집 기출문제"}, {"type": "prompt", "text": "전날까지도 푸근하던 날씨가 이사 당일이 되자 기온이 뚝 떨어지고 눈까지 내리기 시작했다.\n처음으로 하는 포장이사였다. 이번 이사만큼은 사모님 소리를 들으며 손 하나 까딱하지 않기로\n작정을 했다. 날씨 때문에 수정이 힘들 건 없었다. 오히려 궂은 날씨는 수정에게 환한 미래에\n대한 보증 같았다.\n날씨 때문에 고된 건 이삿짐센터 사람들이었다. 남자 세 명과 여자 한 명으로 이뤄진 팀이"}, {"type": "meta_info", "text": "었다. 약속 시간보다 삼십 분이나 이른 일곱 시 반에 들이닥친 그들은 기계적으로 짐을 싸고,"}, {"type": "plain", "text": "트럭에 싣고, 새 아파트에 부렸다. 점심도 그들이 알아서 먹었고, 쓸데없는 소리 하나 내뱉지 않았으며, 쓰레기까지 자기네들이 알아서 말끔하게 처리했다."}, {"type": "keywords", "items": ["이사", "이삿짐", "이삿짐센터 사람"]}, {"type": "plain", "text": "자세한 내용은 아래 첨부화일을 확인하세요!"}], "source_url": "https://blog.naver.com/365films/221915768890", "source_date": "2020. 4. 18."}], "2019": [{"sections": [{"type": "year_meta", "year": "2019", "rest": "#단국대영화과편입 실기고사 기출문제 입니다."}, {"type": "plain", "text": "이야기구성이 주 실기내용이며, 참고하여 2020학년도에도 좋은 결과 있길 바랍니다! 단국대 영화과 편입 및 영화과 편입수업 문의는 언제나 환영!!"}, {"type": "year_meta", "year": "2019", "rest": "단국대학교 편입생 모집 공연영화학부 실기고사문제 <영화(이론‧연출‧스탭)>"}, {"type": "plain", "text": "[문 제] 아래 제시문을 통해 제공된 상황(시간과 공간) 내에서 세 개의 키워드를 활용하여 이후의"}, {"type": "instruction", "text": "상황을 이야기로 완성하시오."}, {"type": "plain", "text": "* 원고지 2,500자 내외로 작성하고, 사용된 키워드에 밑줄을 그세요. (예: ‘안경’이 키워드일 경우, 안경)"}, {"type": "prompt", "text": "이곳은 대학가 근처의 주택단지이다. 이곳에는 모두 세 개의 편의점이 있다. 세 개의 편의점은\n주택단지를 중심으로 서로 삼십 미터가 안 되는 거리에 삼각형 모양으로 배치되어 있다.\n엘지25시는 주택단지 근처에, 바로 맞은편에 패밀리마트가, 그리고 패밀리마트에서 조금\n떨어진 곳에 세븐일레븐이 있다. 주택단지로부터 엘지25시는 일직선, 패밀리마트는 니은자\n모양, 세븐일레븐은 디귿자 모양을 그리고 있는 셈이다.\n세 편의점이 언제부터 이곳에 생겼는지는 기억나지 않는다. 이곳은 쉴새없이 무언가 생겼다\n사라졌고, 생긴 게 또다시 생기곤 했다. 모텔, 피씨방, 테이크아웃 커피점, 호프집, 분식집...\n편의점은 언제부턴가 그것들 틈에 말쑥한 차림의 전입생처럼 앉아 있었다."}], "source_url": "https://blog.naver.com/365films/221710500224", "source_date": "2019. 11. 17."}, {"sections": [{"type": "year_meta", "year": "2019", "rest": "수시전형 단국대학교 #영화과기출문제 입니다."}, {"type": "plain", "text": "1차 이야기 구성 기출문제이구요, 2차 면접은 개개인에 따라 다르기에 기출문제가 따로 있지 않습니다. 제시된 상황과 공간+제시 단어의 조합이 중요한 단국대 영화과 이야기 구성입니다. 단국대학교"}, {"type": "year_meta", "year": "2019", "rest": "수시 신입생 모집 공연영화학부 실기고사문제 <영화(이론‧연출‧스탭)>"}, {"type": "bullet", "text": "이야기구성"}, {"type": "plain", "text": "[문 제] 아래 제시문을 통해 제공된 상황(시간과 공간) 내에서 세 개의 키워드를 활용하여 이후의"}, {"type": "instruction", "text": "상황을 이야기로 완성하시오."}, {"type": "bullet", "text": "원고지 2,000자 내외로 작성하고, 사용된 키워드에 밑줄을 그세요."}, {"type": "plain", "text": "(예: ‘안경’이 키워드일 경우, 안경)"}, {"type": "prompt", "text": "이 식당은 마치 뚜껑이 닫힌 상자와도 같다. 여기서는 밤새도록 국밥이며 간단한\n찌개를 주문할 수 있다. 연극이 파한 후에 밤참을 먹으러 가곤 하는 곳이다. 순경들은\n밤에 도착한, 배가 고픈 여행자들에게 이곳에 가도록 일러준다. 나무 식탁이 여덟 개\n있다. 벽을 타고 걸상이 죽 놓여 있다. 두 창문과 문의 유리는 불투명하다. 카운터는\n구석 깊숙이 있다. 카운터 옆에 방이 하나 있지만, 나는 거기에 들어가 본 적이 없다. “국밥 하나 주세요.”\n식당 여주인이 고개를 끄덕한다. 볼이 불그스레하고 몸짓이 큰 중년부인인데, 남자\n에게 말을 할 때는 웃음을 참지 못한다."}, {"type": "keywords", "items": ["카운터", "휴지통", "벽걸이 TV"]}], "source_url": "https://blog.naver.com/365films/221507640749", "source_date": "2019. 4. 7."}, {"sections": [{"type": "year_meta", "year": "2018", "rest": "단국대 공연영화학부 영화"}, {"type": "plain", "text": "(이론ㆍ연출ㆍ스탭) 기출문제 ● 이야기구성"}, {"type": "instruction", "text": "아래 제시문을 통해 제공된 상황(시간과 공간) 내에서 세 개의 키워드를 활용하여 이후의 상황을 이야기로 완성하시오."}, {"type": "bullet", "text": "원고지 2,500자 내외로 작성하고, 사용된 키워드에 밑줄을 그세요."}, {"type": "plain", "text": "(예: ‘안경’이 키워드일 경우, 안경)"}, {"type": "prompt", "text": "나는 에스컬레이터에서 내려 주방용품들이 진열된 가판대를 지나 백화점 바자회장으로 들어섰다. 바로 그 순간 10여 미터 앞에 비스듬하게 숙인 머리를 발견했다. 내 몸은 번개를 맞은 듯 곧추섰고 하나의 이름이 내 입에서 튀어나왔다.\n“이주호!”\n몇몇 사람들이 고개를 돌려 나를 돌아보았다. 그러나 모발이 반쯤 거덜난 듯한 그 머리의 사나이는 오른손에 든 커다란 인형에 몸을 기대며 오른쪽 비상구 쪽으로 몸을 돌렸다. 내가 잘못 본 것일까. 가발을 쓰지도 않고 돌아다닐 리가 없다는 생각에 반신반의하면서도 나는 사람들을 밀치며 앞으로 나아갔다. 그자가 곧바로 오른쪽 모퉁이를 돌아서는 옆모습을 보는 순간 나는 아! 하는 비명을 삼켰다. 머리가 좀 더 벗겨지긴 했지만 그자는 분명 이주호였다. 하지만 곰인형이라니. 나는 걷잡을 수 없는 흥분으로 사람들을 거칠게 밀어붙이며 뛰기 시작했다."}, {"type": "keywords", "items": ["가발", "곰인형", "거울"]}], "source_url": "https://blog.naver.com/365films/221456520343", "source_date": "2019. 2. 1."}], "2018": [{"sections": [{"type": "year_meta", "year": "2018", "rest": "수시 기출문제 입니다."}, {"type": "plain", "text": "각 학교마다 출제형식 및 원하는 글쓰기 스타일이 다르기 때문에 획일화 된 수업이 아닌 맞춤형 수업이 필요합니다. 또 학생들이 선호하는 학교들은 작문(이야기구성, 스토리보드 구성, 영화분석 등) 이 필수이기에, 포기하면 안되는 항목입니다. 글쓰기 실기 항목이 들어가는 학교 단국대 영화과, 동국대 영화영상학과, 중앙대 영화과, 세종대 영화예술학과, 국민대 영화과, 경희대 영화과,  인하대 연극영화과, 명지대 영화과, 서울예대 영화과  등등 단국대 영화과에선"}], "source_url": "https://blog.naver.com/365films/221456520343", "source_date": "2019. 2. 1."}]}, "total_blocks": 14, "sparse": false, "sources": [{"url": "https://blog.naver.com/365films/223436202632", "title": "[ 영화과 편입 실기 준비 학원 과외 ] 2024학년도 단국대학교 편입학 모집 실기고사 문제 &lt;영화전공(이론·연출·스탭)&gt; _ 이야기구성, 기출문제", "date": "2024. 5. 4."}, {"url": "https://blog.naver.com/365films/223432208708", "title": "[영화과 실기 학원 과외 ] 2024학년도 수시 신입생 모집 단국대학교 실기고사 문제 공연영화학부 &lt;영화전공(이론‧연출‧스탭)&gt; _ 실기 위주 영화과, 이야기 구성", "date": "2024. 4. 30."}, {"url": "https://blog.naver.com/365films/223389115575", "title": "[실기과외학원 영화과]  단국대학교 &lt;영화전공(이론‧연출‧스탭)&gt; 실기고사 기출문제 _ 이야기구성, 구술면접 실기위주", "date": "2024. 3. 20."}, {"url": "https://blog.naver.com/365films/223069419587", "title": "[ 영화과 기출문제 ] 2023학년도 단국대학교 &lt;영화전공(이론‧연출‧스탭)&gt; 실기고사 기출문제 이야기구성", "date": "2023. 4. 9."}, {"url": "https://blog.naver.com/365films/222675300423", "title": "영화과 기출문제 - 단국대학교 2022학년도 수시 신입생 모집 공연영화학부 실기고사 문제 &lt;영화(이론‧연출‧스탭)&gt; 이야기구성", "date": "2022. 3. 17."}, {"url": "https://blog.naver.com/365films/222306005731", "title": "[ 영화과 과외 ] 2021학년도 단국대학교 영화 (이론 연출 스태프) 전공 실기고사 기출문제", "date": "2021. 4. 11."}], "meta": {"category": "major", "admission": "수시 실기 위주 (정시는 수능 100%)", "recruit": "12명", "ratio": "1차 실기 70% + 학생부 30% / 2차 1단계 70% + 면접 30%", "stages": [{"name": "1차 실기", "detail": "이야기구성 (제시문 + 키워드 3개 → 이후 상황 작성)"}, {"name": "2차 면접", "detail": "구술면접"}], "duration": "3시간 / 원고지 1,600~2,000자", "tip": "키워드 3개 모두 사용 + 밑줄. 제시된 시공간 안에서 자연스럽게 전개"}}, "sungkyun": {"name": "성균관대", "full_name": "성균관대학교 영상학과 / 연기예술학과(연출)", "exam_type": "영상학과 특기자 + 연기예술 연출", "years": ["2026", "2025", "2024", "2018"], "blocks_by_year": {"2026": [{"sections": [{"type": "year_meta", "year": "2026", "rest": "수시모집 성균관대학교 영상학과 특기자 전형 기출문제를 준비했습니다."}, {"type": "plain", "text": "성균관대 영상학과는 학과전형, 학교장 추천, 특기자전형등 다양한 전형으로 인원을 선발하는 만큼 자신에게 맞는 전형을 찾아 전략적으로 준비하는 것이 중요합니다. 성균관대 영상학과 특기자 전형 입시 준비 수강문의 [ 영상학과 실기 학원 ]"}, {"type": "year_meta", "year": "2026", "rest": "수시모집 성균관대학교 영상학과 특기자 전형 기출문제"}, {"type": "plain", "text": "성균관대 영상학과 특기자 전형 1차 학생부 서류 100% 학생부, 활동증빙자료(필수)- 3배수 2차 서류 40% + 실기 60% 성균관대 영상학과 특기자 전형은 포트폴리오 준비부터 실기 준비까지 완벽하게 준비되어 있어야 지원이 가능합니다. 포트폴리오 준비 같은 경우는 같은 영상을 찍어도 포트폴리오를 어떻게 준비하느냐에 따라 1차 합격의 당락이 결정되며, 1차 합격을 대비해 2차 실기 준비는 필수입니다. 성균관대 영상학과 실기 준비 TIP!! 성균관대 영상학과 특기자 실기 같은 경우는 학생이 사회를 어떻게 보느냐를 바라보는 문제들이 많이 나옵니다. 글쓰기가 아니라 면접으로 실기시험을 보는 만큼 평소 자신의 생각을 조리 있게 말하는 훈련이 필수입니다."}, {"type": "year_meta", "year": "2026", "rest": "수시모집 성균관대 영상학과 특기자 전형 기출문제"}, {"type": "plain", "text": "① “사진에 보이는 것은 무엇인가? 이를 자유롭게 해석해 보라” 실기전형부터 학생부 종합, 특기자 전형까지 학생 개인에게 맞는 입시 준비를 통해 매해 높은 합격률을 자랑하고 있습니다."}], "source_url": "https://blog.naver.com/365films/224231622607", "source_date": "2026. 3. 27."}, {"sections": [{"type": "plain", "text": "성균관대학교 연기예술학과 연출전공 2차 실기 » 기초연출역량"}, {"type": "prompt", "text": "<학교 동아리에서 진행하는 그룹프로젝트가 있는 날이었다 그 그룹에는 잘 보이고 싶은 남 여학생이 있는데 마음에 드는 옷이 없어 몰래 동생 옷을 입고 집을 나가다가 동생에게 들켰 다 하루만 빌려달라고 애원했는데 동생은 당장 벗으라고 소리쳤다 나는 동생과 실랑이하다 . . 가 몸싸움까지 하게 되었고 동생이 휘두르는 손톱에 긁혀 얼굴에 손톱자국까지 났다 나는 . 얼굴에 난 손톱자국을 반창고로 가리고 허겁지겁 동아리방으로 갔다 모두에게 미안하다고 . 했는데 내가 마음에 두고 있는 남 여학생이 인상을 찌푸리며 나에게 말했다 너무 책임감 / . “ 없는 거 아냐 다들 너만 기다리며 아무 일도 못 하고 있었잖아 ? !” >\n이후에 벌어지는 일을 짧은 시놉시스로 창작하시오. 해설) ① 시놉시스는 일인칭 시점으로 구성해야 함 ② 시놉시스는 명확한 기승전결이 있어야 함\n*아래 파일을 꼭 다시 한번 확인 해주세요 *"}], "source_url": "https://blog.naver.com/365films/223846939076", "source_date": "2025. 4. 26."}], "2025": [{"sections": [{"type": "year_meta", "year": "2025", "rest": "수시모집 성균관대 연기예술 연출전공 기출문제가 발표되었습니다."}, {"type": "plain", "text": "성균관대 연기예술학과 연출전공은 수시모집에서 소수의 인원만 선발하고 있으며, 1차 학생부 종합으로 인원을 선발합니다. 성균관대 연기예술 연출을 희망하는 학생은 학생부관리 + 성적 + 실기까지 전체를 다 준비해야 지원 할 수 있습니다."}], "source_url": "https://blog.naver.com/365films/223846939076", "source_date": "2025. 4. 26."}], "2024": [{"sections": [{"type": "year_meta", "year": "2024", "rest": "성균관대학교 연기예술 연출 전공 기초 연출 역량 실기 기출문제 _ 1차 서류 학생부 종합, 2차 실기 글쓰기 면접"}, {"type": "plain", "text": "Q. 성균관대 연기예술 연출 커트라인 입결은 어떻게 될까요? A. 성균관대 연기예술 연출 전공은 성적만 보는 것이 아닌, 1차 서류 전체를 보기에 입결이 어느 정도 되어야 한다는 정확한 수치는 말씀드릴 수 없습니다. 하지만 높으면 높을수록 1차 서류 합격에 유리합니다. 또 성적뿐 아니라 생기부 내용도 중요하니 참고하세요. 성균관대 연기예술 연출 전공 전문 과외 학원 성균관대학교 연기예술 연출 전공은 1차 서류, 2차 글쓰기 + 면접고사를 치릅니다."}, {"type": "year_meta", "year": "2024", "rest": "성균관대학교 연기예술 연출 전공 기초 연출 역량 실기 기출문제 _ 1차 서류 학생부 종합, 2차 실기 글쓰기 면접"}, {"type": "plain", "text": "Q. 성균관대 연기예술 연출 실기 준비는 언제부터 해야 할
