<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>피리어드 · 학생 자료실</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f4f6;--surface:#fff;
  --border:rgba(0,0,0,0.09);--border-mid:rgba(0,0,0,0.15);
  --text:#111;--text-2:#4a4a4a;--text-3:#888;
  --blue:#3182F6;--radius:12px;
}
body{
  font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:2rem 1.25rem;
  -webkit-font-smoothing:antialiased;
}
.card{
  background:var(--surface);border-radius:20px;
  box-shadow:0 2px 20px rgba(0,0,0,0.08);
  padding:2.5rem 2rem;width:100%;max-width:380px;
}
.logo{text-align:center;margin-bottom:2rem}
.logo-tag{font-size:0.75rem;font-weight:700;letter-spacing:1.5px;color:var(--text-3);text-transform:uppercase;margin-bottom:0.375rem}
.logo-name{font-size:1.5rem;font-weight:800;letter-spacing:-0.5px}
.logo-name em{font-style:normal;color:var(--blue);font-size:1.75rem;line-height:0;vertical-align:-0.1em}
.logo-sub{font-size:0.8125rem;color:var(--text-3);margin-top:0.375rem}

.form-group{margin-bottom:1rem}
label{display:block;font-size:0.875rem;font-weight:700;color:var(--text);margin-bottom:0.5rem}
input{
  width:100%;padding:0.875rem 1rem;
  border:1px solid var(--border-mid);border-radius:var(--radius);
  font-size:1rem;font-family:inherit;color:var(--text);
  background:#fff;transition:border-color 0.15s;
}
input:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px rgba(49,130,246,0.12)}
input[type=password]{letter-spacing:0.2em}

.btn{
  width:100%;padding:0.9375rem;border:0;border-radius:var(--radius);
  background:var(--blue);color:#fff;
  font-size:1rem;font-weight:800;font-family:inherit;
  cursor:pointer;margin-top:0.5rem;
  transition:background 0.15s,transform 0.1s;
}
.btn:hover{background:#1d6fdb}
.btn:active{transform:scale(0.98)}

.error{
  display:none;margin-top:1rem;padding:0.75rem 1rem;
  background:#fff2f2;border:1px solid #ffcccc;border-radius:var(--radius);
  font-size:0.875rem;color:#cc0000;text-align:center;
}
.hint{margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid var(--border);text-align:center;font-size:0.8125rem;color:var(--text-3)}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <p class="logo-tag">영화과외</p>
    <p class="logo-name">Period<em>.</em></p>
    <p class="logo-sub">학생 자료실</p>
  </div>

  <form id="loginForm">
    <div class="form-group">
      <label>이름</label>
      <input type="text" id="nameInput" placeholder="본인 이름 입력" autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
    <div class="form-group">
      <label>비밀번호</label>
      <input type="password" id="pwInput" placeholder="숫자 4자리" maxlength="4" inputmode="numeric" pattern="[0-9]*">
    </div>
    <button type="submit" class="btn">입장</button>
    <div class="error" id="errorMsg">이름 또는 비밀번호가 올바르지 않습니다.</div>
  </form>

  <p class="hint">비밀번호를 모르면 선생님께 문의하세요.</p>
</div>

<script>
const STUDENTS = {
  "이승원": { pw: "1178", id: "sw" },
  "현유빈": { pw: "3836", id: "yb" },
  "김혜린": { pw: "6115", id: "hr" },
};

document.getElementById('loginForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const name = document.getElementById('nameInput').value.trim();
  const pw   = document.getElementById('pwInput').value.trim();
  const err  = document.getElementById('errorMsg');

  const student = STUDENTS[name];
  if (student && student.pw === pw) {
    sessionStorage.setItem('period_student', name);
    location.href = student.id + '/';
  } else {
    err.style.display = 'block';
    document.getElementById('pwInput').value = '';
    document.getElementById('pwInput').focus();
  }
});

// 숫자만 입력
document.getElementById('pwInput').addEventListener('input', function() {
  this.value = this.value.replace(/\D/g, '');
});
</script>
</body>
</html>
